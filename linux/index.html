<style>
/* Layout: 데이터베이스 문제집과 같은 펼친 면. 왼쪽 여백은 강의 색인, 오른쪽은 노트 또는 셀프 체크 한 장. */
:root {
  --paper: #f7f9fb;
  --sheet: #ffffff;
  --ink: #18222c;
  --muted: #5a6875;
  --line: #d9e1e8;
  --accent: #1d5c8a;
  --accent-soft: #e3eef7;
  --mark: #fde68a;
  --mark-ink: #5b4300;
  --ok: #2c8556;
  --ok-soft: #e1f3e8;
  --warn: #b7791f;
  --warn-soft: #fbf0d9;
  --bad: #c0392b;
  --bad-soft: #fbe5e2;
  --code-bg: #eef2f6;
  --f-display: "Hahmlet", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-code: "Nanum Gothic Coding", "D2Coding", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161b; --sheet: #171e25; --ink: #e3e9ef; --muted: #96a3af; --line: #2a3540;
    --accent: #7db4df; --accent-soft: #1d2d3b; --mark: #4d4012; --mark-ink: #f8e3a0;
    --ok: #5cc48c; --ok-soft: #173326; --warn: #e0a84a; --warn-soft: #3a2e15; --bad: #f07a6c; --bad-soft: #3d1f1c;
    --code-bg: #10161c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161b; --sheet: #171e25; --ink: #e3e9ef; --muted: #96a3af; --line: #2a3540;
  --accent: #7db4df; --accent-soft: #1d2d3b; --mark: #4d4012; --mark-ink: #f8e3a0;
  --ok: #5cc48c; --ok-soft: #173326; --warn: #e0a84a; --warn-soft: #3a2e15; --bad: #f07a6c; --bad-soft: #3d1f1c;
  --code-bg: #10161c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
table { font: inherit; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre, .mono, kbd { font-family: var(--f-code); }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
kbd { font-size: .82em; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--sheet); padding: 0 5px; border-radius: 4px; white-space: nowrap; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }

/* 상단 */
.top { border-bottom: 1px solid var(--line); background: var(--sheet);
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }
.brand { min-width: 0; flex: 1 1 420px; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .86rem; max-width: 80ch; }
.top-right { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.meter { display: flex; flex-direction: column; gap: 3px; min-width: 150px; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.btn-ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: .85rem; }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-ghost.warn { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px;
  padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 강의 색인 */
aside { min-width: 0; }
.parts { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; background: var(--sheet); }
.parts button { border: 0; background: none; padding: 9px 2px; font-weight: 600; font-size: .86rem; color: var(--muted); }
.parts button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
.nav-toggle { display: none; width: 100%; margin-bottom: 10px; }
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.stage { padding: 8px 10px 9px; border-radius: 8px; border-left: 3px solid transparent; }
.stage.here { background: var(--sheet); border-left-color: var(--accent); box-shadow: 0 1px 0 var(--line); }
.st-head { display: flex; align-items: baseline; gap: 8px; font-size: .9rem; }
.st-no { font-family: var(--f-code); font-size: .75rem; color: var(--muted); width: 1.6em; flex: none; }
.st-name { font-weight: 600; flex: 1; min-width: 0; }
.st-count { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.st-count.done { color: var(--ok); font-weight: 600; }
.st-sub { font-size: .76rem; color: var(--muted); margin: 2px 0 0 2.15em; }
.st-btn { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; color: inherit; }
.st-btn:hover .st-name { color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; padding: 8px 14px; font-weight: 500; font-size: .9rem; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.source { margin-top: 14px; font-size: .74rem; color: var(--muted); }

/* 한 장 */
main { min-width: 0; }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px 22px; }
.crumb { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: .8rem; color: var(--muted); margin-bottom: 8px; }
.crumb b { color: var(--accent); font-weight: 600; }
.sheet h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.32rem; margin: 0 0 10px; line-height: 1.35; text-wrap: balance; }
.c-title { font-size: 1.6rem !important; font-weight: 800 !important; }
.lead { font-size: 1.06rem; line-height: 1.7; max-width: 66ch; margin: 0 0 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line); color: var(--muted); }

/* 노트 본문 */
.concept { max-width: 78ch; }
.concept h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.08rem; margin: 26px 0 8px; }
.concept p { margin: 0 0 10px; }
.concept ul, .concept ol { margin: 0 0 12px; padding-left: 1.3em; }
.concept li { margin-bottom: 4px; }
.concept small { color: var(--muted); font-size: .84rem; }
.key { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; }
.key .key-l { display: block; font-size: .74rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; margin-bottom: 2px; }
.key ul { margin: 0 !important; }
.doc-wrap { overflow-x: auto; max-width: 100%; margin: 6px 0 14px; }
table.doc { border-collapse: collapse; font-size: .9rem; }
table.doc th, table.doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
table.doc th { background: var(--code-bg); font-weight: 600; white-space: nowrap; }
table.doc td:first-child { white-space: nowrap; }
.code { position: relative; margin: 4px 0 12px; max-width: 100%; }
.code pre { background: var(--code-bg); border-radius: 10px; padding: 12px 16px; overflow-x: auto; font-size: .88rem; line-height: 1.6; margin: 0; tab-size: 4; }
.code pre .c { color: var(--muted); }
.code pre .p { color: var(--accent); user-select: none; }
.copy { position: absolute; top: 6px; right: 6px; font-size: .74rem; color: var(--muted); background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
.copy:hover { border-color: var(--accent); color: var(--accent); }
.xtag, .ptag { display: inline-block; font-family: var(--f-body); font-size: .72rem; font-weight: 600; border-radius: 4px; padding: 0 6px; margin: 0 4px 0 0; vertical-align: 1px; white-space: nowrap; }
.xtag { color: var(--muted); background: var(--code-bg); border: 1px dashed var(--line); }
.ptag { color: var(--warn); background: var(--sheet); border: 1px solid var(--warn); }
.concept .note { background: var(--code-bg); border-radius: 8px; padding: 8px 14px; margin: 8px 0 12px; font-size: .92rem; }
.pit { border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 8px 8px 0; padding: 8px 14px; margin: 8px 0 12px; font-size: .92rem; }
.pit code { background: rgba(255, 255, 255, .5); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0 14px; font-size: .86rem; }
.chain span { border: 1.5px solid var(--accent); border-radius: 6px; padding: 3px 9px; font-weight: 600; line-height: 1.4; }
.chain span small { font-weight: 400; }
.chain span.hl { background: var(--accent); color: var(--sheet); }
.chain span.hl small, .chain span.hl code { color: var(--sheet); background: none; }
.chain i { font-style: normal; color: var(--muted); font-size: .8rem; text-align: center; line-height: 1.3; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px; margin: 6px 0 12px; }
.cols > div { min-width: 0; }
.stack { display: grid; gap: 4px; max-width: 420px; margin: 8px 0; font-size: .88rem; }
.stack div { border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; background: var(--sheet); display: flex; justify-content: space-between; gap: 12px; }
.stack div span { color: var(--muted); font-size: .8rem; text-align: right; }
.stack .hl { border: 1.5px solid var(--accent); background: var(--accent-soft); }

.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.pager .btn { min-width: 120px; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 치트시트 */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--sheet); color: var(--ink); max-width: min(1000px, 94vw); width: 100%; max-height: 88vh; padding: 0; }
dialog::backdrop { background: rgba(10, 20, 30, .45); }
.dlg-head { position: sticky; top: 0; z-index: 1; background: var(--sheet); display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { margin: 0; font-family: var(--f-display); font-size: 1.1rem; }
.dlg-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 320px; justify-content: flex-end; }
.dlg-tools input { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--paper); }
.dlg-tools input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.dlg-body { padding: 14px 18px 22px; }
.fchips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
.fchips button { border: 1px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 2px 11px; font-size: .8rem; }
.fchips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
#cheatTable { width: 100%; }
#cheatTable td:nth-child(3) { white-space: nowrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: .82rem; font-family: var(--f-code); }
.empty { padding: 18px; text-align: center; color: var(--muted); }

@media (max-width: 880px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .nav-toggle { display: block; }
  aside.closed .stages, aside.closed .source { display: none; }
  .sheet { padding: 18px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<template id="t-l1">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>리눅스는 엄밀히 말하면 운영체제가 아니라 <b>커널</b>이다. (커널 ⊂ 운영체제)</li>
        <li>핵심 특징: 오픈소스, 다중 사용자, 다중 작업, 다양한 배포판, 활발한 커뮤니티</li>
        <li>GNU 프로젝트(1983) + 리누스 토르발스의 커널(1991) = GNU/Linux</li>
      </ul></div>
<h3>운영체제 vs 커널</h3>
      <div class="cols">
        <div>
          <ul>
            <li><b>운영체제(OS)</b>: 하드웨어 자원을 관리하고 프로그램 실행을 돕는 전체 소프트웨어. 예: Windows, macOS, Android, iOS</li>
            <li><b>커널(Kernel)</b>: OS의 핵심. 장치 관리, 네트워크 자원 관리, 보안, 시스템 소프트웨어를 담당</li>
          </ul>
        </div>
        <div class="stack" aria-label="운영체제 안에 커널이 포함된 구조">
          <div><b>운영체제 (OS)</b><span>응용 프로그램 · 셸 · 유틸리티</span></div>
          <div class="hl"><b>커널 = 리눅스</b><span>장치 · 네트워크 · 보안</span></div>
          <div><b>하드웨어</b><span>CPU · 메모리 · 디스크</span></div>
        </div>
      </div>

      <h3>커널의 5가지 핵심 특징</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>특징</th><th>설명</th></tr>
        <tr><td>오픈소스</td><td>누구나 사용, 수정, 배포할 수 있다.</td></tr>
        <tr><td>다중 사용자</td><td>여러 사용자가 동시에 접속해 시스템을 쓸 수 있다.</td></tr>
        <tr><td>다중 작업</td><td>작업을 아주 짧은 시간 단위로 나눠 실행해 동시에 도는 것처럼 동작한다.</td></tr>
        <tr><td>다양한 배포판</td><td>같은 커널 위에 서로 다른 소프트웨어를 묶어 제공한다. 예: Debian, Ubuntu, CentOS, RHEL</td></tr>
        <tr><td>활발한 커뮤니티</td><td>버그 리포트, 수정, 문서화에 많은 개발자가 참여한다.</td></tr>
      </table></div>

      <h3>탄생 배경</h3>
      <div class="chain">
        <span>UNIX<br><small>상용 · 소수 독점</small></span><i>→</i>
        <span>GNU 프로젝트 (1983)<br><small>리차드 스톨만 · FSF</small></span><i>+</i>
        <span>리눅스 커널 (1991)<br><small>리누스 토르발스</small></span><i>=</i>
        <span class="hl">GNU/Linux</span>
      </div>
      <ul>
        <li><b>UNIX</b>: 다중 사용자·다중 작업의 원조이자 대부분 OS의 참조 모델. 상용이라 활용에 한계가 있었다.</li>
        <li><b>GNU</b>: "GNU's Not Unix". 유닉스와 호환되는 자유 소프트웨어를 만드는 운동. Emacs, GCC 등이 포함된다.</li>
        <li>보통 "리눅스"라고 하면 GNU/Linux 또는 배포판 전체를 통칭한다.</li>
      </ul>

      <h3>주요 활용 분야</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>분야</th><th>리눅스를 쓰는 이유</th></tr>
        <tr><td>서버 · 클라우드</td><td>높은 안정성, 네트워크 보안, 무료 라이선스. AWS, GCP, Azure의 기반</td></tr>
        <tr><td>슈퍼컴퓨터</td><td>자유로운 커스텀과 정밀한 하드웨어 제어. 대부분이 리눅스 기반</td></tr>
        <tr><td>개발자 데스크톱</td><td>다양한 개발 도구와 유연한 제어 환경</td></tr>
        <tr><td>모바일 (Android)</td><td>가볍고 모듈화가 쉬우며 하드웨어에 맞게 수정 가능</td></tr>
        <tr><td>임베디드 · IoT</td><td>스마트 TV, 내비게이션, 카메라 등. 제한된 자원에 맞춘 최적화</td></tr>
      </table></div>

<template id="t-l2">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>구성: 응용 프로그램 → 셸 → 커널 → 하드웨어</li>
        <li>셸 = 사용자의 명령을 해석해 커널에 전달하는 <b>명령어 해석기</b></li>
        <li>대부분의 리눅스 기본 셸은 <code>bash</code>. 설치된 셸 목록은 <code>cat /etc/shells</code></li>
      </ul></div>
<h3>시스템 구성요소</h3>
      <div class="cols">
        <div class="stack" aria-label="리눅스 시스템 계층">
          <div><b>응용 프로그램</b><span>문서 작성 · 웹 · 게임</span></div>
          <div class="hl"><b>셸 (Shell)</b><span>명령 해석 · 전달</span></div>
          <div><b>커널 (Kernel)</b><span>프로세스 · 파일 · 장치 드라이버</span></div>
          <div><b>하드웨어</b><span>CPU · GPU · 메모리 · 키보드</span></div>
        </div>
        <div><ul>
          <li><b>응용 프로그램</b>: 사용자가 원하는 특정 작업을 하는 소프트웨어</li>
          <li><b>셸</b>: 사용자와 커널 사이의 인터페이스</li>
          <li><b>커널</b>: 장치, 프로세스, 네트워크, 보안, 파일 관리. <b>장치 드라이버</b>가 내장되어 있다</li>
          <li><b>하드웨어</b>: 장치 드라이버를 통해 신호가 식별되고 제어된다 (예: 키보드 입력 이벤트 처리)</li>
        </ul></div>
      </div>

      <h3>셸의 역할</h3>
      <div class="chain"><span>사용자</span><i>명령 →</i><span class="hl">셸 (해석)</span><i>→</i><span>커널 (처리)</span><i>→ 결과 →</i><span class="hl">셸</span><i>→</i><span>사용자</span></div>
      <p>셸(shell)은 "껍데기"라는 뜻으로, 하드웨어를 제어하는 핵심(커널)을 감싸고 사용자가 커널을 다룰 수 있게 돕습니다.</p>

      <h3>셸의 종류</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>셸</th><th>명령</th><th>특징</th></tr>
        <tr><td>본 셸 (Bourne)</td><td><code>sh</code></td><td>최초 유닉스의 기본 셸</td></tr>
        <tr><td>C 셸</td><td><code>csh</code></td><td>C 언어 스타일 문법</td></tr>
        <tr><td>콘 셸 (Korn)</td><td><code>ksh</code></td><td>본 셸 + 명령어 완성 등 기능 추가</td></tr>
        <tr><td>배시 셸 (Bourne-Again)</td><td><code>bash</code></td><td>대부분 리눅스의 기본 로그인 셸</td></tr>
        <tr><td>기타</td><td><code>tcsh</code>, <code>zsh</code></td><td>필요에 따라 선택해 사용</td></tr>
      </table></div>

      <h3>bash vs sh 실습 비교</h3>
      <div class="code"><pre><span class="p">$ </span>cat /etc/shells   <span class="c"># 설치된 셸 목록</span>
<span class="p">$ </span>sh                <span class="c"># 본 셸로 전환</span>
<span class="p">$ </span>exit              <span class="c"># 다시 bash로 복귀</span></pre></div>
      <div class="doc-wrap"><table class="doc">
        <tr><th></th><th>bash</th><th>sh</th></tr>
        <tr><td><code>ls</code> 색상</td><td>파일/디렉토리를 색으로 구분</td><td>색 구분 없음</td></tr>
        <tr><td><kbd>Tab</kbd> 자동 완성</td><td>지원</td><td>미지원 (공백 입력됨, 전체 이름을 직접 입력)</td></tr>
      </table></div>
</template>
<template id="t-l3">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>배포판 = 리눅스 커널 + 셸 + 응용 소프트웨어를 묶은 완성된 OS</li>
        <li><b>데비안 계열</b>과 <b>레드햇 계열</b> 두 가지만 알아도 대부분 다룰 수 있다</li>
        <li>패키지 관리자가 의존성을 자동으로 해결한다: <code>apt</code> (데비안), <code>dnf</code>/<code>yum</code> (레드햇)</li>
      </ul></div>
<h3>배포판이란</h3>
      <ul>
        <li>모든 배포판은 리눅스 커널을 공통으로 쓰고, 어떤 셸과 응용 프로그램을 탑재하느냐에 따라 달라진다.</li>
        <li>목적에 따라 수백 가지가 있고 지금도 계속 생겨난다.</li>
      </ul>

      <h3>대표 배포판과 패키지 관리자</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>배포판</th><th>특징</th><th>패키지 관리자</th></tr>
        <tr><td>Slackware</td><td>가장 오래된 배포판 중 하나. 단순성, 수동 설정 위주라 전문가용</td><td><code>pkgtool</code></td></tr>
        <tr><td>Debian 계열<br><small>Debian, Ubuntu</small></td><td>자유 소프트웨어 철학, 높은 안정성·호환성. 서버, 데스크톱, 임베디드</td><td><code>apt</code></td></tr>
        <tr><td>Red Hat 계열<br><small>RHEL, Rocky Linux</small></td><td>기업용 상용. 강력한 기술 지원, 기업 서버·클라우드</td><td><code>dnf</code> / <code>yum</code></td></tr>
        <tr><td>Android</td><td>리눅스 커널 기반 모바일 OS. 스마트폰, TV, IoT</td><td>APK · Play 스토어</td></tr>
      </table></div>

      <h3>패키지와 의존성</h3>
      <ul>
        <li><b>패키지</b>: 소프트웨어, 라이브러리, 설정 파일 등을 하나로 묶은 배포 단위. 리눅스에서는 한 소프트웨어가 여러 패키지로 나뉘는 경우가 많다.</li>
        <li><b>의존성 문제</b>: 한 소프트웨어가 동작하려면 여러 패키지가 함께 필요하다. 연관 패키지가 업데이트되면 충돌이 생길 수 있다.</li>
        <li>과거에는 사용자가 직접 해결해야 했지만, 지금은 <b>패키지 관리자</b>가 설치·업데이트·삭제와 의존성 해결을 한 줄로 처리한다.</li>
      </ul>
      <div class="code"><pre><span class="p">$ </span>sudo apt install tree   <span class="c"># Ubuntu / Debian</span>
<span class="p">$ </span>sudo dnf install tree   <span class="c"># Rocky / RHEL</span></pre></div>
</template>
<template id="t-l4">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>가상화 = 물리 하드웨어를 추상화해 소프트웨어로 구현. 만들어진 가상 컴퓨터가 VM</li>
        <li>하이퍼바이저 Type 1(베어메탈) vs Type 2(호스트 기반). VirtualBox는 Type 2</li>
        <li>Windows에서 설치가 막히면 Visual C++ 재배포 패키지부터 설치 후 재부팅</li>
      </ul></div>
<h3>가상화와 VM</h3>
      <ul>
        <li>큰 방 하나를 여러 작은 방으로 나눠 쓰는 것과 비슷하다.</li>
        <li>장점: 하드웨어 자원을 효율적으로 쓰고, 한 컴퓨터에서 여러 OS를 동시에 실행할 수 있다.</li>
      </ul>

      <h3>하이퍼바이저 종류</h3>
      <div class="cols">
        <div>
          <b>Type 1 · 베어메탈</b>
          <div class="stack">
            <div><b>VM</b><span>Guest OS</span></div>
            <div class="hl"><b>하이퍼바이저</b><span></span></div>
            <div><b>하드웨어</b><span></span></div>
          </div>
          <small>호스트 OS 없이 하드웨어를 직접 제어. 성능·보안 우수</small>
        </div>
        <div>
          <b>Type 2 · 호스트 기반</b>
          <div class="stack">
            <div><b>VM</b><span>Guest OS</span></div>
            <div class="hl"><b>하이퍼바이저</b><span>VirtualBox</span></div>
            <div><b>Host OS</b><span>Windows · macOS</span></div>
            <div><b>하드웨어</b><span></span></div>
          </div>
          <small>기존 OS를 그대로 쓰니 편리, 실습용으로 적합. 한 단계를 더 거쳐 성능은 다소 낮고 보안 관리 지점이 늘어남</small>
        </div>
      </div>
      <p><b>VirtualBox</b>: Oracle이 만든 오픈소스 Type 2 하이퍼바이저. 다양한 호스트/게스트 OS를 지원하고 라이선스 제약 없이 실습할 수 있다. 다른 예: VMware, Xen, Hyper-V</p>

      <h3>설치 방법</h3>
      <div class="cols">
        <div><b>macOS</b><ul>
          <li>Apple 메뉴 › 이 Mac에 관하여에서 칩 확인</li>
          <li>Apple 실리콘(M1, M2…)과 Intel용 <code>.pkg</code>가 다르니 맞는 것을 받는다</li>
          <li><code>.pkg</code> 실행 → 설치 → 관리자 인증 → 완료</li>
        </ul></div>
        <div><b>Windows</b><ul>
          <li>설치 중단 팝업이 뜨면 <b>Microsoft Visual C++ 재배포 패키지</b> 먼저 설치</li>
          <li><kbd>Win</kbd>+<kbd>I</kbd> › 시스템 › 정보에서 아키텍처(x64 등) 확인 후 맞는 파일 설치</li>
          <li>설치 후 반드시 <b>재부팅</b>, 그다음 VirtualBox 설치</li>
          <li>네트워크 일시 끊김 경고 → 예. Python Core/Win32 옵션은 VM 자동화가 필요할 때만</li>
        </ul></div>
      </div>
</template>

<template id="t-l6">

<h3>등장 배경</h3>
      <ul>

        <li>레드햇에 합류한 뒤 정책이 바뀌어, 안정화 배포판이 아니라 RHEL보다 앞서 가는 테스트 성격(CentOS Stream)이 되었다.</li>
        <li>기존 CentOS의 철학을 잇기 위해 Rocky Linux가 등장했다.</li>
      </ul>
      <div class="note"><span class="xtag">강의 외 보충</span> CentOS가 레드햇에 합류한 것은 2014년이고, CentOS Stream 중심으로 전환한다고 발표한 것은 2020년입니다.</div>

      <h3>ISO 3가지 유형</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>ISO</th><th>크기</th><th>특징</th></tr>
        <tr><td>DVD</td><td>가장 큼</td><td>인터넷 없이 데스크톱과 소프트웨어를 한 번에 설치. 입문자 추천</td></tr>
        <tr><td>Boot</td><td>중간</td><td>부팅 후 인터넷으로 필요한 패키지만 골라 설치</td></tr>
        <tr><td>Minimal</td><td>가장 작음</td><td>명령어 기반 패키지만. 서버·경량 환경</td></tr>
      </table></div>
      <p>파일명 구조: 배포판 - 버전 - 아키텍처 - 설치 유형 <code>.iso</code></p>

      <h3>VM 설정</h3>
      <ul>
        <li>무인 설치 건너뛰기 체크 → VM이 꺼진 상태로 생성되므로 "시작"을 직접 누른다.</li>
        <li>RAM과 CPU는 호스트 자원의 50% 미만 (16GB → 8GB 미만, 8코어 → 4개 미만).</li>
        <li>가상 디스크 기본 20GB, 이미지 파일 확장자는 <code>.vdi</code>.</li>
      </ul>

      <h3>키보드/마우스 제어권</h3>
      <ul>
        <li>VM 화면을 클릭하면 제어권이 게스트 OS로 넘어간다.</li>
        <li>호스트로 되돌리는 <b>호스트 키</b>: Windows는 <kbd>오른쪽 Ctrl</kbd>, macOS는 <kbd>Command</kbd>.</li>
        <li>오른쪽 Ctrl이 없는 키보드라면 VirtualBox 환경설정 › 입력에서 호스트 키를 다른 키로 바꿀 수 있다.</li>
      </ul>

      <h3>설치 요약 화면 (붉은 항목은 필수)</h3>
      <ul>
        <li><b>설치 목적지</b>: 로컬 디스크 선택 후 완료</li>
        <li><b>root 계정</b>: 기본 비활성. 교육·복구 목적으로 활성화하고 비밀번호 설정</li>
        <li><b>사용자 생성</b>: 영문 계정, 관리자 권한 체크, 비밀번호 설정</li>
        <li>경고가 사라지면 "설치 시작" → 완료 후 "시스템 재시작" → 로그인 → 터미널 실행</li>
      </ul>

        <li>프롬프트 <code>사용자@호스트:위치$</code> — <code>$</code>는 일반 사용자, <code>#</code>은 root</li>
        <li>형식: <code>명령어 [옵션] [인자]</code>, 사이는 반드시 공백. <code>;</code>로 여러 명령을 한 줄에</li>
        <li><code>ls</code> <code>pwd</code> <code>cd</code> <code>mkdir</code> <code>touch</code> <code>rmdir</code> <code>rm</code> <code>clear</code></li>
      </ul></div>
<h3>명령 프롬프트 읽기</h3>
      <div class="code"><pre>ubuntu@linux:~$
<span class="c">#  │     │   │└ $ 일반 사용자 / # root</span>
<span class="c">#  │     │   └ 현재 위치 (~ = 홈 디렉토리)</span>
<span class="c">#  │     └ 호스트명 (컴퓨터의 네트워크 이름)</span>
<span class="c">#  └ 로그인한 사용자 이름</span></pre></div>
      <p>CLI(Command Line Interface)는 셸에 명령을 입력하고 결과를 텍스트로 확인하는 방식이다. 우분투 터미널은 검색창에서 <code>ter</code> 검색, Show Apps, 바탕화면 우클릭 › Open in Terminal로 연다.</p>

      <h3>명령어 형식</h3>
      <div class="code"><pre><span class="p">$ </span>ls -l /etc        <span class="c"># 명령어  옵션  인자</span>
<span class="p">$ </span>ls-l              <span class="c"># 붙여 쓰면 command not found</span>
<span class="p">$ </span>cd; pwd           <span class="c"># ; 로 두 명령을 연속 실행</span></pre></div>

      <h3>목록 조회와 이동</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>명령</th><th>동작</th></tr>
        <tr><td><code>ls</code></td><td>현재 디렉토리 목록</td></tr>
        <tr><td><code>ls -l</code></td><td>유형, 권한, 소유자, 크기, 수정 시간까지 상세히</td></tr>
        <tr><td><code>ls -a</code></td><td><code>.</code>으로 시작하는 숨김 파일까지</td></tr>
        <tr><td><code>ls -al</code></td><td>상세 + 숨김 파일 (옵션은 합쳐 쓸 수 있다)</td></tr>
        <tr><td><code>pwd</code></td><td>현재 위치의 절대 경로 출력 (예: <code>/home/ubuntu</code>)</td></tr>
        <tr><td><code>cd</code>, <code>cd ~</code>, <code>cd $HOME</code></td><td>홈 디렉토리로</td></tr>
        <tr><td><code>cd ..</code></td><td>상위(부모) 디렉토리로</td></tr>
        <tr><td><code>cd .</code></td><td>현재 위치 (그대로)</td></tr>
        <tr><td><code>clear</code></td><td>화면 지우기</td></tr>
      </table></div>

      <h3>생성과 삭제</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>명령</th><th>동작</th></tr>
        <tr><td><code>mkdir dir</code></td><td>디렉토리 생성</td></tr>
        <tr><td><code>mkdir -p A/B/C</code></td><td>없는 상위 디렉토리까지 한꺼번에 생성</td></tr>
        <tr><td><code>touch file</code></td><td>없으면 0바이트 빈 파일 생성, 있으면 시간 정보 갱신</td></tr>
        <tr><td><code>touch -a -t 202609181200.00 file</code></td><td>접근 시간을 지정한 시각(년월일시분.초)으로 변경</td></tr>
        <tr><td><code>rmdir dir</code></td><td><b>빈</b> 디렉토리만 삭제. 내용이 있으면 오류</td></tr>
        <tr><td><code>rm file</code></td><td>파일 삭제</td></tr>
        <tr><td><code>rm -r dir</code></td><td>디렉토리와 내부 전체를 재귀적으로 삭제</td></tr>
        <tr><td><code>rm -i file</code></td><td>삭제 전 확인 (<code>y</code> 삭제 / <code>n</code> 취소)</td></tr>
      </table></div>
      <div class="pit"><span class="ptag">주의</span> <code>rm</code>으로 지운 파일은 휴지통을 거치지 않습니다. <code>-r</code>은 "재귀(recursive)"이고, 확인 없이 강제로 지우는 옵션은 <code>-f</code>입니다. <code>rm -rf</code>는 특히 조심하세요.</div>
</template>
<template id="t-l8">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>루트 <code>/</code>에서 시작하는 거꾸로 된 나무(트리) 구조</li>
        <li><code>/bin</code> <code>/sbin</code> <code>/etc</code> <code>/home</code> <code>/dev</code> <code>/var</code>의 역할</li>
        <li><code>ls -l</code> 첫 글자로 파일 종류 구분: <code>-</code> <code>d</code> <code>c</code> <code>b</code> <code>l</code></li>
      </ul></div>
<h3>트리 구조</h3>
      <div class="cols">
        <div class="code tree"><pre>/
├── bin
├── sbin
├── etc
├── dev
├── var
└── home
    ├── ubuntu
    └── pi</pre></div>
        <div><ul>
          <li>위에서 아래로는 여러 갈래길이 있지만, 아래에서 위로는 길이 <b>하나</b>뿐이다.</li>
          <li>같은 계층의 디렉토리로 가려면 상위로 한 단계 올라갔다 내려와야 한다.</li>
        </ul></div>
      </div>

      <h3>주요 디렉토리</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>경로</th><th>내용</th></tr>
        <tr><td><code>/</code></td><td>루트. 모든 파일과 디렉토리의 최상위</td></tr>
        <tr><td><code>/bin</code></td><td>일반 사용자도 쓰는 기본 실행 파일(명령어)</td></tr>
        <tr><td><code>/sbin</code></td><td>관리자(root)용 명령어: 사용자 추가, 재부팅, 종료 등</td></tr>
        <tr><td><code>/etc</code></td><td>시스템 설정 파일: 계정, 네트워크, 편집기 설정</td></tr>
        <tr><td><code>/home</code></td><td>사용자 홈 디렉토리 모음 (<code>pi</code> 추가 시 <code>/home/pi</code>)</td></tr>
        <tr><td><code>/dev</code></td><td>키보드, 마우스, 디스크 등 장치 파일</td></tr>
        <tr><td><code>/var</code></td><td>로그, 캐시, 임시 파일, 웹 서버 파일 등 크기가 변하는 데이터</td></tr>
      </table></div>

      <h3>파일 종류 (<code>ls -l</code>의 첫 글자)</h3>
      <div class="code"><pre><span class="p">$ </span>ls -l
<b>-</b>rw-r--r-- 1 ubuntu ubuntu  220 Sep 18 notes.txt
<b>d</b>rwxr-xr-x 2 ubuntu ubuntu 4096 Sep 18 Documents
<b>l</b>rwxrwxrwx 1 root   root      7 Sep 18 bin -&gt; usr/bin</pre></div>
      <div class="doc-wrap"><table class="doc">
        <tr><th>기호</th><th>종류</th><th>설명</th></tr>
        <tr><td><code>-</code></td><td>일반 파일</td><td>텍스트, 실행 파일 등 실제 데이터</td></tr>
        <tr><td><code>d</code></td><td>디렉토리</td><td>다른 파일을 담는 파일 (윈도우의 폴더)</td></tr>
        <tr><td><code>c</code></td><td>문자 장치</td><td>키보드, 터미널 등 1바이트(문자) 단위 전송. <code>/dev</code>에 위치</td></tr>
        <tr><td><code>b</code></td><td>블록 장치</td><td>하드디스크 등 블록(1–4KB) 단위 전송. <code>/dev</code>에 위치</td></tr>
        <tr><td><code>l</code></td><td>링크</td><td>다른 파일로 연결 (윈도우의 바로가기)</td></tr>
        <tr><td><code>s</code> / <code>p</code></td><td>통신 파일</td><td>소켓, 명명된 파이프. 프로세스·네트워크 통신용</td></tr>
      </table></div>
</template>
<template id="t-l9">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>절대 경로: <code>/</code>부터 전체 주소. 어디서 출발해도 같다</li>
        <li>상대 경로: 현재 위치 기준 길 안내. 출발지에 따라 달라진다</li>
        <li>기호: <code>/</code> 루트·구분자, <code>.</code> 현재, <code>..</code> 상위, <code>~</code> 홈</li>
      </ul></div>
<h3>경로 기호</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>기호</th><th>의미</th><th>예시</th></tr>
        <tr><td><code>/</code></td><td>맨 앞이면 루트, 중간이면 구분자</td><td><code>/home/ubuntu</code></td></tr>
        <tr><td><code>.</code></td><td>현재 디렉토리</td><td><code>./hello.sh</code></td></tr>
        <tr><td><code>..</code></td><td>상위(부모) 디렉토리</td><td><code>../file</code></td></tr>
        <tr><td><code>~</code></td><td>로그인한 사용자의 홈</td><td><code>~/file</code></td></tr>
      </table></div>

      <h3>같은 이동, 두 가지 표현</h3>
      <div class="code"><pre><span class="c"># 준비: 홈에서 A/B/C 만들기</span>
<span class="p">$ </span>cd ~
<span class="p">$ </span>mkdir -p A/B/C
<span class="p">$ </span>tree A

<span class="c"># 홈 → B 로 이동</span>
<span class="p">$ </span>cd /home/ubuntu/A/B   <span class="c"># 절대 경로</span>
<span class="p">$ </span>cd A/B                <span class="c"># 상대 경로 (현재 위치가 홈일 때)</span>

<span class="c"># B → /home 으로 이동</span>
<span class="p">$ </span>cd /home              <span class="c"># 절대 경로</span>
<span class="p">$ </span>cd ../../..           <span class="c"># 상대 경로 (B → A → ubuntu → home)</span></pre></div>
      <div class="pit"><span class="ptag">노트 정정</span> 노트에는 B에서 <code>/home</code>으로 갈 때 <code>cd ../..</code>라고 적혀 있었는데, <code>/home/ubuntu/A/B</code>에서 <code>../..</code>는 <code>/home/ubuntu</code>입니다. <code>/home</code>까지 가려면 <code>../../..</code>가 필요합니다.</div>
      <ul>
        <li>목적지가 루트에 가까우면 <b>절대 경로</b>, 현재 위치 근처라면 <b>상대 경로</b>가 편하다.</li>
        <li><code>tree</code>가 없으면 <code>sudo apt install tree</code> (Ubuntu) 또는 <code>sudo dnf install tree</code> (Rocky)로 설치한다.</li>
      </ul>
</template>
<template id="t-l10">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li><code>cp [옵션] 원본 대상</code> — 디렉토리 복사엔 <code>-r</code> 필수, 덮어쓰기 확인은 <code>-i</code></li>
        <li><code>mv 원본 대상</code> — 이동과 이름 변경을 모두 담당. 디렉토리도 옵션 없이 이동</li>
        <li>옵션 없는 <code>cp</code>/<code>mv</code>는 같은 이름 파일을 <b>묻지 않고 덮어쓴다</b></li>
      </ul></div>
<h3>cp</h3>
      <div class="code"><pre><span class="p">$ </span>cp A/B/C/test1 A/test2    <span class="c"># 다른 이름으로 복사</span>
<span class="p">$ </span>cp A/B/C/test1 B/         <span class="c"># 디렉토리로 복사 (이름 유지)</span>
<span class="p">$ </span>cp -r C B/D               <span class="c"># 디렉토리 C를 B 안에 D라는 이름으로 복사</span>
<span class="p">$ </span>cp -i test1 A/            <span class="c"># 같은 이름이 있으면 y/n 확인</span></pre></div>

      <h3>mv</h3>
      <div class="code"><pre><span class="p">$ </span>mv A/B/C/test A/B/C/test1   <span class="c"># 같은 위치에서 이름만 변경</span>
<span class="p">$ </span>mv A/B/C A/                 <span class="c"># 디렉토리 C를 A 바로 아래로 이동 (-r 불필요)</span></pre></div>

      <div class="doc-wrap"><table class="doc">
        <tr><th></th><th><code>cp</code></th><th><code>mv</code></th></tr>
        <tr><td>원본</td><td>남는다</td><td>사라진다 (옮겨짐)</td></tr>
        <tr><td>디렉토리 대상</td><td><code>-r</code> 필요</td><td>옵션 불필요</td></tr>
        <tr><td>이름 변경</td><td>복사본 이름 지정</td><td>대상 이름만 바꾸면 rename</td></tr>
      </table></div>

      <h3>실습 팁</h3>
      <ul>
        <li><kbd>↑</kbd> 키로 이전 명령어를 불러와 다시 실행하거나 고칠 수 있다.</li>
        <li>목적지 뒤에 <code>/</code>를 붙이면(<code>A/</code>) 디렉토리임을 분명히 할 수 있다.</li>
      </ul>
</template>
<template id="t-l11">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li><code>nano 파일명</code> — 있으면 열고, 없으면 새로 만든다</li>
        <li>검색 <kbd>Ctrl</kbd>+<kbd>W</kbd>, 잘라내기 <kbd>Ctrl</kbd>+<kbd>K</kbd>, 붙여넣기 <kbd>Ctrl</kbd>+<kbd>U</kbd></li>
        <li>저장 <kbd>Ctrl</kbd>+<kbd>O</kbd>, 종료 <kbd>Ctrl</kbd>+<kbd>X</kbd></li>
      </ul></div>
<h3>단축키</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>키</th><th>기능</th><th>설명</th></tr>
        <tr><td><kbd>Ctrl</kbd>+<kbd>W</kbd></td><td>검색 (Where is)</td><td>하단 <code>Search:</code>에 키워드 입력 후 Enter. 커서가 해당 위치로 이동</td></tr>
        <tr><td><kbd>Ctrl</kbd>+<kbd>K</kbd></td><td>잘라내기</td><td>커서가 있는 <b>한 줄 전체</b>를 클립보드로</td></tr>
        <tr><td><kbd>Ctrl</kbd>+<kbd>U</kbd></td><td>붙여넣기</td><td>현재 커서 위치에. 여러 번 누르면 반복 붙여넣기</td></tr>
        <tr><td><kbd>Ctrl</kbd>+<kbd>O</kbd></td><td>저장 (Write Out)</td><td>파일명 확인 후 Enter. 이름을 바꾸면 다른 이름으로 저장</td></tr>
        <tr><td><kbd>Ctrl</kbd>+<kbd>X</kbd></td><td>종료 (Exit)</td><td>수정 사항이 있으면 저장 여부를 묻는다</td></tr>
      </table></div>

      <h3>수정 상태와 종료</h3>
      <ul>
        <li>내용을 바꾸면 상단 파일명 뒤에 <code>*</code>가 붙고, 저장하면 사라진다.</li>
        <li>수정 후 <kbd>Ctrl</kbd>+<kbd>X</kbd>: <kbd>Y</kbd> 저장 후 종료, <kbd>N</kbd> 저장 안 하고 종료, <kbd>Ctrl</kbd>+<kbd>C</kbd> 취소하고 편집으로 복귀.</li>
      </ul>
</template>
<template id="t-l12">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li><code>cat</code> 전체 출력, <code>more</code>/<code>less</code> 페이지 단위, <code>head</code>/<code>tail</code> 앞·뒤 일부</li>
        <li>리눅스에서 확장자는 표시일 뿐, 파일의 성질을 바꾸지 않는다</li>
        <li><kbd>Tab</kbd> 한 번은 자동 완성, 두 번은 후보 목록</li>
      </ul></div>
<h3>cat</h3>
      <div class="code"><pre><span class="p">$ </span>cat notes.txt       <span class="c"># 내용 출력</span>
<span class="p">$ </span>cat -n notes.txt    <span class="c"># 줄 번호와 함께</span></pre></div>

      <h3>more vs less</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th></th><th><code>more</code></th><th><code>less</code></th></tr>
        <tr><td>하단 표시</td><td>읽은 위치를 % 비율로</td><td>파일 경로와 이름</td></tr>
        <tr><td>끝에 도달하면</td><td>자동 종료</td><td><kbd>q</kbd>를 눌러야 종료</td></tr>
        <tr><td>이동</td><td>Space 다음 페이지</td><td>방향키 한 줄씩, <kbd>f</kbd> 다음 페이지, <kbd>b</kbd> 이전 페이지</td></tr>
        <tr><td>검색 · 번호</td><td><code>more +/검색어 파일</code> 검색어 위치부터 표시</td><td><kbd>/</kbd>검색어로 검색, <code>less -N</code> 줄 번호</td></tr>
      </table></div>
      <div class="code"><pre><span class="p">$ </span>more /etc/passwd
<span class="p">$ </span>less -N /etc/passwd</pre></div>

      <h3>head / tail</h3>
      <div class="code"><pre><span class="p">$ </span>head /etc/passwd        <span class="c"># 앞 10줄 (기본값)</span>
<span class="p">$ </span>head -n 3 /etc/passwd   <span class="c"># 앞 3줄</span>
<span class="p">$ </span>head -c 5 /etc/passwd   <span class="c"># 앞 5바이트</span>
<span class="p">$ </span>tail -n 1 /etc/passwd   <span class="c"># 마지막 1줄</span></pre></div>
      <div class="note"><span class="xtag">강의 외 보충</span> <code>tail -f 파일</code>은 파일 끝에 새로 추가되는 내용을 실시간으로 보여줍니다. <code>/var/log</code>의 로그를 볼 때 많이 씁니다.</div>
</template>
<template id="t-l13">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>표준 입력 0, 표준 출력 1, 표준 에러 2</li>
        <li>리다이렉션 = 입출력 방향을 <b>파일</b>로: <code>&gt;</code> <code>&gt;&gt;</code> <code>&lt;</code> <code>2&gt;</code> <code>&amp;&gt;</code></li>
        <li>파이프 <code>|</code> = 앞 명령의 출력을 뒤 명령의 입력으로</li>
      </ul></div>
<h3>표준 입출력</h3>
      <div class="chain"><span>키보드</span><i>stdin (0) →</i><span class="hl">명령어</span><i>→ stdout (1)</i><span>모니터</span></div>
      <div class="chain"><span style="visibility:hidden">키보드</span><i style="visibility:hidden">stdin (0) →</i><span class="hl">명령어</span><i>→ stderr (2)</i><span>모니터 (오류)</span></div>
      <p>0과 1은 기본값이라 보통 생략하고, 2는 표준 출력과 구분하기 위해 반드시 적는다.</p>

      <h3>리다이렉션 기호</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>기호</th><th>동작</th><th>예시</th></tr>
        <tr><td><code>&gt;</code></td><td>출력을 파일로 (덮어쓰기)</td><td><code>ls &gt; ls.txt</code></td></tr>
        <tr><td><code>&gt;&gt;</code></td><td>출력을 파일 끝에 덧붙이기</td><td><code>echo A &gt;&gt; echo.txt</code></td></tr>
        <tr><td><code>&lt;</code></td><td>파일 내용을 입력으로</td><td><code>wc -l &lt; ls.txt</code></td></tr>
        <tr><td><code>2&gt;</code> / <code>2&gt;&gt;</code></td><td>에러만 파일로</td><td><code>mkdir 2&gt; error.txt</code></td></tr>
        <tr><td><code>&amp;&gt;</code> / <code>&amp;&gt;&gt;</code></td><td>출력과 에러를 한 파일로</td><td><code>ls /etc /nope &amp;&gt; all.txt</code></td></tr>
        <tr><td><code>2&gt; /dev/null</code></td><td>에러 메시지 버리기</td><td><code>du -sh /* 2&gt; /dev/null</code></td></tr>
      </table></div>

      <h3>파이프라인</h3>
      <div class="code"><pre><span class="p">$ </span>history | sort | less               <span class="c"># 명령 이력을 정렬해 페이지로 보기</span>
<span class="p">$ </span>cat /etc/passwd | grep ubuntu       <span class="c"># ubuntu가 들어간 줄만</span>
<span class="p">$ </span>ls | grep .txt | wc -l              <span class="c"># .txt 파일 개수 세기</span></pre></div>
      <div class="chain"><span><code>ls</code><br><small>목록 출력</small></span><i>|</i><span><code>grep .txt</code><br><small>.txt 줄만 남김</small></span><i>|</i><span class="hl"><code>wc -l</code><br><small>줄 수 = 개수</small></span></div>
      <ul>
        <li><code>|</code>는 키보드의 <kbd>\</kbd>(또는 <kbd>₩</kbd>) 키 위에 있다.</li>
        <li><code>grep 문자열</code>: 해당 문자열이 들어간 <b>줄만</b> 걸러낸다.</li>
        <li><code>wc</code>: 줄·단어·바이트 수를 센다. <code>-l</code> 줄, <code>-w</code> 단어, <code>-c</code> 바이트.</li>
      </ul>
      <div class="note"><span class="xtag">강의 외 보충</span> <code>grep .txt</code>에서 <code>.</code>은 정규식으로 "아무 문자 하나"라서 <code>atxt</code>도 걸립니다. 정확히 확장자만 찾으려면 <code>grep '\.txt$'</code>를 씁니다.</div>
</template>
<template id="t-l14">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>모드 3개: 일반 모드 ⇄ 입력 모드 (<kbd>i</kbd> <kbd>a</kbd> <kbd>o</kbd> / <kbd>Esc</kbd>), 일반 모드 → 명령 모드 (<kbd>:</kbd>)</li>
        <li>저장·종료: <code>:w</code> <code>:q</code> <code>:q!</code> <code>:wq</code></li>
        <li>삭제 <code>x</code> <code>dd</code> <code>dw</code>, 되돌리기 <code>u</code>, 다시 실행 <kbd>Ctrl</kbd>+<kbd>r</kbd></li>
      </ul></div>
<h3>3가지 모드</h3>
      <div class="chain">
        <span>입력 모드<br><small>글 작성</small></span>
        <i>⇄<br><small>i a o / Esc</small></i>
        <span class="hl">일반 모드<br><small>시작 · 이동 · 삭제</small></span>
        <i>⇄<br><small>: / Enter·Esc</small></i>
        <span>명령 모드<br><small>저장 · 종료</small></span>
      </div>
      <p>파일을 열면 일반 모드에서 시작한다. 입력 모드와 명령 모드는 항상 일반 모드를 거쳐 오간다. vim(Vi IMproved)은 vi의 확장판으로, 보통 <code>vi</code>를 입력하면 vim이 실행된다.</p>

      <h3>입력 모드로 들어가기</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>키</th><th>위치</th></tr>
        <tr><td><kbd>i</kbd></td><td>커서 자리에 삽입</td></tr>
        <tr><td><kbd>a</kbd> / <kbd>A</kbd></td><td>커서 바로 뒤 / 줄 맨 끝에 추가</td></tr>
        <tr><td><kbd>o</kbd> / <kbd>O</kbd></td><td>아래 / 위에 새 줄을 만들고 입력</td></tr>
      </table></div>

      <h3>명령 모드 (저장·종료)</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>명령</th><th>동작</th></tr>
        <tr><td><code>:w</code></td><td>저장</td></tr>
        <tr><td><code>:q</code></td><td>종료 (수정 사항이 없을 때)</td></tr>
        <tr><td><code>:q!</code></td><td>저장하지 않고 강제 종료</td></tr>
        <tr><td><code>:wq</code></td><td>저장하고 종료</td></tr>
      </table></div>

      <h3>일반 모드: 이동과 삭제</h3>
      <div class="cols">
        <div class="doc-wrap"><table class="doc">
          <tr><th>키</th><th>이동</th></tr>
          <tr><td><kbd>h</kbd></td><td>← 왼쪽</td></tr>
          <tr><td><kbd>j</kbd></td><td>↓ 아래</td></tr>
          <tr><td><kbd>k</kbd></td><td>↑ 위</td></tr>
          <tr><td><kbd>l</kbd></td><td>→ 오른쪽</td></tr>
          <tr><td><code>gg</code> / <code>G</code></td><td>문서 맨 처음 / 맨 끝</td></tr>
        </table></div>
        <div class="doc-wrap"><table class="doc">
          <tr><th>키</th><th>삭제</th></tr>
          <tr><td><code>x</code> / <code>X</code></td><td>커서 글자 / 앞 글자 (Delete / Backspace)</td></tr>
          <tr><td><code>dw</code> / <code>db</code></td><td>단어 끝까지 / 단어 시작까지</td></tr>
          <tr><td><code>dd</code></td><td>줄 전체</td></tr>
          <tr><td><code>d$</code> (=<code>D</code>) / <code>d0</code></td><td>줄 끝까지 / 줄 맨 앞까지</td></tr>
          <tr><td><code>dG</code> / <code>dgg</code></td><td>문서 끝까지 / 문서 처음까지</td></tr>
        </table></div>
      </div>
      <ul>
        <li>숫자를 붙이면 반복: <code>5x</code> 5글자, <code>3dw</code> 3단어, <code>3dd</code> 3줄.</li>
        <li>문서 전체 지우기: <code>gg</code> 후 <code>dG</code>.</li>
        <li>되돌리기 <code>u</code>, 되돌리기 취소 <kbd>Ctrl</kbd>+<kbd>r</kbd>.</li>
      </ul>
      <div class="pit"><span class="ptag">노트 정정</span> 노트의 <code>1,d</code>는 일반 모드 명령이 아닙니다. 현재 줄부터 처음까지 지우려면 일반 모드에서 <code>dgg</code>, 또는 명령 모드에서 <code>:1,.d</code>를 씁니다.</div>

      <h3>vimtutor로 연습하기</h3>
      <div class="code"><pre><span class="p">$ </span>vimtutor -g ko           <span class="c"># 한글 실습 가이드 (종료하면 초기화됨)</span>
<span class="p">$ </span>sudo apt install vim     <span class="c"># 없으면 설치 (Ubuntu)</span>
<span class="p">$ </span>sudo dnf install vim     <span class="c"># (Rocky)</span></pre></div>
</template>
<template id="t-l16">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>선언 <code>name=value</code> (등호 앞뒤 공백 금지), 참조 <code>$name</code></li>
        <li>셸 변수는 현재 셸에서만, 환경 변수(<code>export</code>)는 하위 프로세스까지 유효</li>
        <li>조회 <code>set</code> / <code>printenv</code>·<code>env</code>, 삭제 <code>unset</code>, 영구 저장은 <code>~/.bashrc</code></li>
      </ul></div>
<h3>셸 변수 규칙</h3>
      <div class="code"><pre><span class="p">$ </span>name=ubuntu        <span class="c"># OK</span>
<span class="p">$ </span>name = ubuntu      <span class="c"># 오류: name 이라는 명령을 찾게 됨</span>
<span class="p">$ </span>echo name          <span class="c"># → name (그냥 문자열)</span>
<span class="p">$ </span>echo $name         <span class="c"># → ubuntu (변수 값)</span></pre></div>
      <ul>
        <li>영문 대소문자, 숫자, <code>_</code>만 사용. 첫 글자는 숫자가 될 수 없다.</li>
        <li>대소문자를 구분한다: <code>user</code>와 <code>USER</code>는 다른 변수.</li>
      </ul>

      <h3>확인과 삭제</h3>
      <div class="code"><pre><span class="p">$ </span>set | grep USER    <span class="c"># 셸 변수 중 USER만 찾기</span>
<span class="p">$ </span>unset score        <span class="c"># 변수 자체를 삭제 ($ 붙이지 않음)</span></pre></div>
      <ul>
        <li>셸 변수는 셸(터미널)을 닫으면 사라진다.</li>
        <li>계속 쓰려면 <code>~/.bashrc</code>(zsh는 <code>~/.zshrc</code>)에 선언을 적어 둔다.</li>
      </ul>

      <h3>셸 변수 vs 환경 변수</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th></th><th>셸 변수</th><th>환경 변수</th></tr>
        <tr><td>범위</td><td>현재 셸에서만</td><td>현재 셸 + 실행되는 하위 프로세스(스크립트 등)</td></tr>
        <tr><td>선언</td><td><code>NAME=ubuntu</code></td><td><code>export NAME=ubuntu</code></td></tr>
        <tr><td>조회</td><td><code>set</code></td><td><code>printenv</code>, <code>env</code></td></tr>
        <tr><td>삭제</td><td colspan="2"><code>unset NAME</code></td></tr>
      </table></div>
      <div class="code"><pre><span class="p">$ </span>A=1; export B=2
<span class="p">$ </span>bash -c 'echo "A=$A B=$B"'   <span class="c"># 하위 셸에서 확인</span>
A= B=2</pre></div>

      <h3>주요 환경 변수</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>변수</th><th>내용</th></tr>
        <tr><td><code>PATH</code></td><td>명령어 실행 파일을 찾는 디렉토리 목록 (<code>:</code>로 구분)</td></tr>
        <tr><td><code>HOME</code></td><td>사용자 홈 디렉토리 (<code>cd ~</code>가 참조)</td></tr>
        <tr><td><code>USER</code></td><td>로그인한 계정 이름</td></tr>
        <tr><td><code>LANG</code></td><td>언어·지역 설정</td></tr>
        <tr><td><code>SHELL</code></td><td>기본 로그인 셸 경로</td></tr>
      </table></div>
</template>
<template id="t-l17">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>구성: 셰뱅 <code>#!/bin/bash</code> + 주석 <code>#</code> + 명령어 본문</li>
        <li>실행: 경로 지정(<code>./hello.sh</code>) + 실행 권한(<code>chmod +x</code>)</li>
        <li>어디서나 실행: <code>~/bin</code>을 <code>PATH</code>에 추가, <code>~/.bashrc</code>에 적어 영구화</li>
      </ul></div>
<h3>스크립트 구조</h3>
      <div class="code"><pre>#!/bin/bash          <span class="c"># 셰뱅: 이 파일을 bash로 해석하라</span>
# 인사를 출력하는 스크립트   <span class="c"># 주석</span>
echo "Hello Linux"   <span class="c"># 본문: 위에서부터 순서대로 실행</span></pre></div>
      <p>반복 작업 자동화, 실행 순서 보장, 시스템 관리·백업·로그 수집에 쓴다. 확장자 <code>.sh</code>는 구분용이며 필수는 아니다.</p>

      <h3>실행할 때 나는 오류 두 가지</h3>
      <div class="code"><pre><span class="p">$ </span>hello.sh
hello.sh: command not found       <span class="c"># → 경로가 없다: ./hello.sh 로 실행</span>
<span class="p">$ </span>./hello.sh
bash: ./hello.sh: Permission denied   <span class="c"># → 실행 권한(x)이 없다</span>
<span class="p">$ </span>chmod +x hello.sh                 <span class="c"># 실행 권한 부여 (ls에서 초록색으로 보임)</span>
<span class="p">$ </span>./hello.sh
Hello Linux</pre></div>

      <h3>어디서나 실행되게 하기</h3>
      <div class="code"><pre><span class="p">$ </span>mkdir ~/bin
<span class="p">$ </span>mv hello.sh ~/bin
<span class="p">$ </span>export PATH=$PATH:~/bin     <span class="c"># 임시: 터미널을 닫으면 사라짐</span>
<span class="p">$ </span>hello.sh                    <span class="c"># 어느 위치에서든 실행</span>

<span class="c"># 영구 적용</span>
<span class="p">$ </span>vi ~/.bashrc                <span class="c"># 맨 끝에 export PATH=$PATH:~/bin 추가</span>
<span class="p">$ </span>source ~/.bashrc            <span class="c"># 지금 셸에 바로 적용</span></pre></div>
      <p><code>ls</code>, <code>pwd</code>를 경로 없이 실행할 수 있는 것도 그 실행 파일 위치가 <code>PATH</code>에 들어 있기 때문이다.</p>
</template>
<template id="t-l18">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>명령어 치환: <code>변수=$(명령어)</code></li>
        <li><code>$0</code> 스크립트 이름, <code>$1</code>–<code>$9</code> 인자, <code>${10}</code> 이상은 중괄호</li>
        <li><code>$#</code> 인자 개수, <code>$@</code>·<code>$*</code> 모든 인자</li>
      </ul></div>
<h3>명령어 치환</h3>
      <div class="code"><pre>#!/bin/bash
DATE=$(date +%Y-%m-%d)     <span class="c"># date 결과(연-월-일)를 변수에 저장</span>
echo "Today is $DATE"
<span class="c"># Today is 2026-10-01</span></pre></div>

      <h3>위치 매개변수</h3>
      <div class="code"><pre><span class="p">$ </span>./args.sh  apple  banana  cherry
<span class="c">#   $0        $1     $2      $3      $# = 3</span></pre></div>
      <div class="doc-wrap"><table class="doc">
        <tr><th>변수</th><th>의미</th></tr>
        <tr><td><code>$0</code></td><td>실행한 스크립트 이름(경로)</td></tr>
        <tr><td><code>$1</code> ~ <code>$9</code></td><td>첫 번째 ~ 아홉 번째 인자</td></tr>
        <tr><td><code>${10}</code> …</td><td>열 번째 이상은 중괄호로 감싼다</td></tr>
        <tr><td><code>$#</code></td><td>전달된 인자 개수</td></tr>
        <tr><td><code>$@</code></td><td>모든 인자 (반복문에서 <b>개별 요소</b>로 처리)</td></tr>
        <tr><td><code>$*</code></td><td>모든 인자 (<code>"$*"</code>는 <b>하나의 문자열</b>로 처리)</td></tr>
      </table></div>

      <h3>args.sh</h3>
      <div class="code"><pre>#!/bin/bash
echo "Script name: $0"
echo "First argument: $1"
echo "Second argument: $2"
echo "Arguments number: $#"
echo "All arguments: $@"
echo "All arguments: $*"</pre></div>
      <p>인자 없이 실행하면 <code>$1</code>, <code>$2</code>는 빈 값이 된다.</p>

      <h3>응용: 디렉토리 사용량 조회 (usage.sh)</h3>
      <div class="code"><pre>#!/bin/bash
du -sh "$1" 2&gt; /dev/null    <span class="c"># 첫 번째 인자 경로의 용량만, 오류는 버림</span></pre></div>
      <div class="code"><pre><span class="p">$ </span>./usage.sh /etc
6.5M	/etc</pre></div>
      <ul>
        <li><code>du</code>(disk usage): 파일·디렉토리가 차지하는 디스크 공간. <code>-s</code> 합계만, <code>-h</code> K·M·G 단위.</li>
        <li><code>2&gt; /dev/null</code>: Permission denied 같은 에러를 화면에 출력하지 않고 버린다.</li>
      </ul>
      <div class="pit"><span class="ptag">노트 정정</span> 노트의 <code>du -sh /etc $1 &gt;2 /dev/null</code>은 두 군데가 틀렸습니다. <code>/etc</code>가 고정으로 들어가 있어 항상 /etc도 함께 출력되고, <code>&gt;2</code>는 "2"라는 파일로 출력을 보내는 뜻이 됩니다. 에러 리다이렉션은 <code>2&gt;</code>입니다.</div>
</template>
<template id="t-l19">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li><code>echo -n "안내: "; read VAR</code> — 같은 줄에서 입력 받기</li>
        <li>변수명 없이 <code>read</code>하면 값은 <code>$REPLY</code>에 저장</li>
        <li><code>printf</code>로 서식 지정 출력: <code>%s</code> <code>%d</code> <code>%f</code> <code>%.2f</code> <code>%x</code> <code>%o</code></li>
      </ul></div>
<h3>입력 받기</h3>
      <div class="code"><pre>#!/bin/bash
echo -n "Enter your name: "; read NAME   <span class="c"># -n: 줄바꿈 없이 출력</span>
echo "Hello, $NAME"

read                                      <span class="c"># 변수명 생략</span>
echo "You typed: $REPLY"</pre></div>
      <ul>
        <li><code>echo</code>는 출력 후 자동으로 줄을 바꾼다. 안내문 옆에서 입력을 받으려면 <code>-n</code>.</li>
        <li>패키지 삭제 시 "계속하시겠습니까? (Y/N)" 같은 확인 과정이 이 방식이다.</li>
      </ul>
      <div class="note"><span class="xtag">강의 외 보충</span> bash에서는 <code>read -p "Enter your name: " NAME</code>로 안내문과 입력을 한 번에 처리할 수도 있습니다.</div>

      <h3>printf 서식 지정자</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>지정자</th><th>출력</th><th>예시 → 결과</th></tr>
        <tr><td><code>%s</code></td><td>문자열</td><td><code>printf "%s\n" Linux</code> → Linux</td></tr>
        <tr><td><code>%d</code></td><td>10진 정수</td><td><code>printf "%d\n" 42</code> → 42</td></tr>
        <tr><td><code>%f</code></td><td>실수 (기본 소수점 6자리)</td><td><code>printf "%f\n" 3.14</code> → 3.140000</td></tr>
        <tr><td><code>%.2f</code></td><td>소수점 자리수 지정</td><td><code>printf "%.2f\n" 3.14159</code> → 3.14</td></tr>
        <tr><td><code>%x</code> / <code>%X</code></td><td>16진수 (소/대문자)</td><td><code>printf "%X\n" 255</code> → FF</td></tr>
        <tr><td><code>%o</code></td><td>8진수</td><td><code>printf "%o\n" 8</code> → 10</td></tr>
      </table></div>
      <div class="code"><pre><span class="p">$ </span>printf "Name: %s, Age: %d\n" "$NAME" 23
Name: ubuntu, Age: 23</pre></div>
      <p><code>echo</code>와 달리 <code>printf</code>는 줄바꿈을 자동으로 넣지 않으므로 <code>\n</code>을 직접 쓴다.</p>
</template>
<template id="t-l20">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li><code>test 조건</code> = <code>[ 조건 ]</code> — 대괄호 안쪽 양옆에 <b>공백 필수</b></li>
        <li><code>if 조건; then … else … fi</code></li>
        <li><code>case "$var" in 패턴) … ;; *) … ;; esac</code></li>
      </ul></div>
<h3>test와 if</h3>
      <div class="code"><pre>#!/bin/bash
if test -e file.txt; then
    echo "The file exists"
else
    echo "The file does not exist"
fi</pre></div>
      <p><code>test</code>는 조건을 평가해 참/거짓을 돌려준다. 보통 단독이 아니라 <code>if</code>와 함께 쓴다.</p>

      <h3>자주 쓰는 test 조건식</h3>
      <div class="cols">
        <div class="doc-wrap"><table class="doc">
          <tr><th>파일</th><th>참일 때</th></tr>
          <tr><td><code>-e 파일</code></td><td>존재한다</td></tr>
          <tr><td><code>-f 파일</code></td><td>일반 파일이다</td></tr>
          <tr><td><code>-d 파일</code></td><td>디렉토리다</td></tr>
          <tr><td><code>-r</code> / <code>-w</code> / <code>-x</code></td><td>읽기 / 쓰기 / 실행 가능</td></tr>
          <tr><td><code>-s 파일</code></td><td>크기가 0보다 크다</td></tr>
        </table></div>
        <div class="doc-wrap"><table class="doc">
          <tr><th>문자열 · 숫자</th><th>참일 때</th></tr>
          <tr><td><code>"$a" = "$b"</code></td><td>문자열이 같다</td></tr>
          <tr><td><code>"$a" != "$b"</code></td><td>다르다</td></tr>
          <tr><td><code>-z "$a"</code> / <code>-n "$a"</code></td><td>빈 문자열 / 비어 있지 않음</td></tr>
          <tr><td><code>-eq</code> <code>-ne</code></td><td>숫자 같음 / 다름</td></tr>
          <tr><td><code>-lt</code> <code>-le</code> <code>-gt</code> <code>-ge</code></td><td>&lt; ≤ &gt; ≥</td></tr>
        </table></div>
      </div>

      <h3>대괄호 형태</h3>
      <div class="code"><pre>#!/bin/bash
str="Hello World"
if [ "$str" = "Hello World" ]; then
    echo "same"
fi</pre></div>
      <div class="pit"><span class="ptag">노트 정정</span> 노트의 <code>str = "Hello"</code>와 <code>if[ ... ]</code>는 둘 다 오류가 납니다. 변수 선언은 <code>=</code> 앞뒤에 공백이 없어야 하고(<code>str="Hello"</code>), <code>if</code>와 <code>[</code> 사이, <code>[</code> 안쪽 양옆에는 공백이 있어야 합니다. <code>[</code>도 하나의 명령어이기 때문입니다.</div>
      <ul>
        <li>문자열 비교 시 변수는 <code>"$str"</code>처럼 큰따옴표로 감싼다. 값에 공백이 있거나 비어 있어도 오류가 나지 않는다.</li>
      </ul>

      <h3>case</h3>
      <div class="code"><pre>#!/bin/bash
echo "1) Shutdown the system"
echo "2) Restart the system"
echo -n "What do you want? (1/2): "
read answer

case "$answer" in
    1) echo "Shutdown the system" ;;
    2) echo "Restart the system" ;;
    *) echo "Wrong command" ;;    <span class="c"># 어느 패턴에도 맞지 않을 때</span>
esac</pre></div>
      <p>각 패턴은 <code>;;</code>로 끝나고, 전체는 <code>esac</code>(case를 거꾸로)로 닫는다. <code>if</code>가 <code>fi</code>로 닫히는 것과 같은 규칙이다.</p>
</template>
<template id="t-l21">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li>산술: <code>expr</code>(공백 필수) &lt; <code>let</code> &lt; <code>$(( ))</code> (가장 많이 씀)</li>
        <li><code>for</code>: 리스트·범위·C 스타일 / <code>while</code>: 참인 동안 / <code>until</code>: 거짓인 동안</li>
        <li>모두 <code>do … done</code>으로 감싼다</li>
      </ul></div>
<h3>산술 연산 3가지</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th></th><th><code>expr</code></th><th><code>let</code></th><th><code>$(( ))</code> / <code>(( ))</code></th></tr>
        <tr><td>공백</td><td>필수</td><td>없어야 함</td><td>자유</td></tr>
        <tr><td><code>$</code> 표기</td><td>필요</td><td>생략 가능</td><td>생략 가능</td></tr>
        <tr><td><code>x++</code>, <code>x+=1</code></td><td>불가</td><td>가능</td><td>가능</td></tr>
        <tr><td>곱셈</td><td><code>'*'</code>로 감싸야 함</td><td><code>*</code></td><td><code>*</code></td></tr>
      </table></div>
      <div class="code"><pre><span class="c"># expr: 연산자 양옆 공백 필수, 비교는 참 1 / 거짓 0</span>
expr 4 + 2          <span class="c"># 6</span>
expr 10 '*' 2       <span class="c"># 20</span>
expr 1 = 1          <span class="c"># 1</span>
x=5; sum=$(expr $x + 10); echo $sum   <span class="c"># 15</span>

<span class="c"># let: $ 생략, 공백 없이</span>
x=3; y=5
let sum=x+y; echo $sum   <span class="c"># 8</span>
let x++;     echo $x     <span class="c"># 4</span>
let x+=1;    echo $x     <span class="c"># 5</span>

<span class="c"># 이중 소괄호: C 스타일</span>
x=2; y=10
r=$((x * y)); echo $r    <span class="c"># 20</span>
((x++));      echo $x    <span class="c"># 3</span></pre></div>
      <div class="pit"><span class="ptag">노트 정정</span> 노트의 <code>let x +=1</code>처럼 <code>let</code> 안에 공백이 들어가면 오류가 납니다. <code>let x+=1</code> 또는 <code>let "x += 1"</code>로 씁니다.</div>

      <h3>for</h3>
      <div class="code"><pre><span class="c"># 리스트</span>
for name in Kim Lee Park
do
    echo "Hello, $name!!"
done

<span class="c"># 범위 {시작..끝}</span>
for i in {1..10}
do
    echo "Count: $i"
done

<span class="c"># C 스타일: 1, 3, 5, 7, 9</span>
for ((i=1; i&lt;10; i+=2))
do
    echo "Step: $i"
done</pre></div>
      <p>범위 연산자는 명령어에도 쓸 수 있다: <code>touch test{1..10}</code>은 test1–test10을 한 번에 만든다.</p>

      <h3>while vs until</h3>
      <div class="cols">
        <div class="code"><pre>num=1
while ((num &lt;= 5))
do
    echo "Number: $num"
    ((num++))
done</pre></div>
        <div class="code"><pre>num=1
until ((num &gt; 5))
do
    echo "Number: $num"
    ((num++))
done</pre></div>
      </div>
      <div class="doc-wrap"><table class="doc">
        <tr><th></th><th>조건이 참</th><th>조건이 거짓</th></tr>
        <tr><td><code>while</code></td><td>반복 실행</td><td>종료</td></tr>
        <tr><td><code>until</code></td><td>종료</td><td>반복 실행</td></tr>
      </table></div>
      <p>두 예시는 결과가 같다 (1–5 출력). 조건만 반대로 쓴 것이다.</p>
      <div class="pit"><span class="ptag">노트 정정</span> 노트의 while/until 예시에서 <code>echo "Number: $sum"</code>은 <code>$num</code>이어야 합니다. <code>$sum</code>은 선언되지 않아 빈 값이 출력됩니다.</div>
</template>
<template id="t-l22">
<div class="key"><b class="key-l">핵심 요약</b><ul>
        <li><b>묶기</b>(tar)와 <b>압축</b>(gzip/bzip2/xz)은 다른 작업. 보통 묶은 뒤 압축한다</li>
        <li><code>tar -cf</code> 묶기, <code>-tf</code> 목록, <code>-xvf</code> 풀기</li>
        <li><code>zip</code>은 묶기+압축을 한 번에, 윈도우와 호환</li>
      </ul></div>
<h3>tar로 묶기</h3>
      <div class="chain"><span>passwd</span><span>hosts</span><i>tar →</i><span>test.tar<br><small>묶음 (크기 그대로)</small></span><i>gzip →</i><span class="hl">test.tar.gz<br><small>압축</small></span></div>
      <div class="doc-wrap"><table class="doc">
        <tr><th>옵션</th><th>뜻</th></tr>
        <tr><td><code>c</code></td><td>Create: 아카이브 생성</td></tr>
        <tr><td><code>x</code></td><td>eXtract: 풀기</td></tr>
        <tr><td><code>t</code></td><td>List: 풀지 않고 목록만</td></tr>
        <tr><td><code>v</code></td><td>Verbose: 진행 과정 출력</td></tr>
        <tr><td><code>f</code></td><td>File: 아카이브 파일명 지정 (옵션 맨 뒤, 바로 뒤에 파일명)</td></tr>
      </table></div>
      <div class="code"><pre><span class="p">$ </span>tar -cf test.tar passwd hosts   <span class="c"># 묶기</span>
<span class="p">$ </span>tar -tf test.tar                <span class="c"># 목록 확인</span>
<span class="p">$ </span>tar -xvf test.tar               <span class="c"># 풀기</span></pre></div>

      <h3>압축 프로그램 비교</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>명령</th><th>확장자</th><th>압축률</th><th>속도</th><th>해제</th><th>tar 옵션</th></tr>
        <tr><td><code>gzip</code></td><td><code>.gz</code></td><td>낮음</td><td>빠름</td><td><code>gzip -d</code> / <code>gunzip</code></td><td><code>z</code></td></tr>
        <tr><td><code>bzip2</code></td><td><code>.bz2</code></td><td>중간</td><td>중간</td><td><code>bzip2 -d</code> / <code>bunzip2</code></td><td><code>j</code></td></tr>
        <tr><td><code>xz</code></td><td><code>.xz</code></td><td>높음</td><td>느림</td><td><code>xz -d</code> / <code>unxz</code></td><td><code>J</code></td></tr>
      </table></div>
      <ul>
        <li>기본 동작은 <b>원본을 지우고</b> 압축 파일만 남긴다. 원본을 두려면 <code>-k</code>(keep).</li>
        <li>풀 때는 각 명령에 <code>-d</code>(decompress)를 붙이면 된다.</li>
      </ul>
      <div class="code"><pre><span class="p">$ </span>mkdir test &amp;&amp; cd test
<span class="p">$ </span>touch test{00..10}
<span class="p">$ </span>tar -cf test.tar ./*      <span class="c"># 모든 파일을 묶어 test.tar</span>
<span class="p">$ </span>gzip test.tar             <span class="c"># → test.tar.gz (test.tar는 사라짐)</span>
<span class="p">$ </span>gzip -d test.tar.gz       <span class="c"># 다시 test.tar</span>
<span class="p">$ </span>bzip2 -k test.tar         <span class="c"># 원본 유지하며 test.tar.bz2</span></pre></div>
      <div class="note"><span class="xtag">강의 외 보충</span> tar에 압축 옵션을 함께 주면 한 번에 처리됩니다. <code>tar -czvf a.tar.gz dir/</code>로 묶고 압축, <code>tar -xzvf a.tar.gz</code>로 풉니다. bzip2는 <code>j</code>, xz는 <code>J</code>.</div>

      <h3>zip / unzip</h3>
      <div class="code"><pre><span class="p">$ </span>zip test.zip test1 test2   <span class="c"># 묶기 + 압축 한 번에</span>
<span class="p">$ </span>zip -r dir.zip dir/        <span class="c"># 디렉토리는 -r</span>
<span class="p">$ </span>unzip test.zip             <span class="c"># 같은 파일이 있으면 [y]es/[n]o/[A]ll/[N]one/[r]ename 선택</span></pre></div>

      <h3>file: 진짜 파일 유형 확인</h3>
      <div class="code"><pre><span class="p">$ </span>mv test.tar.gz test.zip
<span class="p">$ </span>file test.zip
test.zip: gzip compressed data, ...   <span class="c"># 확장자와 무관하게 실제 내용으로 판단</span></pre></div>

      <h3>와일드카드</h3>
      <div class="doc-wrap"><table class="doc">
        <tr><th>기호</th><th>뜻</th><th>예시</th></tr>
        <tr><td><code>*</code></td><td>0개 이상의 모든 문자</td><td><code>ls *.txt</code>, <code>rm test*</code>, <code>tar -cvf all.tar *</code></td></tr>
        <tr><td><code>?</code></td><td>정확히 1개의 문자</td><td><code>ls test?</code> → test1, testA / <code>zip t.zip test??</code> → test01–test10</td></tr>
        <tr><td><code>{a..b}</code></td><td>연속 범위 생성</td><td><code>touch test{1..10}</code>, <code>rm test{0..10}</code></td></tr>
      </table></div>
</template>

    ['패키지', 'sudo dnf install pkg', 'Rocky / RHEL 설치', 3],
    ['셸', 'cat /etc/shells', '설치된 셸 목록', 2],
    ['셸', 'Tab · Tab Tab', '자동 완성 / 후보 목록', 12],
    ['셸', '↑ · history', '이전 명령 / 명령 이력', 10]
  ];
const PARTNAME = ['기초·설치', '명령어·편집', '스크립트·압축'];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const strip = s => { const d = document.createElement('div'); d.innerHTML = s; return d.textContent; };
const lecOf = {}; LECS.forEach(l => { lecOf[l.id] = l; });

// 학습 순서: 강의 번호 순
const SEQ = LECS.map(l => l.id);
const parseId = id => lecOf[id] ? { lid: id } : null;
const itemName = id => lecOf[id].no + '강 ' + strip(lecOf[id].title);

// 기록 (이 브라우저에만 저장)
const KEY = 'linux-notes-v2';
let S = { cur: 'l1', part: 0, read: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

function renderMeters() {
  const r = LECS.filter(l => S.read[l.id]).length;
  $('mRead').textContent = `노트 ${r} / ${LECS.length}`; $('bRead').style.width = (r / LECS.length * 100) + '%';
}

function renderNav() {
  $('parts').innerHTML = PARTNAME.map((n, i) => `<button type="button" data-part="${i}" aria-pressed="${S.part === i}">${n}</button>`).join('');
  $('parts').querySelectorAll('[data-part]').forEach(b => b.onclick = () => { S.part = +b.dataset.part; save(); renderNav(); });
  const cur = parseId(S.cur);
  $('stages').innerHTML = LECS.filter(l => l.part === S.part).map(l => `<li class="stage${S.cur === l.id ? ' here' : ''}">
      <button type="button" class="st-btn" data-go="${l.id}"${S.cur === l.id ? ' aria-current="page"' : ''}>
        <div class="st-head"><span class="st-no">${String(l.no).padStart(2, '0')}</span><span class="st-name">${l.title}</span><span class="st-count${S.read[l.id] ? ' done' : ''}">${S.read[l.id] ? '읽음' : ''}</span></div>
        <p class="st-sub">${l.sub}</p>
      </button></li>`).join('');
  $('stages').querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  renderMeters();
}

function pagerHTML(id) {
  const i = SEQ.indexOf(id), prev = SEQ[i - 1], next = SEQ[i + 1];
  return `<nav class="pager">
    <button type="button" class="btn" id="prev" ${prev ? '' : 'disabled'}>← ${prev ? itemName(prev) : '처음'}</button>
    <button type="button" class="btn" id="next" ${next ? '' : 'disabled'}>${next ? itemName(next) : '마지막 강의'} →</button>
  </nav>`;
}
function wirePager(id) {
  const i = SEQ.indexOf(id);
  $('prev').onclick = () => SEQ[i - 1] && go(SEQ[i - 1]);
  $('next').onclick = () => SEQ[i + 1] && go(SEQ[i + 1]);
}

function renderNote(l) {
  $('sheet').innerHTML = `
    <div class="crumb"><b>${PARTNAME[l.part]} · ${l.no}강</b><span>노트</span></div>
    <h2 class="c-title">${l.title}</h2>
    <p class="lead">${l.sub}</p>
    <div class="concept"></div>
    ${pagerHTML(l.id)}`;
  $('sheet').querySelector('.concept').appendChild($('t-' + l.id).content.cloneNode(true));
  addCopyButtons($('sheet'));
  wirePager(l.id);
}

function go(id, opts) {
  const p = parseId(id); if (!p) return;
  const l = lecOf[p.lid];
  S.cur = id; S.part = l.part;
  S.read[l.id] = 1;
  save();
  renderNote(l);
  renderNav();
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  if (!opts || !opts.keepScroll) window.scrollTo(0, 0);
  if (window.innerWidth <= 880) { $('aside').classList.add('closed'); $('navToggle').textContent = '강의 목록 펼치기'; }
}

// 코드 복사: 프롬프트($)가 있는 블록은 명령 줄만, 주석은 빼고 복사
function addCopyButtons(root) {
  root.querySelectorAll('.code').forEach(box => {
    const pre = box.querySelector('pre');
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'copy'; btn.textContent = '복사';
    btn.onclick = () => {
      const clone = pre.cloneNode(true);
      clone.querySelectorAll('.p').forEach(n => n.remove());
      let text = clone.textContent.replace(/[ \t]+$/gm, '');
      if (pre.querySelector('.p')) {
        const lines = text.split('\n'), out = [];
        pre.textContent.split('\n').forEach((line, i) => { if (/^\$ /.test(line)) out.push(lines[i].replace(/\s+#.*$/, '').trim()); });
        text = out.join('\n');
      }
      const ok = () => { btn.textContent = '복사됨'; setTimeout(() => { btn.textContent = '복사'; }, 1400); };
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = '선택됨'; };
      try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
    };
    box.appendChild(btn);
  });
}

// 치트시트
const CATS = ['전체'].concat([...new Set(CHEAT.map(r => r[0]))]);
let cat = '전체';
function renderCheat() {
  const q = $('cheatQ').value.trim(), ql = q.toLowerCase();
  const hl = s => { const e = esc(s); if (!q) return e; const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); return e.replace(re, m => '<mark>' + m + '</mark>'); };
  $('fchips').innerHTML = CATS.map(c => `<button type="button" aria-pressed="${c === cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  $('fchips').querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { cat = b.dataset.cat; renderCheat(); });
  const rows = CHEAT.filter(r => (cat === '전체' || r[0] === cat) && (!ql || (r[1] + ' ' + r[2] + ' ' + r[0]).toLowerCase().includes(ql)));
  $('cheatTable').querySelector('tbody').innerHTML = rows.map(r => `<tr><td><code>${hl(r[1])}</code></td><td>${hl(r[2])}</td><td><button type="button" class="linkbtn" data-l="l${r[3]}">${r[3]}강</button></td></tr>`).join('');
  $('cheatEmpty').hidden = rows.length > 0;
  $('cheatTable').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { $('cheatDlg').close(); go(b.dataset.l); });
}
$('openCheat').onclick = () => { renderCheat(); $('cheatDlg').showModal(); $('cheatQ').focus(); };
$('closeCheat').onclick = () => $('cheatDlg').close();
$('cheatDlg').addEventListener('click', e => { if (e.target === $('cheatDlg')) $('cheatDlg').close(); });
let ct; $('cheatQ').addEventListener('input', () => { clearTimeout(ct); ct = setTimeout(renderCheat, 120); });

// 기록 초기화: 두 번 눌러야 지워져요
let resetArmed = null;
$('resetAll').onclick = () => {
  const b = $('resetAll');
  if (!resetArmed) {
    b.classList.add('warn'); b.textContent = '한 번 더 누르면 지워요';
    resetArmed = setTimeout(() => { b.classList.remove('warn'); b.textContent = '기록 초기화'; resetArmed = null; }, 3000);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null;
  S.read = {}; save();
  b.classList.remove('warn'); b.textContent = '기록 초기화';
  go(S.cur, { keepScroll: true });
};

$('navToggle').onclick = () => { const a = $('aside'); a.classList.toggle('closed'); $('navToggle').textContent = a.classList.contains('closed') ? '강의 목록 펼치기' : '강의 목록 접기'; };

document.addEventListener('keydown', e => {
  if ($('cheatDlg').open || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const i = SEQ.indexOf(S.cur);
  if (e.key === 'ArrowRight' && SEQ[i + 1]) { e.preventDefault(); go(SEQ[i + 1]); }
  else if (e.key === 'ArrowLeft' && SEQ[i - 1]) { e.preventDefault(); go(SEQ[i - 1]); }
});

const fromHash = (location.hash || '').slice(1);
go(parseId(fromHash) ? fromHash : (parseId(S.cur) ? S.cur : 'l1'), { keepScroll: true });
</script>
