<style>
/* Layout: 문제집 펼친 면. 왼쪽 여백은 단계 색인(탭 구분지), 오른쪽은 문제 한 장. */
:root {
  --paper: #f7f9fb;
  --sheet: #ffffff;
  --ink: #18222c;
  --muted: #5a6875;
  --line: #d9e1e8;
  --accent: #1d5c8a;
  --accent-soft: #e3eef7;
  --mark: #fde68a;
  --mark-ink: #5b4300;
  --ok: #2c8556;
  --ok-soft: #e1f3e8;
  --warn: #b7791f;
  --warn-soft: #fbf0d9;
  --bad: #c0392b;
  --bad-soft: #fbe5e2;
  --code-bg: #eef2f6;
  --null: #9aa6b2;
  --f-display: "Hahmlet", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-code: "Nanum Gothic Coding", "D2Coding", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161b; --sheet: #171e25; --ink: #e3e9ef; --muted: #96a3af; --line: #2a3540;
    --accent: #7db4df; --accent-soft: #1d2d3b; --mark: #4d4012; --mark-ink: #f8e3a0;
    --ok: #5cc48c; --ok-soft: #173326; --warn: #e0a84a; --warn-soft: #3a2e15; --bad: #f07a6c; --bad-soft: #3d1f1c;
    --code-bg: #10161c; --null: #6b7884; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161b; --sheet: #171e25; --ink: #e3e9ef; --muted: #96a3af; --line: #2a3540;
  --accent: #7db4df; --accent-soft: #1d2d3b; --mark: #4d4012; --mark-ink: #f8e3a0;
  --ok: #5cc48c; --ok-soft: #173326; --warn: #e0a84a; --warn-soft: #3a2e15; --bad: #f07a6c; --bad-soft: #3d1f1c;
  --code-bg: #10161c; --null: #6b7884; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
table { font: inherit; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre, .mono { font-family: var(--f-code); }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .92em; }

.top { border-bottom: 1px solid var(--line); background: var(--sheet);
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .86rem; }
.top-right { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.meter { display: flex; flex-direction: column; gap: 3px; min-width: 150px; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.btn-ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: .85rem; }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.btn-ghost.warn { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px;
  padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 단계 색인 */
aside { min-width: 0; }
.parts { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 14px; background: var(--sheet); }
.parts button { border: 0; background: none; padding: 9px 6px; font-weight: 600; font-size: .92rem; color: var(--muted); }
.parts button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
.nav-toggle { display: none; width: 100%; margin-bottom: 10px; }
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.stage { padding: 8px 10px 9px; border-radius: 8px; border-left: 3px solid transparent; }
.stage.here { background: var(--sheet); border-left-color: var(--accent); box-shadow: 0 1px 0 var(--line); }
.st-head { display: flex; align-items: baseline; gap: 8px; font-size: .9rem; }
.st-no { font-family: var(--f-code); font-size: .75rem; color: var(--muted); width: 1.6em; flex: none; }
.st-name { font-weight: 600; flex: 1; min-width: 0; }
.st-count { font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.st-sub { font-size: .76rem; color: var(--muted); margin: 0 0 6px 2.15em; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-left: 2.15em; }
.chip { width: 28px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--sheet); font-size: .74rem; font-family: var(--f-code); padding: 0; font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); }
.chip.ok { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.chip.bad { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.chip.shown { border-style: dashed; color: var(--muted); }
.chip.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip.jb::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--warn); margin: -2px auto 0; }
.chip.concept { width: auto; padding: 0 9px; font-family: var(--f-body); font-weight: 600; color: var(--accent); border-color: var(--accent); background: var(--sheet); }
.chip.concept.read { background: var(--accent-soft); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: .8rem; }

/* 개념 페이지 */
.c-title { font-size: 1.6rem !important; font-weight: 800 !important; }
.lead { font-size: 1.06rem; line-height: 1.7; max-width: 66ch; margin: 0 0 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.concept { max-width: 78ch; }
.concept h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.08rem; margin: 26px 0 8px; }
.concept p { margin: 0 0 10px; }
.concept ul, .concept ol { margin: 0 0 12px; padding-left: 1.3em; }
.concept li { margin-bottom: 4px; }
.concept .note, .note { color: var(--muted); font-size: .9rem; }
.concept .key { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; }
.concept table.doc { border-collapse: collapse; margin: 6px 0 14px; font-size: .9rem; display: block; overflow-x: auto; max-width: 100%; }
.concept table.doc th, .concept table.doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.concept table.doc th { background: var(--code-bg); font-weight: 600; white-space: nowrap; }
.fx { display: flex; flex-wrap: wrap; gap: 10px 28px; background: var(--code-bg); border-radius: 10px; padding: 12px 16px; margin: 4px 0 14px; font-size: 1.02rem; }
.fx-l { display: block; font-size: .72rem; color: var(--muted); letter-spacing: .04em; margin-bottom: 2px; }
pre.fxpre { background: var(--code-bg); border-radius: 10px; padding: 12px 16px; overflow-x: auto; font-size: .88rem; line-height: 1.6; margin: 4px 0 12px; }
.steps li { padding-left: 2px; }
ul.check { list-style: none; padding-left: 0; }
ul.check li::before { content: "□"; color: var(--accent); margin-right: 8px; }
.pit { border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 8px 8px 0; padding: 8px 14px; margin: 8px 0; }
.pit p { margin: 2px 0; }
.pit .x { color: var(--bad); font-weight: 700; margin-right: 4px; }
.pit .o { color: var(--ok); font-weight: 700; margin-right: 4px; }
.jbbox { background: var(--mark); color: var(--mark-ink); border-radius: 8px; padding: 10px 14px; margin: 16px 0 8px; font-size: .92rem; }
.jbbox code { background: rgba(255, 255, 255, .45); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0 14px; font-family: var(--f-code); font-size: .85rem; }
.chain span { border: 1.5px solid var(--accent); border-radius: 6px; padding: 3px 9px; font-weight: 700; }
.chain i { font-style: normal; color: var(--muted); font-size: .76rem; }
.chain i::before { content: "—"; margin-right: 3px; } .chain i::after { content: "—"; margin-left: 3px; }
figure.ex { margin: 12px 0 18px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 14px; }
figure.ex figcaption { font-size: .86rem; font-weight: 600; margin-bottom: 8px; }
.ex-tables { margin-bottom: 12px; }
.ex-step { font-size: .74rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; margin: 4px 0 5px; }
.ex-ed { width: 100%; min-height: 40px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--code-bg); font-family: var(--f-code); font-size: .9rem; line-height: 1.55; }
.ex-ed:focus { border-color: var(--accent); outline: none; }
.ex-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.btn.small { padding: 4px 12px; font-size: .82rem; }
.btn.ghost { color: var(--muted); }
.ex-out { margin-top: 10px; }
.go-probs { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border: 1.5px solid var(--accent); border-radius: 12px; padding: 14px 16px; margin-top: 26px; }
.go-probs div { min-width: 0; flex: 1 1 260px; }
.go-probs b { display: block; margin-bottom: 2px; }
.go-probs span { color: var(--muted); font-size: .84rem; }
.parts { grid-template-columns: repeat(4, 1fr); }
.parts button { padding-inline: 2px; }
/* ERD */
:root { --erd-e: #e3eef7; --erd-r: #fdf1d6; --erd-a: #ffffff; --erd-canvas: #fbfcfd; --erd-sel: #e2583e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --erd-e: #1d2d3b; --erd-r: #3a2e15; --erd-a: #171e25; --erd-canvas: #12181e; --erd-sel: #ff8a6e; } }
:root[data-theme="dark"] { --erd-e: #1d2d3b; --erd-r: #3a2e15; --erd-a: #171e25; --erd-canvas: #12181e; --erd-sel: #ff8a6e; }
.erd-svg { display: block; width: 100%; height: auto; font-family: var(--f-body); }
.erd-svg.edit { background: var(--erd-canvas); border: 1px solid var(--line); border-radius: 10px; touch-action: none; aspect-ratio: 900 / 560; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 20px 20px; }
.erd-svg.edit:focus { outline: none; border-color: var(--accent); }
.erd-svg.linking .erd-node { cursor: crosshair; }
.erd-node { cursor: grab; }
.erd-node .shape { stroke: var(--ink); stroke-width: 1.6; }
.erd-node.t-E .shape, .erd-node.t-W .shape { fill: var(--erd-e); }
.erd-node.t-R .shape, .erd-node.t-IR .shape { fill: var(--erd-r); }
.erd-node.t-A .shape { fill: var(--erd-a); }
.erd-node .shape.inner { fill: none; }
.erd-node .shape.dashed { stroke-dasharray: 5 3; }
.erd-node .lbl { fill: var(--ink); font-size: 14px; text-anchor: middle; dominant-baseline: central; pointer-events: none; font-weight: 500; }
.erd-node.t-E .lbl, .erd-node.t-W .lbl { font-weight: 700; }
.erd-node .ul { stroke: var(--ink); stroke-width: 1.3; }
.erd-node .ul.dashed { stroke-dasharray: 3 2; }
.erd-node.sel .shape:not(.inner) { stroke: var(--erd-sel); stroke-width: 2.6; }
.erd-node.src .shape:not(.inner) { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 4 3; }
.erd-edge .hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
.erd-edge .ln { stroke: var(--ink); stroke-width: 1.5; fill: none; pointer-events: none; }
.erd-edge .ln.outer { stroke-width: 6; }
.erd-edge .ln.inner { stroke: var(--erd-canvas); stroke-width: 2.4; }
.erd-svg.view .erd-edge .ln.inner { stroke: var(--sheet); }
.erd-edge.sel .ln:not(.inner) { stroke: var(--erd-sel); }
.erd-edge .card { fill: var(--accent); font-weight: 800; font-size: 17px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.erd-edge .role { fill: var(--muted); font-style: italic; font-size: 13px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.erd-tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; justify-content: space-between; margin-bottom: 8px; }
.erd-pal { display: flex; flex-wrap: wrap; gap: 4px; }
.erd-pi { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 5px 3px; border: 1px solid var(--line); background: var(--sheet); border-radius: 8px; font-size: .7rem; color: var(--muted); cursor: grab; }
.erd-pi:hover { border-color: var(--accent); color: var(--accent); }
.erd-pi svg .shape { fill: var(--erd-a); stroke: var(--ink); stroke-width: 1.5; }
.erd-pi svg .shape.inner { fill: none; }
.erd-pi svg .shape.dashed { stroke-dasharray: 4 2; }
.erd-pi svg .ul { stroke: var(--ink); stroke-width: 1.4; } .erd-pi svg .ul.dashed { stroke-dasharray: 3 2; }
.erd-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.erd-acts .btn.on { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
.erd-stage { position: relative; }
.erd-node .hdl { opacity: 0; pointer-events: none; cursor: crosshair; transition: opacity .12s; }
.erd-node:hover .hdl, .erd-node.sel .hdl { opacity: 1; pointer-events: all; }
.erd-node .hdl circle { fill: var(--accent); stroke: var(--sheet); stroke-width: 2; }
.erd-node .hdl path { stroke: var(--sheet); stroke-width: 2; }
.erd-node.tgt .shape:not(.inner) { stroke: var(--ok); stroke-width: 3.2; }
.erd-node.editing .lbl, .erd-node.editing .ul { visibility: hidden; }
.tmp-link { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; }
.erd-inline { position: absolute; transform: translate(-50%, -50%); z-index: 3; font: 600 14px var(--f-body); text-align: center; padding: 5px 8px; border: 2px solid var(--accent); border-radius: 8px; background: var(--sheet); color: var(--ink); box-shadow: 0 4px 14px rgba(0, 0, 0, .15); }
.erd-inline:focus { outline: none; }
.erd-quick { position: absolute; transform: translate(-50%, calc(-100% - 14px)); z-index: 2; display: flex; gap: 3px; align-items: center; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px; box-shadow: 0 4px 14px rgba(0, 0, 0, .14); white-space: nowrap; font-size: .76rem; }
.erd-quick span { color: var(--muted); margin-right: 3px; }
.erd-quick button { min-width: 30px; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-weight: 700; font-family: var(--f-code); }
.erd-quick button.wide { font-family: var(--f-body); font-weight: 600; font-size: .74rem; padding: 0 7px; }
.erd-quick button.on { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.erd-quick button:hover { border-color: var(--accent); }
.erd-hint { margin: 6px 0 0; font-size: .8rem; color: var(--muted); min-height: 1.3em; }
.erd-props { margin-top: 8px; min-height: 40px; }
.erd-form { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--code-bg); border-radius: 10px; padding: 8px 12px; font-size: .86rem; }
.erd-form label { display: flex; gap: 6px; align-items: center; }
.erd-form input:not([type]), .erd-form select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--sheet); min-width: 0; }
.erd-form input:not([type]) { width: 11em; }
.erd-edge-name { font-weight: 600; }
.erd-view { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); padding: 6px; }
.erd-view .erd-svg { margin: 0 auto; }
ul.chk { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 3px; font-size: .9rem; }
ul.chk li::before { display: inline-block; width: 1.4em; font-weight: 700; }
ul.chk li.ok::before { content: "✓"; color: var(--ok); }
ul.chk li.bad::before { content: "✗"; color: var(--bad); }
ul.chk li.bad { font-weight: 500; }
ul.schema { list-style: none; padding: 0; margin: 6px 0; font-family: var(--f-code); font-size: .9rem; display: flex; flex-direction: column; gap: 3px; }
ul.schema .fk { color: var(--accent); }
ul.schema sup { font-size: .66rem; margin-left: 1px; }
ol.req { margin: 6px 0 10px; padding-left: 1.6em; font-size: .9rem; }
ol.req li { margin-bottom: 2px; }
details.spoiler > summary { cursor: pointer; color: var(--accent); font-weight: 600; margin: 8px 0; }
.erd-out { margin-top: 12px; }
.erd-out pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: .86rem; }
details.sandbox { border: 1.5px dashed var(--accent); border-radius: 12px; padding: 10px 14px 14px; margin: 0 0 22px; background: var(--paper); }
details.sandbox > summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 8px; }
details.sandbox > summary b { color: var(--accent); font-size: .98rem; }
details.sandbox > summary span { color: var(--muted); font-size: .8rem; }
details.sandbox:not([open]) > summary { margin-bottom: 0; }
.tbl tr.okrow td { background: var(--ok-soft); }
.mk { padding: 0 6px; border-radius: 4px; font-weight: 600; }
.mk.ok { background: var(--ok-soft); color: var(--ok); } .mk.bad { background: var(--bad-soft); color: var(--bad); }
.st-nav { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 10px; }
.st-nav button { min-width: 34px; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); font-weight: 700; font-family: var(--f-code); color: var(--muted); }
.st-nav button.done { border-color: var(--accent); color: var(--accent); }
.st-nav button.on { background: var(--accent); border-color: var(--accent); color: var(--sheet); }

.st-code { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; margin: 0 0 8px; font-size: .9rem; overflow-x: auto; }
.st-code .done { color: var(--muted); } .st-code .todo { opacity: .25; }
.st-code .cur { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 1px 3px; font-weight: 700; }

.st-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }

.warn { color: var(--bad); }
.tables { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0; }
.tbl table, table.t { border-collapse: collapse; }

.kwlist span { font-size: .8rem; font-weight: 600; padding: 1px 9px; border-radius: 999px; }
.kwlist .ok { background: var(--ok-soft); color: var(--ok); } .kwlist .ok::before { content: "✓ "; }

  q: `<p>과목 이름이 <code>'데이터베이스'</code>인 과목을 수강한 학생의 이름을 구하세요. 정답은 5명이에요.</p>`,
  ans: `π[SNAME](STUDENT *[SID, SID] TAKE_COURSE *[CID, CID] σ[CNAME = '데이터베이스'](COURSE))`,
  hints: ['STUDENT –(SID)– TAKE_COURSE –(CID)– COURSE 순서로 이어요.', '첨자 없이 STUDENT * TAKE_COURSE * σ[...](COURSE)라고 쓰면 3명만 나와요. 이름이 같은 DID까지 맞춰 버리거든요.', '조인 속성을 첨자로 정확히 적으세요: *[SID, SID], *[CID, CID]'],
  exp: `<p><b>첨자를 생략한 자연 조인의 함정</b>: 첨자가 없으면 이름이 같은 속성을 전부 맞춰요. STUDENT.DID(학생 소속)와 COURSE.DID(개설 학과)는 이름만 같고 뜻이 달라서, 다른 학과 과목을 들은 박서준·한도윤이 사라져요.</p><p>강의처럼 <b>첨자로 조인 속성을 적으면</b> 그 속성만 맞추니 안전해요. 다른 방법: 조인 전에 <code>π[CID]</code>로 필요한 열만 남기기.</p>` },
{ id: 'ra-j3-2', st: 'r6', kind: 'ra', tb: ['STUDENT', 'DEPARTMENT', 'TAKE_COURSE', 'COURSE'],
  title: '전자공학과 학생이 수강한 과목',
  q: `<p>학과 이름이 <code>'전자공학과'</code>인 학생들이 수강한 과목의 이름을 구하세요.</p>`,
  ans: `π[CNAME](COURSE *[CID, CID] (TAKE_COURSE *[SID, SID] π[SID](σ[DNAME = '전자공학과'](STUDENT *[DID, DID] DEPARTMENT))))`,
  hints: ['전자공학과 학생의 SID → 그 학생들의 CID → 과목 이름 순서로 좁혀 가요.', '여기도 DID 함정이 있어요. COURSE와 조인할 때 첨자를 *[CID, CID]로 적으면 피할 수 있어요.'],
  exp: `<p>안쪽부터: ① 전자공학과 학생 SID ② TAKE_COURSE와 조인해 CID ③ COURSE와 조인해 CNAME. 박서준은 컴공 과목(데이터베이스)도 들었기 때문에 DID 함정에 빠지면 데이터베이스가 빠져요.</p>` },
{ id: 'ra-j3-3', st: 'r6', kind: 'ra', tb: ['STUDENT', 'TAKE_COURSE', 'COURSE'], jb: '24-1 · 23-2',
  title: '2024년에 자료구조를 수강한 학생',
  q: `<p>2024년에 <code>'자료구조'</code>를 수강한 학생의 이름을 구하세요. (출제가능 문제의 "장르가 '액션'인 비디오를 예약한 고객 이름"과 같은 구조예요.)</p>`,
  ans: `π[SNAME](STUDENT *[SID, SID] σ[YEAR = 2024](TAKE_COURSE) *[CID, CID] σ[CNAME = '자료구조'](COURSE))`,
  hints: ['조건이 두 테이블에 하나씩 있어요: YEAR는 TAKE_COURSE, CNAME은 COURSE.'],
  exp: `<p>출제가능 문제 형태: <code>π<sub>NAME</sub>(CUSTOMER * RESERVED * σ<sub>GENRE='액션'</sub>(VIDEO))</code>. 조건은 해당 테이블에 먼저 σ를 걸고 조인하는 것이 깔끔해요.</p>` },

/* ── R7 외부 조인 ── */
{ id: 'ra-oj-1', st: 'r7', kind: 'fill', tb: ['STUDENT', 'TAKE_COURSE'],
  title: '외부 조인하면 몇 행이 늘까',
  q: `<p><code>STUDENT *[SID, SID] TAKE_COURSE</code>의 카디널리티는 [[0]]이고, 왼쪽 외부 조인 <code>STUDENT ⟕ TAKE_COURSE</code>의 카디널리티는 [[1]]이다.</p>`,
  blanks: [['13'], ['14']],
  exp: `<p>수강 기록 13개는 모두 짝이 있어 13행. 왼쪽 외부 조인은 짝 없는 왼쪽 행(윤채원)도 NULL을 채워 남기므로 14행이에요.</p>` },
{ id: 'ra-oj-2', st: 'r7', kind: 'ra', tb: ['DEPARTMENT', 'STUDENT'], req: ['⟕', '⟖', '⟗'],
  title: '학생이 없는 학과도 나오게',
  q: `<p>모든 학과의 이름과 소속 학생 이름을 구하세요. <b>학생이 한 명도 없는 학과도</b> 결과에 나와야 해요.</p>`,
  ans: `π[DNAME, SNAME](DEPARTMENT ⟕ STUDENT)`,
  hints: ['그냥 조인하면 수학과(D4)가 사라져요.', '살려야 하는 쪽이 왼쪽이면 ⟕(왼쪽 외부 조인)을 써요.'],
  exp: `<p>외부 조인은 짝이 없는 튜플도 버리지 않고 반대쪽 속성을 NULL로 채워요. ⟕ 왼쪽 보존, ⟖ 오른쪽 보존, ⟗ 양쪽 보존.</p>` },
{ id: 'ra-oj-3', st: 'r7', kind: 'fill', jb: '22-2 · 25-2',
  extra: { R1: { cols: ['A', 'B', 'C'], rows: [[1, 2, 3], [4, 2, 3], [7, 8, 9]] }, R2: { cols: ['B', 'C', 'D'], rows: [[2, 3, 10], [2, 3, 11], [6, 7, 12]] } },
  title: '외부 조인 결과 튜플 수 (출제가능)',
  q: `<p>두 릴레이션 R1(A,B,C), R2(B,C,D)를 B, C 기준으로 왼쪽 외부 조인, 오른쪽 외부 조인, 완전 외부 조인한 결과 튜플 수는 각각 [[0]], [[1]], [[2]]이다.</p>`,
  blanks: [['5'], ['5'], ['6']],
  exp: `<p>짝이 맞는 조합: R1의 (1,2,3)·(4,2,3) × R2의 (2,3,10)·(2,3,11) = <b>4개</b>.<br>왼쪽: 4 + 짝 없는 (7,8,9) = 5 · 오른쪽: 4 + 짝 없는 (6,7,12) = 5 · 완전: 4 + 1 + 1 = 6.</p><p>짝이 여러 개면 곱해서 늘어난다는 점이 함정이에요.</p>` },
{ id: 'ra-oj-4', st: 'r7', kind: 'choice', jb: '23-2 · 24-1',
  extra: { T1: { cols: ['A', 'B'], rows: [['aa', 10], ['bb', 20], ['cc', 30], ['dd', 20]] }, T2: { cols: ['B', 'C'], rows: [[20, 'xx'], [30, 'yy'], [40, 'zz']] },
    '결과 R1': { cols: ['A', 'B', 'C'], rows: [['aa', 10, null], ['bb', 20, 'xx'], ['cc', 30, 'yy'], ['dd', 20, 'xx'], [null, 40, 'zz']] },
    '결과 R2': { cols: ['A', 'B', 'C'], rows: [['bb', 20, 'xx'], ['dd', 20, 'xx'], ['cc', 30, 'yy'], [null, 40, 'zz']] } },
  title: '어떤 외부 조인일까 (출제가능)',
  q: `<p>T1 ㄱ T2 = 결과 R1, T1 ㄴ T2 = 결과 R2일 때 ㄱ, ㄴ을 바르게 연결한 것은?</p>`,
  opts: ['(ㄱ) 왼쪽 외부 조인 (ㄴ) 오른쪽 외부 조인', '(ㄱ) 오른쪽 외부 조인 (ㄴ) 완전 외부 조인', '(ㄱ) 완전 외부 조인 (ㄴ) 왼쪽 외부 조인', '(ㄱ) 완전 외부 조인 (ㄴ) 오른쪽 외부 조인'], ans: 3,
  exp: `<p>결과 R1에는 짝 없는 T1의 (aa,10)과 짝 없는 T2의 (40,zz)가 <b>둘 다</b> 있으니 완전 외부 조인. 결과 R2에는 T2의 (40,zz)만 남았으니 오른쪽 외부 조인이에요. <b>NULL이 어느 쪽 열에 생겼는지</b> 보면 바로 풀려요.</p>` },

/* ── R8 디비전 ── */
{ id: 'ra-div-1', st: 'r8', kind: 'ra', req: ['÷'],
  extra: { ENROLL: { cols: ['NAME', 'SUBJ'], rows: [['A', '수학'], ['A', '영어'], ['B', '수학'], ['C', '수학'], ['C', '영어'], ['C', '과학']] }, REQ: { cols: ['SUBJ'], rows: [['수학'], ['영어']] } },
  title: '필수 과목을 모두 들은 사람',
  q: `<p>ENROLL은 누가 어떤 과목을 들었는지, REQ는 필수 과목 목록이에요. <b>필수 과목을 모두</b> 들은 사람의 이름을 구하세요.</p>`,
  ans: `ENROLL ÷ REQ`,
  hints: ['"모든 ~를 ~한"이 나오면 디비전 ÷를 떠올리세요.', '피제수(왼쪽)는 (사람, 과목) 쌍, 제수(오른쪽)는 과목 목록이에요.'],
  exp: `<p>R ÷ S의 결과는 <b>S의 모든 튜플과 짝을 이루는</b> R의 나머지 속성 값이에요. A는 수학·영어 둘 다 있고, C는 과학까지 있지만 수학·영어도 있으니 포함. B는 영어가 없어서 탈락.</p>` },
{ id: 'ra-div-2', st: 'r8', kind: 'fill', extra: X_DIV,
  title: '디비전 결과에 남는 속성',
  q: `<p>R(a,b,c,d) ÷ S(b,c)의 결과 릴레이션의 속성은 [[0]]이다. (쉼표로 구분해서 적으세요.)</p>`,
  blanks: [['a,d', 'a, d', 'ad', 'd,a', 'd, a', '(a,d)', '(a, d)']],
  exp: `<p>결과 속성 = R의 속성 − S의 속성 = {a, b, c, d} − {b, c} = <b>{a, d}</b>. 이걸 정확히 알아야 디비전을 필수 연산자로 바꿀 수 있어요.</p>` },
{ id: 'ra-div-3', st: 'r8', kind: 'ra', tb: ['TAKE_COURSE', 'COURSE'], req: ['÷'],
  title: 'D1 개설 과목을 모두 들은 학생',
  q: `<p>학과 <code>'D1'</code>이 개설한 <b>모든 과목</b>을 수강한 학생의 학번을 디비전으로 구하세요.</p>`,
  ans: `π[SID, CID](TAKE_COURSE) ÷ π[CID](σ[DID = 'D1'](COURSE))`,
  hints: ['제수: D1이 개설한 과목번호 집합 = π[CID](σ[DID=\'D1\'](COURSE))', 'TAKE_COURSE를 그대로 나누면 YEAR가 남아서 (SID, YEAR) 쌍이 결과가 돼요. 피제수를 π[SID, CID]로 먼저 줄이세요.'],
  exp: `<p>디비전에서 제일 많이 하는 실수가 <b>피제수에 쓸데없는 열을 남기는 것</b>이에요. 피제수 = (결과로 원하는 속성 + 제수 속성)만 남겨야 해요.</p>` },
{ id: 'ra-div-4', st: 'r8', kind: 'ra', tb: ['STUDENT', 'TAKE_COURSE', 'COURSE', 'DEPARTMENT'], req: ['÷'], jb: '24봄 · 25-2',
  title: '컴퓨터공학과의 모든 과목을 들은 학생 이름',
  q: `<p>학과 이름이 <code>'컴퓨터공학과'</code>인 학과에서 개설한 <b>모든 과목을 수강한</b> 학생들의 이름을 구하세요.</p>`,
  ans: `π[SNAME](STUDENT *[SID, SID] (π[SID, CID](TAKE_COURSE) ÷ π[CID](σ[DNAME = '컴퓨터공학과'](COURSE *[DID, DID] DEPARTMENT))))`,
  hints: ['앞 문제에서 D1 대신 학과 이름을 쓰려면 COURSE와 DEPARTMENT를 조인해야 해요.', '디비전 결과(SID)를 STUDENT와 조인해서 이름을 얻어요.'],
  exp: `<p>디비전으로 학번을 구한 뒤 <b>자연 조인으로 이름을 붙이는</b> 모양은 출제가능 문제에 계속 나와요: <code>π<sub>이름</sub>(사원 *<sub>주민등록번호, 주민등록번호</sub> (근무 ÷ 수원프로젝트))</code>.</p>` },
{ id: 'ra-div-5', st: 'r8', kind: 'ra', tb: ['STUDENT', 'TAKE_COURSE', 'COURSE', 'DEPARTMENT'], req: ['÷'], jb: '24봄',
  title: '컴퓨터공학과의 모든 학생이 들은 과목',
  q: `<p>컴퓨터공학과에 속한 <b>모든 학생이 수강한</b> 과목들의 이름을 구하세요. 앞 문제와 무엇이 다른지 비교해 보세요.</p>`,
  ans: `π[CNAME](COURSE *[CID, CID] (π[CID, SID](TAKE_COURSE) ÷ π[SID](σ[DNAME = '컴퓨터공학과'](STUDENT *[DID, DID] DEPARTMENT))))`,
  hints: ['이번에는 "모든 학생"이니 제수가 학생 집합(SID)이에요.', '결과가 과목(CID)이 되도록 피제수는 (CID, SID)예요.'],
  exp: `<p>"모든 <b>과목</b>을 들은 학생" → 제수가 과목. "모든 <b>학생</b>이 들은 과목" → 제수가 학생. 24봄 출제가능 문제는 (a)(b)에서 이 방향만 바꿔서 냈어요.</p>` },

/* ── R9 필수 연산자 ── */
{ id: 'ra-ess-1', st: 'r9', kind: 'ra', tb: ['STUDENT', 'TAKE_COURSE'], essential: true,
  title: '조인을 × 와 σ로',
  q: `<p><code>π[SNAME](STUDENT *[SID, SID] TAKE_COURSE)</code>와 같은 결과를 <b>필수 연산자(σ, π, ∪, −, ×)만</b> 써서 구하세요.</p>`,
  ans: `π[SNAME](σ[STUDENT.SID = TAKE_COURSE.SID](STUDENT × TAKE_COURSE))`,
  hints: ['자연 조인 = 카티션 곱 + 같은 이름 속성끼리 같다는 σ + 중복 열 제거(π).'],
  exp: `<p>관계 대수의 필수 연산자는 <b>σ, π, ∪, −, ×</b> 다섯 개예요(21-2·22-2·24봄 단골 문제). ∩, ⋈, *, ÷는 모두 이 다섯 개로 표현되는 유도 연산자예요.</p>` },
{ id: 'ra-ess-2', st: 'r9', kind: 'ra', tb: ['TAKE_COURSE'], essential: true,
  title: '∩ 없이 교집합',
  q: `<p>C1과 C2를 모두 수강한 학생의 학번을 <b>∩ 없이</b> 구하세요. 임시 이름을 쓰면 편해요: <code>A ← 식</code></p>`,
  ans: `A ← π[SID](σ[CID = 'C1'](TAKE_COURSE))
B ← π[SID](σ[CID = 'C2'](TAKE_COURSE))
A − (A − B)`,
  hints: ['A ∩ B = A − (A − B). 벤 다이어그램을 그려 보세요.'],
  exp: `<p><b>A ∩ B = A − (A − B)</b>. ∩가 필수 연산자가 아닌 이유예요.</p>` },
/* ── R10 γ ── */
{ id: 'ra-grp-1', st: 'r10', kind: 'ra', tb: ['STUDENT'], req: ['γ'],
  title: '학과별 학생 수',
  q: `<p>학과번호별 학생 수를 구하세요. 형식: <code>γ[그룹 속성; 집계함수(속성) AS 이름](R)</code></p>`,
  ans: `γ[DID; COUNT(SID) AS CNT](STUDENT)`,
  hints: ['그룹으로 묶을 속성은 DID, 셀 것은 SID예요.'],
  exp: `<p>강의 표기는 <code><sub>DID</sub>𝒢<sub>COUNT(SID)</sub>(STUDENT)</code>처럼 그룹 속성을 𝒢의 왼쪽 아래, 집단 함수를 오른쪽 아래에 써요(강의 예: <sub>DNO</sub>𝒢<sub>AVG(SALARY)</sub>(EMPLOYEE)). 시험 답안에는 강의 표기로 쓰세요. γ[ ; ]는 이 문제집의 입력 방식이에요.</p>` },
{ id: 'ra-grp-2', st: 'r10', kind: 'ra', tb: ['STUDENT', 'DEPARTMENT'], req: ['γ'],
  title: '학과 이름별 평균 나이',
  q: `<p>학과 이름(<code>DNAME</code>)별 평균 나이를 구하세요.</p>`,
  ans: `γ[DNAME; AVG(AGE) AS AVG_AGE](STUDENT *[DID, DID] DEPARTMENT)`,
  hints: ['STUDENT에는 학과 이름이 없으니 먼저 DEPARTMENT와 조인해요.'],
  exp: `<p>γ도 다른 연산처럼 조인 결과 위에 걸 수 있어요. 학생이 없는 수학과는 STUDENT *[DID, DID] DEPARTMENT에서 이미 빠져서 결과에 없어요.</p>` },
{ id: 'ra-grp-3', st: 'r10', kind: 'ra', tb: ['TAKE_COURSE', 'COURSE'], req: ['γ'], jb: '25-2',
  title: '수강생이 3명 이상인 과목',
  q: `<p>수강 인원이 <b>3명 이상</b>인 과목의 이름을 구하세요.</p>`,
  ans: `π[CNAME](σ[CNT >= 3](γ[CID; COUNT(SID) AS CNT](TAKE_COURSE)) *[CID, CID] COURSE)`,
  hints: ['① γ로 과목별 수강 인원을 세고 ② σ로 3 이상만 고르고 ③ COURSE와 조인해서 이름을 얻어요.', 'γ에서 붙인 별칭(CNT)을 σ 조건에 그대로 쓸 수 있어요.'],
  exp: `<p>SQL의 <code>GROUP BY ... HAVING COUNT(*) &gt;= 3</code>이 관계 대수로는 <b>γ 다음 σ</b>예요.</p>` },
{ id: 'ra-grp-4', st: 'r10', kind: 'fill', tb: ['STUDENT'],
  title: '그룹 없이 집계',
  q: `<p><code>γ[COUNT(*) AS N, MAX(AGE) AS M](STUDENT)</code>의 결과는 N = [[0]], M = [[1]]인 한 행이다.</p>`,
  blanks: [['7'], ['25']],
  exp: `<p>그룹 속성이 없으면 릴레이션 전체가 한 그룹이라 결과는 <b>한 행</b>이에요.</p>` },

/* ── R11 실전 ── */
{ id: 'ra-x-1', st: 'r11', kind: 'ra', tb: ['사원', '근무', '프로젝트'], req: ['÷'], jb: '21-2 #17 · 22-2',
  title: '수원의 모든 프로젝트에 참여한 사원 (디비전)',
  q: `<p>사원(이름, 주민등록번호, 봉급), 근무(주민등록번호, 프로젝트번호, 참여시간), 프로젝트(프로젝트명, 프로젝트번호, 위치)가 있다. <b>위치가 수원인 모든 프로젝트에 참여하는</b> 사원 이름을 구하는 관계 대수식을 디비전 연산자를 사용하여 작성하시오.</p>`,
  ans: `π[이름](사원 *[주민등록번호, 주민등록번호] (π[주민등록번호, 프로젝트번호](근무) ÷ π[프로젝트번호](σ[위치 = '수원'](프로젝트))))`,
  hints: ['제수: 수원 프로젝트 번호 집합', '피제수: (주민등록번호, 프로젝트번호) — 참여시간은 빼야 해요.'],
  exp: `<p>앞 단계 ra-div-4와 완전히 같은 뼈대예요. 피제수에서 참여시간을 빼지 않으면 결과에 참여시간이 섞여 틀려요.</p>` },
{ id: 'ra-x-3', st: 'r11', kind: 'ra', tb: ['EMP', 'DEPT'], req: ['γ'], jb: '25-2',
  title: '그룹화 관계대수 (출제가능 유형)',
  q: `<p>부서별 평균 급여(<code>SALARY</code>)가 <b>12000 이상</b>인 부서의 부서 이름과 사원 수를 구하세요.</p>`,
  ans: `π[DEPTNAME, CNT](σ[AVG_SAL >= 12000](γ[DNO; COUNT(EID) AS CNT, AVG(SALARY) AS AVG_SAL](EMP)) *[DNO, DEPTNO] DEPT)`,
  hints: ['γ 하나에 집계 함수 두 개를 쉼표로 이어 쓸 수 있어요.', 'γ → σ → 조인 → π 순서예요.'],
  exp: `<p>부서별 평균: 10번 16666.67, 20번 11333.33, 30번 14250. 그래서 영업(3명), 개발(2명)만 남아요.</p>` },
{ id: 'ra-x-4', st: 'r11', kind: 'ra', tb: ['STUDENT', 'TAKE_COURSE', 'COURSE'],
  title: 'D1 과목을 하나도 듣지 않은 학생',
  q: `<p>학과 D1이 개설한 과목을 <b>하나도 수강하지 않은</b> 학생의 이름을 구하세요. (수강을 아예 안 한 학생도 포함)</p>`,
  ans: `π[SNAME](STUDENT *[SID, SID] (π[SID](STUDENT) − π[SID](TAKE_COURSE *[CID, CID] π[CID](σ[DID = 'D1'](COURSE)))))`,
  hints: ['"하나라도 수강한 학생"을 먼저 구하고 전체에서 빼요.', 'σ[CID <> ...]로 풀면 다른 과목을 하나라도 들은 학생이 다 나와서 틀려요.'],
  exp: `<p>부정("하지 않은")을 σ의 &lt;&gt;로 풀면 거의 틀려요. <b>긍정 집합을 만들고 전체에서 빼는</b> 방법이 정석이에요. 결과: 최유나(회로이론만), 윤채원(수강 없음).</p>` },

/* ── S1 ── */
{ id: 'sq-1', st: 's1', kind: 'sql', tb: ['STUDENT'],
  title: '테이블 전체 보기',
  q: `<p>STUDENT 테이블의 모든 행과 모든 열을 출력하세요.</p>`,
  ans: `SELECT *\nFROM STUDENT;`,
  hints: ['* 는 "모든 열"이라는 뜻이에요.'],
  exp: `<p>SQL 결과 비교에서는 행 순서를 따지지 않아요. ORDER BY가 필요한 문제에서만 순서를 채점해요.</p>` },
{ id: 'sq-2', st: 's1', kind: 'sql', tb: ['STUDENT'],
  title: '이름과 나이만',
  q: `<p>모든 학생의 이름(<code>SNAME</code>)과 나이(<code>AGE</code>)를 출력하세요.</p>`,
  ans: `SELECT SNAME, AGE\nFROM STUDENT;`,
  hints: ['SELECT 뒤에 원하는 열을 쉼표로 나열해요.'],
  exp: `<p>관계 대수의 <code>π[SNAME, AGE](STUDENT)</code>가 SQL의 <code>SELECT SNAME, AGE FROM STUDENT</code>예요.</p>` },
{ id: 'sq-3', st: 's1', kind: 'sql', tb: ['STUDENT'], need: [[/\bDISTINCT\b/i, 'DISTINCT를 써서 중복을 없애 보세요.']],
  title: '학과번호를 중복 없이',
  q: `<p>학생들이 소속된 학과번호를 <b>중복 없이</b> 출력하세요.</p>`,
  ans: `SELECT DISTINCT DID\nFROM STUDENT;`,
  hints: ['그냥 SELECT DID를 실행해 보면 7행이 나와요.'],
  exp: `<p>관계 대수 π는 자동으로 중복을 제거하지만, SQL의 SELECT는 <b>중복을 그대로 둬요</b>(테이블은 집합이 아니라 다중집합). 중복을 없애려면 DISTINCT를 써야 해요.</p>` },
{ id: 'sq-4', st: 's1', kind: 'choice', jb: '23-2 · 24-1',
  title: 'SELECT문의 필수 절',
  q: `<p>참/거짓: "데이터 검색을 수행하기 위해서 SELECT, FROM, WHERE 절은 필수적으로 필요하며 GROUP BY, HAVING, ORDER BY는 선택이다."</p>`,
  opts: ['참', '거짓'], ans: 1,
  exp: `<p>필수는 <b>SELECT와 FROM</b>뿐이에요. WHERE도 선택이에요(방금 sq-1에서 WHERE 없이 실행했죠).</p>` },

/* ── S2 ── */
{ id: 'sq-5', st: 's2', kind: 'sql', tb: ['STUDENT'],
  title: '22살 이상 컴퓨터공학과 학생',
  q: `<p>나이가 22 이상이고 학과번호가 <code>'D1'</code>인 학생의 이름을 출력하세요.</p>`,
  ans: `SELECT SNAME\nFROM STUDENT\nWHERE AGE >= 22 AND DID = 'D1';`,
  hints: ['문자열은 작은따옴표. 큰따옴표는 SQL에서 열 이름(별칭)용이에요.'],
  exp: `<p>관계 대수 <code>π[SNAME](σ[AGE >= 22 AND DID = 'D1'](STUDENT))</code>와 같아요. σ의 조건이 WHERE, π의 속성이 SELECT로 갑니다.</p>` },
{ id: 'sq-6', st: 's2', kind: 'sql', tb: ['STUDENT'], need: [[/\bBETWEEN\b/i, 'BETWEEN을 써서 풀어 보세요.']],
  title: '나이가 21~23인 학생',
  q: `<p>나이가 21 이상 23 이하인 학생의 이름과 나이를 <b>BETWEEN</b>으로 출력하세요.</p>`,
  ans: `SELECT SNAME, AGE\nFROM STUDENT\nWHERE AGE BETWEEN 21 AND 23;`,
  hints: ['BETWEEN a AND b는 양 끝(a, b)을 포함해요.'],
  exp: `<p><code>AGE BETWEEN 21 AND 23</code> = <code>AGE &gt;= 21 AND AGE &lt;= 23</code>. 양 끝 포함이라는 점이 객관식에 자주 나와요.</p>` },
{ id: 'sq-7', st: 's2', kind: 'sql', tb: ['STUDENT'], need: [[/\bIN\s*\(/i, 'IN ( ... ) 을 써서 풀어 보세요.']],
  title: 'D2 또는 D3 학생',
  q: `<p>학과번호가 D2 또는 D3인 학생의 이름을 <b>IN</b>으로 출력하세요.</p>`,
  ans: `SELECT SNAME\nFROM STUDENT\nWHERE DID IN ('D2', 'D3');`,
  hints: ['WHERE 열 IN (값1, 값2)'],
  exp: `<p><code>DID IN ('D2','D3')</code>는 <code>DID = 'D2' OR DID = 'D3'</code>로 바뀌어요. 21-2 출제가능 문제는 이 변환을 NOT IN에 적용하라고 냈어요(4단계에서 다시 나와요).</p>` },
{ id: 'sq-8', st: 's2', kind: 'sql', tb: ['EMP'], need: [[/\bLIKE\b/i, 'LIKE를 써서 풀어 보세요.']],
  title: '김씨 사원',
  q: `<p>EMP에서 이름(<code>ENAME</code>)이 <b>'김'으로 시작하는</b> 사원의 이름을 출력하세요.</p>`,
  ans: `SELECT ENAME\nFROM EMP\nWHERE ENAME LIKE '김%';`,
  hints: ['% 는 "0글자 이상 아무거나"예요.'],
  exp: `<p><code>%</code> = 0자 이상 아무 문자열, <code>_</code> = 정확히 1글자.</p>` },
{ id: 'sq-9', st: 's2', kind: 'sql', tb: ['EMP'], need: [[/\bLIKE\b/i, 'LIKE를 써서 풀어 보세요.']], jb: '24-1 · 23-2',
  title: '이름에 "민"이 들어가는 사원',
  q: `<p>이름 <b>어딘가에 '민'이 들어가는</b> 사원의 이름을 출력하세요.</p>`,
  ans: `SELECT ENAME\nFROM EMP\nWHERE ENAME LIKE '%민%';`,
  hints: ['앞뒤에 모두 %를 붙여요.'],
  exp: `<p>출제가능 문제에서는 공급자 표를 주고 "대신공업사, 신촌상사"만 나오는 질의를 고르거나 직접 쓰게 했어요. 답은 <code>LIKE '%신%'</code>.</p>` },
{ id: 'sq-10', st: 's2', kind: 'choice', tb: ['EMP'],
  title: '_ 와일드카드',
  q: `<p><code>WHERE ENAME LIKE '_수%'</code>를 만족하는 사원은?</p>`,
  opts: ['이수민', '김상원', '조민희', '최종철'], ans: 0,
  exp: `<p><code>_</code>는 정확히 한 글자라서 "두 번째 글자가 수"인 이름이에요.</p>` },

/* ── S3 ── */
{ id: 'sq-11', st: 's3', kind: 'sql', tb: ['STUDENT'], ordered: true,
  title: '학과순, 같은 학과는 나이 많은 순',
  q: `<p>학생의 이름, 학과번호, 나이를 출력하되 <b>학과번호 오름차순</b>, 같은 학과 안에서는 <b>나이 내림차순</b>으로 정렬하세요.</p>`,
  ans: `SELECT SNAME, DID, AGE\nFROM STUDENT\nORDER BY DID, AGE DESC;`,
  hints: ['ORDER BY 열1, 열2 DESC — ASC는 생략 가능(기본값)'],
  exp: `<p>정렬 기준은 왼쪽부터 적용돼요. 24-1 출제가능 "ORDER BY DEPTNO, SAL DESC 결과 쓰기"가 이 문제예요.</p>` },
{ id: 'sq-12', st: 's3', kind: 'sql', tb: ['EMP'], ordered: true,
  title: '연봉 별칭과 정렬',
  q: `<p>사원 이름과 연봉(<code>SALARY * 12</code>)을 출력하세요. 연봉 열의 이름은 <b>연봉</b>으로 하고, 연봉이 큰 순서로 정렬하세요.</p>`,
  ans: `SELECT ENAME, SALARY * 12 AS 연봉\nFROM EMP\nORDER BY 연봉 DESC;`,
  hints: ['열 별칭: 식 AS 이름', 'ORDER BY에는 별칭을 쓸 수 있어요(WHERE에는 못 써요).'],
  exp: `<p>별칭에 공백이 있으면 큰따옴표가 필요해요: <code>COUNT(*) "EMP NUM"</code> (24-1 출제가능). SQL 실행 순서가 FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY라서 별칭은 ORDER BY에서만 쓸 수 있어요.</p>` },

/* ── S4 NULL ── */
{ id: 'sq-13', st: 's4', kind: 'sql', tb: ['EMP'],
  title: '커미션이 없는 사원',
  q: `<p>커미션(<code>COMM</code>)이 <b>NULL</b>인 사원의 이름을 출력하세요.</p>`,
  ans: `SELECT ENAME\nFROM EMP\nWHERE COMM IS NULL;`,
  hints: ['WHERE COMM = NULL을 실행해 보세요. 왜 0행일까요?'],
  exp: `<p>NULL과의 비교(=, &lt;&gt;)는 항상 <b>UNKNOWN</b>이라 WHERE를 통과하지 못해요. 반드시 <code>IS NULL</code> / <code>IS NOT NULL</code>. 한지우의 COMM은 0이지 NULL이 아니라서 결과에 없어요.</p>` },
{ id: 'sq-17', st: 's4', kind: 'fill', tb: ['EMP'], jb: '21-2 #12',
  title: 'NOT IN과 NULL (출제가능)',
  q: `<p><code>SELECT COUNT(*) FROM EMP WHERE EID NOT IN (1001, NULL)</code>의 결과는 [[0]]이고,<br><code>SELECT COUNT(*) FROM EMP WHERE EID IN (1001, NULL)</code>의 결과는 [[1]]이다.</p>`,
  blanks: [['0'], ['1']],
  exp: `<p><code>EID NOT IN (1001, NULL)</code> = <code>EID &lt;&gt; 1001 AND EID &lt;&gt; NULL</code>. 뒤쪽이 항상 UNKNOWN이라 AND 전체가 TRUE가 될 수 없어서 <b>한 행도 안 나와요</b>.<br><code>IN</code>은 <code>EID = 1001 OR EID = NULL</code>이라 1001은 TRUE OR UNKNOWN = TRUE로 나와요.</p>` },

/* ── S5 집계 ── */
{ id: 'sq-18', st: 's5', kind: 'sql', tb: ['STUDENT'],
  title: '전체 학생 수와 평균 나이',
  q: `<p>전체 학생 수와 평균 나이를 한 행으로 출력하세요.</p>`,
  ans: `SELECT COUNT(*), AVG(AGE)\nFROM STUDENT;`,
  hints: ['COUNT(*), AVG(열)'],
  exp: `<p>GROUP BY가 없으면 테이블 전체가 한 그룹이라 결과는 한 행이에요.</p>` },
{ id: 'sq-19', st: 's5', kind: 'sql', tb: ['STUDENT'],
  title: '학과별 학생 수',
  q: `<p>학과번호별 학생 수를 출력하세요.</p>`,
  ans: `SELECT DID, COUNT(*)\nFROM STUDENT\nGROUP BY DID;`,
  hints: ['GROUP BY DID', 'SELECT에는 GROUP BY에 쓴 열과 집계 함수만 올 수 있어요.'],
  exp: `<p>관계 대수 <code>γ[DID; COUNT(SID)](STUDENT)</code>와 같아요.</p>` },
{ id: 'sq-20', st: 's5', kind: 'sql', tb: ['STUDENT'], need: [[/\bHAVING\b/i, '그룹에 대한 조건은 HAVING에 써요.']],
  title: '평균 나이 22.5 이상인 학과',
  q: `<p>평균 나이가 <b>22.5 이상</b>인 학과의 학과번호와 평균 나이를 출력하세요.</p>`,
  ans: `SELECT DID, AVG(AGE)\nFROM STUDENT\nGROUP BY DID\nHAVING AVG(AGE) >= 22.5;`,
  hints: ['WHERE AVG(AGE) >= 22.5는 오류예요. WHERE는 그룹을 만들기 전에 행을 걸러요.'],
  exp: `<p><b>WHERE = 행 조건(그룹 전)</b>, <b>HAVING = 그룹 조건(집계 후)</b>. 집계 함수 조건은 HAVING에만 쓸 수 있어요.</p>` },
{ id: 'sq-21', st: 's5', kind: 'sql', tb: ['BOOK'], jb: '21-2 #13(1)',
  title: '책을 많이 낸 출판사 (출제가능)',
  q: `<p>BOOK(book_id, title, publisher, year)에서 <b>2023년 이후에 3권 이상</b>의 책을 발행한 출판사의 이름을 중복 없이 출력하세요. (출제가능 문제는 2010년 이후 10권 이상)</p>`,
  ans: `SELECT PUBLISHER\nFROM BOOK\nWHERE YEAR >= 2023\nGROUP BY PUBLISHER\nHAVING COUNT(*) >= 3;`,
  hints: ['"2023년 이후" 조건은 행 조건(WHERE), "3권 이상"은 그룹 조건(HAVING)', 'GROUP BY를 하면 출판사가 그룹마다 한 번만 나와서 DISTINCT가 필요 없어요.'],
  exp: `<p>조건 두 개가 WHERE와 HAVING으로 나뉘는 대표 문제예요. 2023 포함 여부("이후")는 시험에서 문제를 꼭 확인하세요.</p>` },
{ id: 'sq-22', st: 's5', kind: 'fill', tb: ['EMP'], jb: '22-2 · 25-2',
  title: 'GROUP BY 결과의 크기 (출제가능)',
  q: `<pre>SELECT DNO, SUM(SALARY)
FROM EMP
GROUP BY DNO
HAVING DNO = 10 OR DNO = 30;</pre><p>위 SQL 결과 릴레이션의 차수는 [[0]]이고 카디널리티는 [[1]]이다.</p>`,
  blanks: [['2'], ['2']],
  exp: `<p>차수 = SELECT 목록의 개수(DNO, SUM) = 2. 카디널리티 = HAVING을 통과한 그룹 수(10, 30) = 2. 25-2의 <code>SELECT CITY, SUM(POPULATION) ... HAVING CITY = 서울 OR 부산 OR 인천</code>도 같은 방식으로 풀어요.</p>` },
{ id: 'sq-23', st: 's5', kind: 'choice', tb: ['EMP'], jb: '24-1',
  title: '오류가 나는 이유 (출제가능)',
  q: `<p><code>SELECT DNO, SUM(SALARY) FROM EMP</code>를 Oracle에서 실행하면?</p>`,
  opts: ['부서별 합계 3행이 나온다', '전체 합계 1행과 첫 행의 DNO가 나온다', '오류: 집계 함수와 일반 열을 GROUP BY 없이 함께 썼다', '오류: SUM은 WHERE와 함께만 쓸 수 있다'], ans: 2,
  exp: `<p>DNO는 행마다 값이 다른데 SUM은 한 값이라 짝을 지을 수 없어요. 해결: <code>GROUP BY DNO</code>를 추가하거나 DNO를 SELECT에서 빼요. (SQLite는 ②처럼 동작하지만, 이 문제집의 실행기는 Oracle처럼 오류로 처리해요.)</p>` },
{ id: 'sq-24', st: 's5', kind: 'sql', tb: ['과제'], jb: '22-2 · 23-2',
  title: '학생이 20명 이상인 동아리 (출제가능)',
  q: `<p>과제(학년, 동아리, 학생수, 과제수) 테이블에서 '학생이 <b>20명 이상</b> 가입한 동아리에 대하여 동아리와 제출한 총 과제 수를 출력하시오'를 수행하는 SQL을 쓰세요.</p>`,

/* ════════════════════ 개념 페이지 ════════════════════
   body 안의 @@n@@ 자리에 ex[n] 예제(직접 실행·수정 가능)가 들어간다. */
const CONCEPTS = {
r0: { title: '관계 대수 들어가기',
  lead: '관계 대수는 릴레이션을 입력받아 <b>새 릴레이션 하나</b>를 내놓는 연산들의 모음이에요. 결과가 다시 릴레이션이라서 연산을 겹겹이 쌓아 질의 하나를 만들어요.',
  body: `
<h3>관계 해석과 관계 대수</h3>
<table class="doc"><tr><th></th><th>관계 해석</th><th>관계 대수</th></tr>
<tr><td>성격</td><td><b>선언적</b>: 무엇을 원하는지만</td><td><b>절차적</b>: 어떤 연산을 어떤 순서로</td></tr>
<tr><td>예</td><td><code>{e | e ∈ EMPLOYEE ∧ e.SALARY &gt; 5000000}</code></td><td>σ, π, ⋈ 같은 연산자 조합</td></tr></table>
<p>관계 대수는 <b>SQL의 이론적 기초</b>예요. DBMS는 SQL을 관계 대수식으로 바꾼 뒤 가장 빠른 수행 계획을 찾아요.</p>
<h3>연산자 분류 (시험 단골)</h3>
<table class="doc"><tr><th>분류</th><th>연산자</th><th>입력 개수</th></tr>
<tr><td rowspan="2"><b>필수(기본)</b></td><td>σ 실렉션, π 프로젝션</td><td>단항</td></tr>
<tr><td>∪ 합집합, − 차집합, × 카티션 곱</td><td>이항</td></tr>
<tr><td><b>유도</b></td><td>∩ 교집합, 세타·동등·자연 조인, 세미 조인, ÷ 디비전</td><td>이항</td></tr>
<tr><td><b>추가(한계 보완)</b></td><td>집단 함수, 그룹화 𝒢, 외부 조인 ⟕ ⟖ ⟗</td><td></td></tr></table>
<p class="key">필수 연산자 5개 <b>σ π ∪ − ×</b> 만으로 나머지를 모두 표현할 수 있어요. 이것을 <b>관계적 완전성</b>(relationally complete)이라고 해요.</p>
<h3>차수와 카디널리티</h3>
<p><b>차수(degree)</b> = 열(애트리뷰트) 수, <b>카디널리티(cardinality)</b> = 행(투플) 수. 연산마다 둘이 어떻게 바뀌는지가 계속 출제돼요.</p>
<h3>문장 → 식 번역표</h3>
<table class="doc"><tr><th>문장</th><th>연산</th></tr>
<tr><td>~인 것만</td><td>σ</td></tr><tr><td>~의 목록, ~만 보여라</td><td>π (맨 바깥)</td></tr>
<tr><td>~를 수강한 학생, ~에 속한 ~</td><td>조인 (* 또는 ×와 σ)</td></tr>

s0: { title: 'SQL 들어가기',
  lead: 'SQL은 <b>비절차적(선언적)</b> 언어예요. 무엇을 원하는지만 쓰면 DBMS가 관계 대수식으로 바꿔서 수행 방법을 정해요.',

<tr><td>DDL (데이터 정의어)</td><td>스키마·테이블·제약조건 정의</td><td>CREATE, ALTER, DROP</td></tr>

<h3>SELECT 문의 모양과 실행 순서</h3>
<pre class="fxpre">SELECT   [DISTINCT] 열 또는 식        ⑤
FROM     테이블들                    ①
[WHERE   행 조건]                    ②
[GROUP BY 그룹으로 묶을 열]           ③
[HAVING  그룹 조건]                  ④
[ORDER BY 정렬 기준]                 ⑥</pre>
<p><b>SELECT와 FROM만 필수</b>예요. 강의는 FROM(대상 테이블) → WHERE(σ) → SELECT(π) 순서로 수행된다고 설명해요. GROUP BY·HAVING·ORDER BY까지 넣은 전체 순서 FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY는 <span class="xtag">강의 외 보충</span>이고, 그래서 SELECT에서 붙인 별칭은 ORDER BY에서만 쓸 수 있어요.</p>
<h3>관계 대수 ↔ SQL</h3>
<table class="doc"><tr><th>관계 대수</th><th>SQL</th></tr>
<tr><td>σ 조건</td><td>WHERE 조건</td></tr><tr><td>π 열 (중복 제거)</td><td>SELECT DISTINCT 열 (DISTINCT 없으면 중복 유지)</td></tr>
<tr><td>R × S</td><td>FROM R, S</td></tr><tr><td>R ⋈ S</td><td>FROM R, S WHERE 조인조건</td></tr>
<tr><td>∪ ∩ −</td><td>UNION, INTERSECT, EXCEPT</td></tr>
<tr><td>𝒢 그룹화</td><td>GROUP BY + 집단 함수</td></tr></table>
<p class="note">SQL의 SELECT는 관계 대수의 실렉션(σ)과 <b>뜻이 달라요</b>. SELECT 문 전체가 σ, π, ×, ⋈을 합친 거예요.</p>
<h3>문장 → SQL 번역표</h3>
<table class="doc"><tr><th>문장</th><th>SQL</th></tr>
<tr><td>~별</td><td>GROUP BY</td></tr><tr><td>~ 이상인 그룹</td><td>HAVING SUM(..) &gt;= N</td></tr>
<tr><td>NULL이 아닌</td><td>IS NOT NULL</td></tr><tr><td>이름에 ~가 들어가는</td><td>LIKE '%~%'</td></tr>
<tr><td>평균보다 (자기 그룹의)</td><td>서브쿼리 (상관 서브쿼리)</td></tr></table>
<h3>이 문제집의 SQL 실행기</h3>

@@0@@`,

  lead: 'NULL은 "알 수 없음" 또는 "해당 없음"이에요. 0이나 빈 문자열과 다르고, 비교하면 결과가 <b>UNKNOWN</b>이 돼요.',
  body: `
<ul><li>NULL 검사는 반드시 <code>IS NULL</code> / <code>IS NOT NULL</code>. <code>= NULL</code>은 항상 UNKNOWN이라 아무 행도 안 나와요.</li>
<li>WHERE는 결과가 <b>TRUE인 행만</b> 통과시켜요 (FALSE, UNKNOWN은 탈락).</li></ul>
<h3>3값 논리</h3>
<table class="doc"><tr><th>AND</th><th>T</th><th>U</th><th>F</th></tr><tr><td><b>T</b></td><td>T</td><td>U</td><td>F</td></tr><tr><td><b>U</b></td><td>U</td><td>U</td><td>F</td></tr><tr><td><b>F</b></td><td>F</td><td>F</td><td>F</td></tr></table>
<p>OR은 하나라도 T면 T, NOT U = U. (T=1, U=½, F=0으로 두면 AND = min, OR = max, NOT = 1 − C)</p>
<h3>집단 함수와 NULL</h3>
<p><b>COUNT(*)</b>만 NULL 포함 행 수를 세고, 나머지(COUNT(열), SUM, AVG, MAX, MIN)는 NULL을 <b>빼고</b> 계산해요. 대상 행이 없으면 COUNT는 0, 나머지는 NULL.</p>
@@0@@
<h3>NOT IN과 NULL</h3>
<p><code>X NOT IN (1001, NULL)</code> = <code>X &lt;&gt; 1001 AND X &lt;&gt; NULL</code>. 뒤쪽이 항상 UNKNOWN이라 전체가 TRUE가 될 수 없어서 <b>한 행도 안 나와요</b> (21-2 출제가능).</p>
@@1@@`,
  ex: [{ k: 'sql', cap: 'COUNT(*)와 COUNT(COMM)의 차이, AVG(COMM)는 NULL을 빼고 계산', code: `SELECT COUNT(*), COUNT(COMM), SUM(COMM), AVG(COMM)\nFROM EMP;` },
       { k: 'sql', cap: 'NOT IN 목록에 NULL이 있으면 0행', code: `SELECT ENAME FROM EMP\nWHERE EID NOT IN (1001, NULL);` }] },

/* ════════════════════ 관계 대수 엔진 ════════════════════ */
class RAError extends Error { constructor(msg, pos) { super(msg); this.pos = pos; } }
const UP = s => String(s).toUpperCase();
const OPCH = { 'π': 'π', 'σ': 'σ', 'ρ': 'ρ', 'γ': 'γ', '×': '×', '⋈': '⋈', '*': '*', '÷': '÷', '∪': '∪', '∩': '∩', '−': '−', '-': '−', '⟕': '⟕', '⟖': '⟖', '⟗': '⟗', '/': '÷' };
const WORDOP = { PI: 'π', SIGMA: 'σ', RHO: 'ρ', GAMMA: 'γ', UNION: '∪', INTERSECT: '∩', MINUS: '−', CROSS: '×', TIMES: '×', JOIN: '⋈', DIVIDE: '÷', LJOIN: '⟕', RJOIN: '⟖', FJOIN: '⟗' };
const KW = ['AND', 'OR', 'NOT', 'IS', 'NULL', 'AS'];
const isId = c => /[A-Za-z0-9_$#가-힣ㄱ-ㅎㅏ-ㅣ]/.test(c);
const BIN = { '∪': 1, '−': 1, '∩': 2, '×': 3, '⋈': 3, '*': 3, '÷': 3, '⟕': 3, '⟖': 3, '⟗': 3 };

function lex(src) {
  const T = []; let i = 0, depth = 0;
  const push = (type, v, pos) => T.push({ type, v, pos });
  while (i < src.length) {
    const c = src[i], two = src.slice(i, i + 2);
    if (c === '\n') { if (depth === 0) push('nl', '\n', i); i++; continue; }
    if (/\s/.test(c)) { i++; continue; }
    if (two === '--' || two === '//') { while (i < src.length && src[i] !== '\n') i++; continue; }
    if ("'‘’\"“”".includes(c)) {
      const close = "\"“”".includes(c) ? "\"“”" : "'‘’";
      let j = i + 1; while (j < src.length && !close.includes(src[j]) && src[j] !== '\n') j++;
      if (j >= src.length || src[j] === '\n') throw new RAError('따옴표가 닫히지 않았어요.', i);
      push('str', src.slice(i + 1, j), i); i = j + 1; continue;
    }
    if (/[0-9]/.test(c)) { let j = i; while (j < src.length && /[0-9.]/.test(src[j])) j++; push('num', parseFloat(src.slice(i, j)), i); i = j; continue; }
    if (two === '<-' || two === ':=') { push('assign', '←', i); i += 2; continue; }
    if (two === '->') { push('arrow', '→', i); i += 2; continue; }
    if (two === '<=' || two === '>=' || two === '<>' || two === '!=') { push('cmp', two === '!=' ? '<>' : two, i); i += 2; continue; }
    if (c === '←') { push('assign', '←', i); i++; continue; }
    if (c === '→') { push('arrow', '→', i); i++; continue; }
    if ('=<>≠≤≥'.includes(c)) { push('cmp', { '=': '=', '<': '<', '>': '>', '≠': '<>', '≤': '<=', '≥': '>=' }[c], i); i++; continue; }
    if (c === '∧') { push('kw', 'AND', i); i++; continue; }
    if (c === '∨') { push('kw', 'OR', i); i++; continue; }
    if (c === '¬') { push('kw', 'NOT', i); i++; continue; }
    if ('([{'.includes(c)) { depth++; push('punc', c === '{' ? '[' : c, i); i++; continue; }
    if (')]}'.includes(c)) { depth = Math.max(0, depth - 1); push('punc', c === '}' ? ']' : c, i); i++; continue; }
    if (',;.'.includes(c)) { push('punc', c, i); i++; continue; }
    if (OPCH[c]) { push('op', OPCH[c], i); i++; continue; }
    if (isId(c)) {
      let j = i; while (j < src.length && isId(src[j])) j++;
      const w = src.slice(i, j), U = UP(w);
      if (WORDOP[U]) push('op', WORDOP[U], i);
      else if (KW.includes(U)) push('kw', U, i);
      else push('id', w, i);
      i = j; continue;
    }
    throw new RAError(`알 수 없는 기호 '${c}'가 있어요.`, i);
  }
  push('eof', null, src.length);
  return T;
}
const tokStr = t => t.type === 'eof' ? '식의 끝' : t.type === 'nl' ? '줄바꿈' : String(t.v);

function parseRA(src) {
  const T = lex(src); let p = 0;
  const is = (type, v) => T[p].type === type && (v === undefined || T[p].v === v);
  const next = () => T[p++];
  const err = msg => new RAError(msg, T[p].pos);
  const expect = (type, v, msg) => { if (!is(type, v)) throw err(msg || `여기에 '${v}'가 와야 하는데 '${tokStr(T[p])}'가 있어요.`); return next(); };
  const skipNl = () => { while (T[p].type === 'nl') p++; };
  const AGG = /^(COUNT|SUM|AVG|MAX|MIN)$/i;

  function ref() {
    const a = expect('id', undefined, `속성 이름이 와야 하는데 '${tokStr(T[p])}'가 있어요.`).v;
    if (is('punc', '.')) { next(); const b = expect('id', undefined, '점(.) 뒤에 속성 이름이 와야 해요.').v; return { t: 'ref', q: a, n: b }; }
    return { t: 'ref', q: null, n: a };
  }
  function refList() { const l = [ref()]; while (is('punc', ',')) { next(); l.push(ref()); } return l; }
  function operand() {
    if (is('num')) return { t: 'lit', v: next().v };
    if (is('str')) return { t: 'lit', v: next().v };
    if (is('kw', 'NULL')) { next(); return { t: 'lit', v: null }; }
    if (is('op', '−') && T[p + 1].type === 'num') { next(); return { t: 'lit', v: -next().v }; }
    if (is('id')) return ref();
    throw err(`조건에 '${tokStr(T[p])}'가 올 수 없어요. 속성 이름, 숫자, '문자열'이 와야 해요.`);
  }
  function cmp() {
    if (is('punc', '(')) { next(); const c = orC(); expect('punc', ')'); return c; }
    const a = operand();
    if (is('kw', 'IS')) { next(); let neg = false; if (is('kw', 'NOT')) { next(); neg = true; } expect('kw', 'NULL', 'IS 뒤에는 NULL 또는 NOT NULL이 와야 해요.'); return { t: 'isnull', a, neg }; }
    const op = expect('cmp', undefined, `'${tokStr(T[p])}' 자리에 비교 연산자(=, <>, <, >, <=, >=)가 와야 해요.`).v;
    return { t: 'cmp', op, a, b: operand() };
  }
  function notC() { if (is('kw', 'NOT')) { next(); return { t: 'not', e: notC() }; } return cmp(); }
  function andC() { let l = notC(); while (is('kw', 'AND')) { next(); l = { t: 'and', l, r: notC() }; } return l; }
  function orC() { let l = andC(); while (is('kw', 'OR')) { next(); l = { t: 'or', l, r: andC() }; } return l; }

  function unary() {
    const t = T[p];
    if (t.type === 'op' && t.v === 'σ') {
      next(); expect('punc', '[', 'σ 다음에는 [조건]이 와야 해요. 예: σ[AGE > 20](STUDENT)');
      const c = orC(); expect('punc', ']', `조건 뒤에 ]가 와야 하는데 '${tokStr(T[p])}'가 있어요.`);
      return { t: 'sel', cond: c, e: unary() };
    }
    if (t.type === 'op' && t.v === 'π') {
      next(); let attrs;
      if (is('punc', '[')) { next(); attrs = refList(); expect('punc', ']', `속성 목록 뒤에 ]가 와야 해요.`); }
      else attrs = refList();

  for (const x of X.ents) {

    if (u.weak !== x.weak) bad(`${x.name}은(는) ${x.weak ? '약한 엔티티(이중 사각형)' : '보통 엔티티(사각형)'}여야 해요.`);

  for (const u of U.ents) if (!X.ents.some(x => x.nn === u.nn)) bad(`필요 없는 엔티티 ${u.name}이(가) 있어요.`);

    for (const xe of x.ends) {
      let i = ue.findIndex(q => q.nn === xe.nn && cardNorm(q.card) === cardNorm(xe.card)); if (i < 0) i = ue.findIndex(q => q.nn === xe.nn);
      const ub = ue.splice(i, 1)[0];
      if (cardNorm(ub.card) !== cardNorm(xe.card)) { good = false; bad(`${nm}: ${xe.ent} 쪽 선의 카디날리티는 ${xe.card === '1' ? '1' : 'N(또는 M)'}이어야 해요 (지금: ${ub.card || '비어 있음'}).`); }
      if (xe.tp && xe.total !== ub.total) { good = false; bad(`${nm}: ${xe.ent}은(는) ${xe.total ? '전체 참여(이중선)' : '부분 참여(실선 하나)'}여야 해요.`); }
    }
    if (good) ok(`관계 ${u.name}: ${x.ends.map(e => `${e.ent} ${e.card}${e.tp && e.total ? '(전체 참여)' : ''}`).join(' : ')}`);

  }
  for (const u of U.rels) if (!used.has(u)) bad(`필요 없는 관계 ${u.name}(${u.ends.map(e => e.ent).join('–') || '연결 없음'})이(가) 있어요.`);

/* ── ER → 릴레이션 사상 (강의 7단계) ── */
function mapERD(C) {
  const T = [], notes = [], byEnt = {};
  const leaves = a => a.kids.length ? a.kids.flatMap(leaves) : [a.name];
  const tbl = (name, rule) => { const t = { name, cols: [], pk: [], fks: [], rule }; T.push(t); return t; };
  const has = (t, n) => t.cols.some(c => UP(c) === UP(n));
  const addCol = (t, n) => { if (!has(t, n)) t.cols.push(n); return n; };
  const fkCols = (t, refT, role, relName) => refT.pk.map(k => {
    let n = role ? (refT.pk.length > 1 ? `${role}_${k}` : role) : k;
    if (has(t, n)) n = `${relName}_${k}`;
    return addCol(t, n);
  });
  const plainAttrs = (owner, t, attrs, pkKinds) => {
    for (const a of attrs) {
      if (a.k === 'der') { notes.push(`${owner}.${a.name}: 유도 애트리뷰트는 다른 값으로 계산되니 저장하지 않았어요.`); continue; }
      if (a.k === 'multi') continue;
      for (const l of leaves(a)) { addCol(t, l); if (pkKinds.includes(a.k)) t.pk.push(l); }
    }
  };
  // 단계 1
  for (const e of C.ents.filter(e => !e.weak)) {
    const t = tbl(e.name, '단계 1: 정규 엔티티 → 릴레이션'); byEnt[e.nn] = t;
    plainAttrs(e.name, t, e.attrs, ['key']);
    if (!t.pk.length) notes.push(`${e.name}에 키 애트리뷰트가 없어서 기본 키를 정하지 못했어요.`);
  }
  // 단계 2
  let pending = C.ents.filter(e => e.weak);
  for (let round = 0; pending.length && round < 8; round++) {
    pending = pending.filter(e => {
      const r = C.rels.find(r => r.ident && r.ends.some(x => x.nn === e.nn));
      if (!r) { notes.push(`약한 엔티티 ${e.name}에 식별 관계(이중 마름모)가 연결되지 않았어요.`); return false; }
      const oe = r.ends.find(x => x.nn !== e.nn), owner = oe && byEnt[oe.nn];
      if (!owner) return true;
      const t = tbl(e.name, `단계 2: 약한 엔티티 → 소유 엔티티 ${owner.name}의 기본 키를 외래 키로, 기본 키 = 외래 키 + 부분 키`); byEnt[e.nn] = t;
      const fk = fkCols(t, owner, '', r.name); t.pk.push(...fk);
      t.fks.push({ cols: fk, ref: owner.name, refCols: owner.pk.slice() });
      plainAttrs(e.name, t, e.attrs, ['pk', 'key']);
      for (const a of r.attrs) for (const l of leaves(a)) addCol(t, l);
      r._done = true; return false;
    });
  }
  pending.forEach(e => notes.push(`약한 엔티티 ${e.name}의 소유 엔티티를 찾지 못했어요.`));
  // 단계 3~6
  const many = c => cardNorm(c) === 'N';
  for (const r of C.rels) {
    if (r._done) continue;
    const ends = r.ends;
    if (ends.length < 2) { notes.push(`관계 ${r.name}에 연결된 엔티티가 2개보다 적어요.`); continue; }
    if (ends.some(e => !byEnt[e.nn])) { notes.push(`관계 ${r.name}에 연결된 엔티티의 릴레이션을 만들지 못했어요.`); continue; }
    if (ends.length === 2 && ends.every(e => e.card) && !(many(ends[0].card) && many(ends[1].card))) {
      const [A, B] = ends; let S, Tn, rule;
      if (A.card === '1' && B.card === '1') {
        S = B.total && !A.total ? B : A.total && !B.total ? A : B; Tn = S === A ? B : A;
        rule = `단계 3: 1:1 관계 ${r.name} → ${S.total ? '전체 참여하는 ' : ''}${S.ent}에 ${Tn.ent}의 기본 키를 외래 키로`;
        if (S.total === Tn.total) notes.push(`1:1 관계 ${r.name}: 두 쪽 참여가 같아서 어느 쪽에 외래 키를 둬도 돼요. 여기선 ${S.ent}에 뒀어요.`);
      } else { S = many(A.card) ? A : B; Tn = S === A ? B : A; rule = `단계 4: 1:N 관계 ${r.name} → N측 ${S.ent}에 1측 ${Tn.ent}의 기본 키를 외래 키로`; }
      const st = byEnt[S.nn], tt = byEnt[Tn.nn];
      const role = Tn.role || (S.nn === Tn.nn ? r.name : '');
      const fk = fkCols(st, tt, role, r.name);
      st.fks.push({ cols: fk, ref: tt.name, refCols: tt.pk.slice(), why: rule });
      for (const a of r.attrs) for (const l of leaves(a)) addCol(st, l);
      st.extra = (st.extra || []).concat(rule);
    } else {
      if (ends.length === 2 && ends.some(e => !e.card)) notes.push(`관계 ${r.name}의 카디날리티가 비어 있어서 M:N으로 보고 변환했어요.`);
      const t = tbl(r.name, ends.length > 2 ? `단계 6: ${ends.length}진 관계 → 새 릴레이션, 외래 키들의 조합이 기본 키` : `단계 5: M:N 관계 → 새 릴레이션, 두 기본 키의 조합이 기본 키`);
      for (const e of ends) {
        const rt = byEnt[e.nn], same = ends.filter(x => x.nn === e.nn).length > 1;
        const cols = rt.pk.map(k => {
          let n = e.role ? (rt.pk.length > 1 ? `${e.role}_${k}` : e.role) : k;
          if (has(t, n)) n = same ? `${e.role || rt.name + '2'}_${k}` : `${rt.name}_${k}`;
          return addCol(t, n);
        });
        t.pk.push(...cols); t.fks.push({ cols, ref: rt.name, refCols: rt.pk.slice() });
      }
      for (const a of r.attrs) for (const l of leaves(a)) addCol(t, l);
    }
  }
  // 단계 7
  for (const e of C.ents) {
    const t = byEnt[e.nn]; if (!t) continue;
    for (const a of e.attrs.filter(a => a.k === 'multi')) {
      const mt = tbl(a.table || `${e.name}_${a.name}`, `단계 7: 다치 애트리뷰트 ${e.name}.${a.name} → 새 릴레이션, (외래 키 + 다치 애트리뷰트)가 기본 키`);
      const cols = t.pk.map(k => addCol(mt, k));
      mt.fks.push({ cols, ref: t.name, refCols: t.pk.slice() });
      const ls = leaves(a).map(l => addCol(mt, l));
      mt.pk = [...cols, ...ls];
    }
  }
  return { tables: T, notes };
}
function guessType(n) {
  const u = UP(n);
  if (/(DATE|일자|날짜|생년월일|기간)/.test(u)) return 'DATE';
  if (/(수량|량$|가격|단가|급여|봉급|SALARY|PRICE|BUDGET|QTY|QUANTITY|나이|AGE|점수|성적|SCORE|적립금|재고|학년|시간|HOURS|금액)/.test(u)) return 'INT';
  return 'VARCHAR(30)';

function topoTables(tables) {
  const by = Object.fromEntries(tables.map(t => [UP(t.name), t])), out = [], done = new Set();
  const visit = (t, stack) => { if (done.has(t) || stack.has(t)) return; stack.add(t); t.fks.forEach(f => { const r = by[UP(f.ref)]; if (r && r !== t) visit(r, stack); }); done.add(t); out.push(t); };
  tables.forEach(t => visit(t, new Set()));

}
function erdSQL(tables) {
  return topoTables(tables).map(t => {
    const lines = t.cols.map(c => `  ${c} ${guessType(c)}`);
    if (t.pk.length) lines.push(`  PRIMARY KEY (${t.pk.join(', ')})`);
    t.fks.forEach(f => lines.push(`  FOREIGN KEY (${f.cols.join(', ')}) REFERENCES ${f.ref}(${f.refCols.join(', ')})`));
    const why = [t.rule, ...(t.extra || [])].map(x => `-- ${x}`).join('\n');
    return `${why}\nCREATE TABLE ${t.name} (\n${lines.join(',\n')}\n);`;
  }).join('\n\n');
}

  return `<ul class="schema">${topoTables(tables).map(t => {
    const fkc = new Map(); t.fks.forEach(f => f.cols.forEach(c => fkc.set(UP(c), f.ref)));
    const pk = new Set(t.pk.map(UP));
    return `<li><b>${esc(t.name)}</b>(${t.cols.map(c => { const s = esc(c); const k = pk.has(UP(c)) ? `<u>${s}</u>` : s; return fkc.has(UP(c)) ? `<span class="fk" title="외래 키 → ${esc(fkc.get(UP(c)))}">${k}<sup>FK→${esc(fkc.get(UP(c)))}</sup></span>` : k; }).join(', ')})</li>`;
  }).join('')}</ul><p class="kbd">밑줄 = 기본 키, FK→ = 외래 키가 참조하는 릴레이션</p>`;
}

/* ── 사용자가 쓴 CREATE TABLE의 구조 읽기 → 비교 ── */
function introspectSQL(sql) {
  const db = new SQLM.Database();
  try {
    db.exec(prepSQL(sql));
    const q = s => { const r = db.exec(s)[0]; return r ? r.values : []; };
    return q("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'").map(([n]) => {
      const qn = '"' + n.replace(/"/g, '""') + '"';
      const info = q(`PRAGMA table_info(${qn})`);
      const fks = {};
      q(`PRAGMA foreign_key_list(${qn})`).forEach(([id, , table, from, to]) => { (fks[id] ||= { cols: [], ref: table, refCols: [] }); fks[id].cols.push(from); fks[id].refCols.push(to); });
      return { name: n, cols: info.map(v => v[1]), pk: info.filter(v => v[5] > 0).sort((a, b) => a[5] - b[5]).map(v => v[1]), fks: Object.values(fks) };
    });
  } catch (e) { throw new Error(sqlErrKo(e.message)); }

}
function gradeSchema(user, exp) {
  const out = [], ok = m => out.push({ ok: true, m }), bad = m => out.push({ ok: false, m });
  const setEq = (a, b) => a.length === b.length && a.every(x => b.some(y => UP(y) === UP(x)));
  for (const x of exp) {
    const u = user.find(t => UP(t.name) === UP(x.name));
    if (!u) { bad(`테이블 ${x.name}이(가) 없어요.`); continue; }
    const miss = x.cols.filter(c => !u.cols.some(d => UP(d) === UP(c))), extra = u.cols.filter(c => !x.cols.some(d => UP(d) === UP(c)));
    if (miss.length) bad(`${x.name}: 빠진 애트리뷰트 ${miss.join(', ')}`);
    if (extra.length) bad(`${x.name}: 여기 있으면 안 되는 애트리뷰트 ${extra.join(', ')}`);
    if (!miss.length && !extra.length) ok(`${x.name}의 애트리뷰트 ${x.cols.length}개`);
    if (setEq(u.pk, x.pk)) ok(`${x.name}의 기본 키 (${x.pk.join(', ')})`);
    else bad(`${x.name}의 기본 키는 (${x.pk.join(', ')})여야 해요 (지금: ${u.pk.length ? '(' + u.pk.join(', ') + ')' : '없음'}).`);
    const left = [...u.fks];
    for (const f of x.fks) {
      const i = left.findIndex(g => setEq(g.cols, f.cols) && UP(g.ref) === UP(f.ref));
      if (i >= 0) { left.splice(i, 1); ok(`${x.name}의 외래 키 (${f.cols.join(', ')}) → ${f.ref}`); }
      else bad(`${x.name}에 외래 키 (${f.cols.join(', ')}) → ${f.ref}(${f.refCols.join(', ')})가 없어요.`);
    }
    left.forEach(g => bad(`${x.name}에 필요 없는 외래 키 (${g.cols.join(', ')}) → ${g.ref}가 있어요.`));
  }
  user.filter(t => !exp.some(x => UP(x.name) === UP(t.name))).forEach(t => bad(`필요 없는 테이블 ${t.name}이(가) 있어요.`));

}

  lead: '<b>관계</b>는 엔티티들 사이의 연관이에요. 마름모로 그리고, 선 위에 몇 대 몇으로 연결되는지(<b>카디날리티</b>)를 적어요.',
  body: `
<ul><li><b>차수</b>: 관계에 참여하는 엔티티 타입 수. 2진(가장 흔함), 3진, 1진(순환).</li>
<li><b>관계 애트리뷰트</b>: 관계에도 애트리뷰트가 붙을 수 있어요(수강의 성적). 하지만 관계는 <b>키를 갖지 않아요</b>.</li></ul>
<h3>카디날리티 비율</h3>
<table class="doc"><tr><th>비율</th><th>예</th><th>뜻</th></tr>
<tr><td>1:1</td><td>사원 — PC</td><td>한 사원은 PC 하나, 한 PC는 사원 하나</td></tr>
<tr><td>1:N</td><td>부서 — 사원</td><td>한 부서에 사원 여럿, 사원은 부서 하나 (가장 흔함)</td></tr>
<tr><td>M:N</td><td>학생 — 과목</td><td>학생은 과목 여럿, 과목도 학생 여럿</td></tr></table>
@@0@@
<p class="key">읽는 법: 숫자는 <b>그 엔티티 쪽 선</b>에 적어요. 부서 <b>1</b> — 소속 — <b>N</b> 사원. 외래 키는 나중에 <b>N이 붙은 엔티티</b>(사원)에 들어가요.</p>
@@1@@
<h3>(min, max) 표기</h3>
<p>선 위에 (min, max)를 적으면 <b>그 엔티티 자신이</b> 관계에 최소 min번, 최대 max번 참여한다는 뜻이에요. min = 0이면 참여하지 않아도 되고, max = *는 여러 번.</p>
<table class="doc"><tr><th>비율</th><th>(min, max) 일반형</th></tr><tr><td>1:1</td><td>(0,1) — (0,1)</td></tr><tr><td>1:N</td><td>(0,*) — (0,1)</td></tr><tr><td>M:N</td><td>(0,*) — (0,*)</td></tr></table>
<div class="pit"><p><span class="x">❌</span> 고객 1 — N 주문을 (min, max)로 고객 (1,1), 주문 (0,n)이라고 쓰기</p><p><span class="o">✅</span> 고객 <b>(0,n)</b> — 주문 <b>(1,1)</b>. 비율 표기와 숫자 위치가 반대로 보이니 주의 (퀴즈 5.3)</p></div>
<h3>전체 참여와 부분 참여</h3>
<p><b>전체 참여</b>: 모든 엔티티가 관계에 참여 → <b>이중 실선</b>. <b>부분 참여</b>: 일부만 → 실선 하나. "모든 부서에는 반드시 관리자가 있다" → 부서 쪽이 이중선. 편집기에서는 선을 누르고 "전체 참여"를 체크해요.</p>
<h3>역할</h3>
<p>한 관계에 같은 엔티티 타입이 두 번 이상 참여하면 선마다 <b>역할 이름</b>을 적어 구분해요(퀴즈 5.4의 PreReq).</p>`,

{ id:'keys2', type:'multi', topic:'키·제약조건', src:['22-2'],
  q:'관계 데이터 모델의 키와 제약 조건에 대한 설명으로 <b>옳은 것을 모두</b> 고르시오.',
  opts:['주어진 릴레이션 R의 속성들의 부분집합 X에 대해, 어떤 튜플도 동일한 값을 가지지 않는다면, 이러한 속성의 집합 X를 그 릴레이션의 슈퍼키라고 한다.','R(A, B, C) 릴레이션에서 기본키가 복합키 (A, B)이고 B가 외래키라면, 참조 무결성에 의해 B는 널값을 가질 수 있다.','대체키와 외래키는 유일성과 최소성을 모두 만족해야 한다.','참조 무결성 제약은 참조할 수 없는 외래키 값을 가져서는 안 된다는 것을 의미한다.'],
  ans:[0,3], exp:'② 기본키의 구성 속성은 NULL 불가(<b>개체 무결성</b>). ③ 유일성·최소성은 후보 키(대체 키 포함)의 조건이고 외래 키는 해당 없음.' },
{ id:'relrdb', type:'multi', topic:'관계형 DB', src:['21-2'],
  q:'관계형 데이터베이스에 대한 설명으로 <b class="warn">옳지 않은 것을 모두</b> 고르시오.',
  opts:['기본키 속성이 복합 속성인 경우 그 속성의 일부 요소 속성에서 널(NULL) 값을 가질 수 있다.','슈퍼키는 후보키가 되기 위한 필요충분조건이다.','테이블에 튜플 삽입 시 엔터티 무결성 혹은 키 제약조건, 도메인 제약조건, 참조 무결성 제약조건이 위배될 수 있다.','릴레이션 R이 릴레이션 S를 참조하는 경우 R의 외래키가 S의 기본키가 아닌 후보키 중 하나를 참조해야 한다.'],
  ans:[0,1,3], exp:'① 기본키는 일부라도 NULL 불가. ② 슈퍼키는 후보키의 <b>필요조건</b>일 뿐(후보키 = 슈퍼키 + 최소성). ④ 강의(4장 19쪽)는 참조되는 컬럼이 <b>기본 키</b>로 정의되어 있어야 한다고 설명해요. "기본키가 아닌 후보키를 참조해야 한다"는 틀림.' },
{ id:'keyterms', type:'text', topic:'키 종류', src:['24봄'],

  ans:'(a) 슈퍼 키, 후보 키, 기본 키, 대체 키, 외래 키(, 복합 키·대리 키)<br>(b) <b>외래 키</b> (다른 릴레이션을 참조하는 키라 슈퍼키 ⊃ 후보키 ⊃ 기본키/대체키 포함관계에 속하지 않음)<br>(c) <b>슈퍼 키</b> (속성을 더 제거해도 식별 가능한 키가 존재하는 슈퍼키. 후보 키부터 최소성 만족)<br><span class="note">※ 문제 문장의 "애트리뷰트를 제거해도 키가 됨"이 최소성 <i>불만족</i>의 정의입니다.</span>' },
{ id:'keystu', type:'text', topic:'슈퍼/후보/기본키', src:['24-1'],
  q:'학생(학번, 주민등록번호, 이름, 학과, 메일주소)<br>1) 슈퍼키, 후보키, 기본키에 대해 설명하시오.<br>2) 위 테이블에서 각 키를 선택(슈퍼키, 후보키 3개 이상)하고 이유를 쓰시오. (23-2에는 EMP(EMPNO, JUMINNO, EMPNAME, MANAGER, ADDRESS, TITLE)로 출제)',
  ans:'1) <b>슈퍼키</b>: 튜플을 유일하게 식별하는 속성(들)의 집합(유일성). <b>후보키</b>: 슈퍼키 중 최소성을 만족하는 키. <b>기본키</b>: 후보키 중 설계자가 대표로 선택한 키(NULL 불가).<br>2) <b>후보키</b>: {학번}, {주민등록번호}, {메일주소} — 각각 단독으로 유일하고 속성을 더 뺄 수 없음(메일주소가 유일하다는 가정).<br><b>기본키</b>: 학번 (길이가 짧고 변하지 않으며 대표성이 큼).<br><b>슈퍼키</b> 예: {학번, 이름}, {주민등록번호, 학과}, {학번, 주민등록번호, 이름, 학과, 메일주소}(전체 속성). 이름·학과는 중복 가능해서 단독 키 불가.<br>23-2 EMP: 후보키 {EMPNO}, {JUMINNO}, 기본키 EMPNO, 슈퍼키 예 {EMPNO, EMPNAME}, {JUMINNO, TITLE}.' },
{ id:'integrity', type:'single', topic:'무결성 제약조건', src:['21-2'],
  q:'관계형 데이터 모델에서 무결성 제약조건에 대한 설명으로 <b class="warn">옳지 않은</b> 것은?',
  opts:['Unique 칼럼은 NULL 또는 유일한 값을 가질 수 있다.','Foreign Key 칼럼은 참조되는 속성 값이 반드시 존재해야 하고 NULL값을 가질 수 없다.','NOT NULL 제약 조건은 자료를 입력할 때 속성 값을 반드시 요구한다.','Primary Key 칼럼은 NULL 값을 가질 수 없다.'],

{ id:'entity', type:'text', topic:'개체 무결성', src:['21-2','25-2'],

{ id:'refviol1', type:'multi', topic:'참조 무결성 위반', src:['23-2'],
  q:'다음 시나리오 중 <b>참조 무결성 위반</b>이 발생하는 것을 모두 고르시오. 밑줄은 기본 키이고, EMPLOYEE의 외래 키 DNO가 DEPARTMENT의 DEPTNO를 참조해요. (외래 키 옵션은 지정하지 않음 = 제한)' +
    '<div class="tables">' + TBL(['EMPNO','EMPNAME','DNO'],[['2106','김창섭','2'],['3426','박영권','3'],['3011','이수민','1'],['1003','조민희','1'],['3427','최종철','3']],'EMPLOYEE',['EMPNO']) +
    TBL(['DEPTNO','DEPTNAME','FLOOR'],[['1','영업','8'],['2','기획','10'],['3','개발','9'],['4','홍보','8']],'DEPARTMENT',['DEPTNO']) + '</div>',
  opts:['(1) EMPLOYEE에 (2013, 홍길동, 6) 튜플 추가','(2) EMPLOYEE에서 (2106, 김창섭, 2) 튜플 삭제','(3) DEPARTMENT에 (5, 인사, 7) 튜플 추가','(4) DEPARTMENT에서 (1, 영업, 8) 튜플 삭제'],
  ans:[0,3], exp:'(1) DNO 6이 DEPARTMENT에 없음 → 위반. (4) DEPTNO 1을 3011·1003이 참조 중 → 위반. (2) 참조하는 쪽 삭제와 (3) 참조되는 쪽 추가는 문제없음.<br><b>유지 방법</b>: 위반 시 연산 <i>거부(제한/NO ACTION)</i>, 또는 삭제 시 <i>CASCADE / SET NULL / SET DEFAULT</i> 옵션. 삽입 위반은 거부하거나 먼저 참조 대상을 삽입.' },
{ id:'refviol2', type:'multi', topic:'참조 무결성 위반', src:['24-1'],
  q:'아래 학생·수강·과목 릴레이션에서 각 연산을 할 때 <b>무결성 제약조건(개체·참조) 위반이 발생하는 것</b>을 모두 고르시오. 밑줄은 기본 키예요. 수강의 기본 키는 (학번, 과목번호)이고, 수강.학번은 학생.학번을, 수강.과목번호는 과목.과목번호를 참조하는 외래 키예요. (외래 키 옵션은 지정하지 않음 = 제한, ^는 Null)<div class="tables">' +

    TBL(['학번','과목번호','학점'],[['11002','CS310','A0'],['11002','CS313','B+'],['24036','CS345','B0'],['30419','CS310','A+']],'수강',['학번','과목번호']) +
    TBL(['과목번호','과목이름'],[['CS310','데이터베이스'],['CS313','운영체제'],['CS345','자료 구조'],['CS326','자바']],'과목',['과목번호']) + '</div>',
  opts:['1) 학생에서 (24036, 김순미) 삭제','2) 학생에 (52316, 이영준) 추가','3) 수강에서 (11002, CS310, A0) 삭제','4) 수강에 (^, ^, A0) 추가'],
  ans:[0,3], exp:'1) 24036을 수강이 참조 중 → 참조 무결성 위반(해결: 제한·CASCADE·SET NULL 등). 4) 수강의 기본키(학번, 과목번호)가 NULL → <b>개체 무결성</b> 위반(참조 무결성이라기보다 기본키 NULL 문제). 2) 3)은 문제없음.' },

{ id:'ondelt', type:'text', topic:'ON DELETE 옵션', src:['21-2','24봄','25-2'],

{ id:'essop', type:'text', topic:'필수 연산자', src:['21-2','22-2','24봄'],

{ id:'opdeg', type:'text', topic:'연산자 차수/카디널리티', src:['24-1','23-2'],
  q:'DataBase에서 사용되는 관계대수의 필수적인 연산자 기능을 설명하고, 결과 릴레이션의 카디널리티와 차수를 설명하시오.<br>(23-2: 프로젝션 결과의 차수·카디널리티는 입력과 비교해 어떻게 변하는가? — 릴레이션의 특성 기반으로 설명)',

    '<tr><td>σ 실렉션</td><td>조건을 만족하는 튜플(행) 선택</td><td>입력과 같음</td><td>≤ 입력</td></tr>' +

    '<tr><td>∪ 합집합</td><td>두 릴레이션의 튜플 합침(중복 제거)</td><td>입력과 같음(합병가능)</td><td>≤ |R|+|S|</td></tr>' +

  q: `<p>관계 모델의 공식 용어에서 릴레이션은 테이블, 투플은 [[0]](행), 애트리뷰트는 [[1]](열)에 해당한다.</p>`,
  blanks: [['레코드', '행', '로우', 'row'], ['컬럼', '열', '칼럼', '속성', 'column']],
  exp: `<p>파일 시스템 용어로는 파일 · 레코드 · 필드예요.</p>` },
{ id: 'kc-m2', st: 'k2', kind: 'choice', title: '도메인',
  q: `<p>도메인에 대한 설명으로 <b>옳은</b> 것은?</p>`,
  opts: ['한 애트리뷰트에 나타날 수 있는 값들의 집합이다.', '한 도메인은 한 애트리뷰트에서만 사용할 수 있다.', '도메인 값으로 {8, 9} 같은 집합을 넣을 수 있다.', '릴레이션의 투플 수를 말한다.'], ans: 0,
  exp: `<p>도메인은 원자값들의 집합이고 데이터 타입과 비슷해요. 여러 애트리뷰트가 같은 도메인을 쓸 수 있어요.</p>` },
{ id: 'kc-m3', st: 'k2', kind: 'multi', title: '널의 의미',
  q: `<p>널(NULL)에 대한 설명으로 <b>옳은 것을 모두</b> 고르시오.</p>`,
  opts: ['값이 알려지지 않았음을 뜻할 수 있다.', '해당 사항이 없음을 뜻할 수 있다.', '숫자 0과 같다.', '공백 문자와 같다.'], ans: [0, 1],
  exp: `<p>널은 unknown 또는 not applicable이에요. 0이나 공백과는 달라요.</p>` },
{ id: 'kc-m4', st: 'k2', kind: 'fill', title: '차수와 카디날리티의 최솟값',
  q: `<p>릴레이션의 차수는 최소 [[0]]이고, 카디날리티는 최소 [[1]]일 수 있다. 둘 중 계속 변하는 것은 [[2]]이다.</p>`,
  blanks: [['1'], ['0'], ['카디날리티', '카디널리티']],
  exp: `<p>애트리뷰트가 하나도 없는 릴레이션은 없지만, 투플이 하나도 없는 릴레이션은 있어요. 투플은 삽입·삭제로 계속 바뀌어요.</p>` },
{ id: 'kc-m5', st: 'k2', kind: 'multi', title: '키의 종류',
  q: `<p>키에 대한 설명으로 <b>옳은 것을 모두</b> 고르시오.</p>`,
  opts: ['후보 키는 투플을 유일하게 식별하는 애트리뷰트들의 최소 집합이다.', '복합 키는 애트리뷰트가 둘 이상인 후보 키다.', '대리 키는 자연 키가 없을 때 인공적으로 추가한 키다.', '외래 키는 자신의 릴레이션에서 투플을 유일하게 식별한다.'], ans: [0, 1, 2],
  exp: `<p>외래 키는 식별 기능이 없고 릴레이션 간의 관계를 나타내요. 포함 관계: 슈퍼 키 ⊃ 후보 키 ⊃ 기본 키 / 대체 키.</p>` },
{ id: 'kc-m6', st: 'k2', kind: 'choice', title: '후보 키가 될 수 없는 것 (퀴즈 2.2)',
  q: `<p>학생(학번, 이름, 이메일, 학과)에서 후보 키가 될 수 <b class="warn">없는</b> 것은? (이메일은 학생마다 다르다)</p>`,
  opts: ['학번', '이메일', '이름', '없다'], ans: 2,
  exp: `<p>동명이인이 있을 수 있어서 이름은 유일하지 않아요.</p>` },
{ id: 'kc-m7', st: 'k2', kind: 'choice', title: '자체 릴레이션을 참조하는 외래 키',
  q: `<p>EMPLOYEE(EMPNO, EMPNAME, MANAGER, DNO)에서 자기 자신의 릴레이션을 참조하는 외래 키는?</p>`,
  opts: ['EMPNO', 'EMPNAME', 'MANAGER', 'DNO'], ans: 2,
  exp: `<p>MANAGER는 상사의 사원번호라서 EMPLOYEE.EMPNO를 참조해요. DNO는 DEPARTMENT를 참조하는 외래 키예요.</p>` },
{ id: 'kc-m8', st: 'k2', kind: 'choice', title: '엔티티 무결성과 대체 키',
  q: `<p>참/거짓: 엔티티 무결성 제약조건에 따라 대체 키도 널 값을 가질 수 없다.</p>`,
  opts: ['참', '거짓'], ans: 1,
  exp: `<p>엔티티 무결성은 <b>기본 키</b>에만 적용돼요. 대체 키에는 적용되지 않아요.</p>` },
{ id: 'kc-m9', st: 'k2', kind: 'choice', title: '참조 무결성을 깨지 않는 연산',
  q: `<p>EMPLOYEE.DNO가 DEPARTMENT.DEPTNO를 참조할 때, 참조 무결성을 <b class="warn">위배할 수 없는</b> 연산은?</p>`,
  opts: ['EMPLOYEE에 존재하지 않는 부서번호로 투플 삽입', 'EMPLOYEE가 참조 중인 DEPARTMENT 투플 삭제', 'DEPARTMENT에 새 부서 투플 삽입', 'EMPLOYEE의 DNO를 없는 부서번호로 수정'], ans: 2,
  exp: `<p>참조되는 쪽(DEPARTMENT)에 삽입하는 것과 참조하는 쪽(EMPLOYEE)에서 삭제하는 것은 참조 무결성을 깨지 않아요.</p>` },
{ id: 'kc-m10', st: 'k2', kind: 'choice', title: '연쇄 옵션의 결과',
  q: `<p>DEPARTMENT에서 (3, 개발, 9)를 삭제하려 한다. 이수민과 최종철의 DNO가 3이고, 외래 키에 <b>연쇄(CASCADE)</b> 옵션이 지정되어 있다면?</p>`,
  opts: ['삭제가 거절된다.', '이수민과 최종철의 투플도 함께 삭제된다.', '이수민과 최종철의 DNO가 널이 된다.', '이수민과 최종철의 DNO가 디폴트 값이 된다.'], ans: 1,
  exp: `<p>제한 = 거절, 연쇄 = 함께 삭제, 널 삽입 = DNO를 널로, 디폴트 = DNO를 디폴트 값으로.</p>` },

/* ── 3장 ── */
{ id: 'kc-t1', st: 'k3', kind: 'choice', title: '관계 해석과 관계 대수',
  q: `<p>관계 대수에 대한 설명으로 <b>옳은</b> 것은?</p>`,
  opts: ['원하는 데이터만 명시하는 선언적 언어다.', '연산자들이 수행되는 순서를 명시하는 절차적 언어다.', 'SQL과 관계가 없다.', '결과가 릴레이션이 아닐 수도 있다.'], ans: 1,
  exp: `<p>관계 해석이 선언적, 관계 대수가 절차적이에요. 관계 대수는 SQL의 이론적 기초이고, 결과는 항상 릴레이션이라 다른 연산의 입력이 될 수 있어요.</p>` },
{ id: 'kc-t2', st: 'k3', kind: 'multi', title: '유도된 연산자 고르기',
  q: `<p>편의를 위해 <b>유도된</b> 연산자를 모두 고르시오.</p>`,
  opts: ['교집합 ∩', '합집합 ∪', '자연 조인 *', '차집합 −', '디비전 ÷', '세미 조인'], ans: [0, 2, 4, 5],
  exp: `<p>필수: σ π ∪ − ×. 유도: ∩, 세타·동등·자연 조인, 세미 조인, 디비전.</p>` },
{ id: 'kc-t3', st: 'k3', kind: 'choice', title: '관계적 완전성',
  q: `<p>"관계적으로 완전하다(relationally complete)"의 뜻은?</p>`,
  opts: ['모든 유도 연산자를 지원한다.', '필수 관계 대수 연산자만큼의 표현력을 가진다.', '집단 함수와 정렬을 지원한다.', '모든 질의를 한 줄로 쓸 수 있다.'], ans: 1,
  exp: `<p>어떤 질의어가 적어도 필수 연산자들만큼의 표현력을 가지면 관계적으로 완전하다고 해요.</p>` },
{ id: 'kc-t4', st: 'k3', kind: 'choice', title: '합집합 호환',
  q: `<p>EMPLOYEE(EMPNO, EMPNAME, TITLE, MANAGER, SALARY, DNO)와 DEPARTMENT(DEPTNO, DEPTNAME, FLOOR)에 대해 합집합 호환인 것은?</p>`,
  opts: ['EMPLOYEE ∪ DEPARTMENT', 'π<sub>DNO</sub>(EMPLOYEE) ∪ π<sub>DEPTNO</sub>(DEPARTMENT)', 'π<sub>DNO, SALARY</sub>(EMPLOYEE) ∪ π<sub>DEPTNO</sub>(DEPARTMENT)', 'π<sub>EMPNAME</sub>(EMPLOYEE) ∪ π<sub>DEPTNO</sub>(DEPARTMENT)'], ans: 1,
  exp: `<p>합집합 호환 = 애트리뷰트 수가 같고(n = m) 대응하는 도메인이 같아야 해요. DNO와 DEPTNO는 같은 도메인이에요. ④는 수는 같지만 이름과 번호의 도메인이 달라요.</p>` },
{ id: 'kc-t5', st: 'k3', kind: 'choice', title: '자연 조인의 차수',
  q: `<p>R(A, B, C)과 S(C, D)를 동등 조인 R ⋈<sub>R.C=S.C</sub> S 하면 차수가 5이다. 자연 조인 R *<sub>R.C, S.C</sub> S의 차수는?</p>`,
  opts: ['3', '4', '5', '6'], ans: 1,
  exp: `<p>자연 조인은 동등 조인 결과에서 조인 애트리뷰트를 <b>한 개 제외</b>해요: 5 − 1 = 4.</p>` },
{ id: 'kc-t6', st: 'k3', kind: 'choice', title: '조인 애트리뷰트가 널인 투플',
  q: `<p>EMPLOYEE의 조민희는 DNO가 널이다. EMPLOYEE ⋈<sub>DNO=DEPTNO</sub> DEPARTMENT의 결과에 조민희가 나타나는가?</p>`,
  opts: ['나타난다.', '나타나지 않는다.', 'DEPTNO가 널인 부서와 짝지어 나타난다.', '오류가 난다.'], ans: 1,
  exp: `<p>널은 어떤 값과도 같지 않아서 조인 조건을 만족하지 못해요. 이런 투플까지 결과에 넣으려고 만든 것이 <b>외부 조인</b>이에요.</p>` },
{ id: 'kc-t7', st: 'k3', kind: 'multi', title: '관계 대수의 한계',
  q: `<p>관계 대수의 한계로 <b>옳은 것을 모두</b> 고르시오.</p>`,
  opts: ['산술 연산을 할 수 없다.', '집단 함수를 지원하지 않는다.', '정렬을 나타낼 수 없다.', '데이터베이스를 수정할 수 없다.', '두 릴레이션을 조인할 수 없다.'], ans: [0, 1, 2, 3],
  exp: `<p>다섯 번째 한계는 "프로젝션 결과에 중복 투플이 필요할 때 이를 명시하지 못함"이에요. 조인은 당연히 표현할 수 있어요.</p>` },
{ id: 'kc-t8', st: 'k3', kind: 'fill', title: '세타 조인과 카티션 곱',
  q: `<p>세타 조인은 카티션 곱과 실렉션으로 표현할 수 있다: R ⋈<sub>θ</sub> S = [[0]]<sub>θ</sub>(R × S). θ에는 =, &lt;&gt;, &lt;=, &lt;, &gt;=, &gt; 중 하나가 오며, θ가 =이면 [[1]] 조인이라고 한다.</p>`,
  blanks: [['σ', '시그마', '실렉션'], ['동등']],
  exp: `<p>그래서 조인은 필수 연산자가 아니라 유도 연산자예요.</p>` },
{ id: 'kc-t9', st: 'k3', kind: 'choice', title: '외부 조인',
  q: `<p>R ⟖ S(오른쪽 외부 조인)에 대한 설명으로 옳은 것은?</p>`,
  opts: ['R의 모든 투플을 포함하고 S에 대응 투플이 없으면 S의 애트리뷰트를 널로 채운다.', 'S의 모든 투플을 포함하고 R에 대응 투플이 없으면 R의 애트리뷰트를 널로 채운다.', 'R과 S의 모든 투플을 포함한다.', '대응되는 투플만 포함한다.'], ans: 1,
  exp: `<p>① 왼쪽 외부 조인, ② 오른쪽 외부 조인, ③ 완전 외부 조인, ④ 일반 조인.</p>` },
{ id: 'kc-t10', st: 'k3', kind: 'essay', title: '디비전 정의 서술',
  q: `<p>디비전 연산자 R ÷ S의 정의를 서술하시오. (R의 차수 n+m, S의 차수 m)</p>`,
  ans: `차수가 n+m인 릴레이션 R(A1, …, An, B1, …, Bm)과 차수가 m인 릴레이션 S(B1, …, Bm)의 디비전 R ÷ S는 차수가 <b>n</b>이고, <b>S에 속하는 모든 투플 u</b>에 대하여 투플 t·u(t와 u를 결합한 것)가 <b>R에 존재하는 투플 t들의 집합</b>이다.`,
  kw: [['차수'], ['모든'], ['결합'], ['존재']] },

/* ── 4장 ── */
{ id: 'kc-q1', st: 'k4', kind: 'choice', title: 'SQL의 성격',
  q: `<p>SQL에 대한 설명으로 <b>옳은</b> 것은?</p>`,
  opts: ['원하는 데이터를 어떻게 찾을지(how)를 명시하는 절차적 언어다.', '원하는 데이터(what)만 명시하는 비절차적 언어다.', '데이터 검색만 할 수 있다.', '관계 대수와 관계가 없다.'], ans: 1,
  exp: `<p>SQL은 비절차적(선언적) 언어이고, 관계 대수를 기반으로 해요. 관계 대수는 검색만 하지만 SQL은 DDL·DML·DCL을 모두 제공해요.</p>` },
{ id: 'kc-q2', st: 'k4', kind: 'multi', title: '제약조건',
  q: `<p>제약조건에 대한 설명으로 <b class="warn">옳지 않은 것을 모두</b> 고르시오.</p>`,
  opts: ['UNIQUE는 테이블당 하나만 지정할 수 있다.', 'PRIMARY KEY는 테이블당 하나이며 자동으로 인덱스가 만들어진다.', 'CHECK는 애트리뷰트가 가질 수 있는 값의 범위를 제한한다.', '외래 키가 참조하는 컬럼은 참조되는 테이블에서 같은 데이터 타입이면서 기본 키로 정의되어 있어야 한다.', 'DEFAULT는 값을 지정하지 않으면 기본값을 넣는다.'], ans: [0],
  exp: `<p>UNIQUE(대체 키)는 여러 개 지정할 수 있어요. 테이블당 하나인 것은 PRIMARY KEY예요.</p>` },
{ id: 'kc-q3', st: 'k4', kind: 'choice', title: 'DISTINCT',
  q: `<p>SELECT 문 결과의 중복 투플에 대한 설명으로 옳은 것은?</p>`,
  opts: ['관계 대수처럼 항상 중복이 제거된다.', 'DISTINCT를 명시했을 때만 중복이 제거된다.', 'ORDER BY를 쓰면 중복이 제거된다.', '중복 투플은 오류를 일으킨다.'], ans: 1,
  exp: `<p>SQL의 테이블은 다중집합이라 중복을 허용해요. DISTINCT를 명시해야 중복이 제거돼요.</p>` },
{ id: 'kc-q4', st: 'k4', kind: 'choice', title: '집단 함수를 쓸 수 있는 곳',
  q: `<p>집단 함수(SUM, AVG, COUNT 등)를 쓸 수 있는 절만 모은 것은?</p>`,
  opts: ['SELECT, WHERE', 'SELECT, HAVING', 'WHERE, HAVING', 'FROM, WHERE'], ans: 1,
  exp: `<p>집단 함수는 SELECT 절과 HAVING 절에만 나타날 수 있어요. WHERE에는 쓸 수 없어요.</p>` },
{ id: 'kc-q5', st: 'k4', kind: 'choice', title: 'COUNT와 NULL',
  q: `<p>EMP 테이블 8행 중 COMM이 NULL인 행이 4개다. SELECT COUNT(*), COUNT(COMM) FROM EMP의 결과는?</p>`,
  opts: ['8, 8', '8, 4', '4, 8', '4, 4'], ans: 1,
  exp: `<p>COUNT(*)만 NULL이 있는 행까지 세고, COUNT(컬럼)을 비롯한 다른 집단 함수는 NULL을 무시해요.</p>` },
{ id: 'kc-q6', st: 'k4', kind: 'fill', title: '3값 논리',
  q: `<p>3값 논리에서 UNKNOWN AND FALSE = [[0]], UNKNOWN OR TRUE = [[1]], NOT UNKNOWN = [[2]]이다.</p>`,
  blanks: [['FALSE', 'F', '거짓'], ['TRUE', 'T', '참'], ['UNKNOWN', 'U', '알수없음', '알 수 없음']],
  exp: `<p>TRUE = 1, UNKNOWN = ½, FALSE = 0으로 두면 AND = min, OR = max, NOT = 1 − 값.</p>` },
{ id: 'kc-q7', st: 'k4', kind: 'choice', title: 'UNION과 UNION ALL',
  q: `<p>김창섭·이수민의 부서번호 {2, 3}와 개발부서 번호 {3}을 합칠 때, UNION ALL의 결과는?</p>`,

k3: { title: '3장 핵심 정리', lead: '연산자 분류, 연산마다 차수·카디날리티가 어떻게 바뀌는지, 한계와 추가된 연산자를 확인해요. 식을 직접 쓰는 연습은 관계대수 탭에서 해요.', body: `

<ul><li>SQL = 비절차적, 관계 대수 기반. DDL · DML · DCL</li><li>DDL: CREATE / ALTER / DROP (TABLE, DOMAIN, VIEW, INDEX는 SQL2 표준 아님), CREATE SCHEMA … AUTHORIZATION</li><li>제약조건: NOT NULL, UNIQUE(여러 개 가능), DEFAULT, CHECK, PRIMARY KEY(하나, 자동 인덱스), FOREIGN KEY(참조되는 컬럼은 같은 타입의 기본 키)</li><li>ALTER TABLE … ADD COLUMN / ADD CONSTRAINT / DROP CONSTRAINT</li><li>ON DELETE / ON UPDATE: NO ACTION, CASCADE, SET NULL, SET DEFAULT</li><li>SELECT와 FROM만 필수, DISTINCT를 명시해야 중복 제거</li><li>NULL: IS NULL로 검사, 3값 논리, COUNT(*)만 NULL 포함</li><li>집단 함수는 SELECT와 HAVING에만</li><li>UNION·EXCEPT·INTERSECT는 중복 제거, ALL을 붙이면 유지</li><li>중첩 질의: 스칼라(=), 다중집합(IN, ANY, ALL, EXISTS), 상관 중첩 질의는 외부 투플 수만큼 수행</li><li>트리거: ECA, 위반 시 동작 명시 / 주장: 위반 연산 자체를 막음, 대부분 DBMS 미지원</li><li>DELETE: 행만 삭제, 구조는 남음 (DROP TABLE은 구조까지)</li></ul>`, ex: [] },

{ id: 'kc-q24', st: 'k4', kind: 'essay', title: '트리거와 주장 비교',

  ans: `둘 다 SQL3에서 DB 무결성을 유지하고 비즈니스 규칙을 시행하기 위한 수단이다.<br><b>트리거</b>: 명시된 이벤트(INSERT, DELETE, UPDATE)가 발생할 때 조건을 검사해 동작을 수행하는 ECA 규칙. 제약조건 위반 시 <b>수행할 동작</b>을 명시한다. 대부분의 DBMS가 지원한다.<br><b>주장</b>: DB가 항상 만족해야 할 조건. 제약조건을 <b>위반하는 연산이 수행되지 않도록</b> 한다. 트리거보다 일반적인 제약조건이지만 대부분의 관계 DBMS가 아직 지원하지 않는다.`,
  kw: [['이벤트', 'ECA'], ['동작'], ['위반'], ['지원']] },
{ id: 'kc-q25', st: 'k4', kind: 'essay', title: 'WHERE와 HAVING 서술',

  ans: `<b>WHERE</b>: 그룹을 만들기 전에 <b>투플(행)</b>에 조건을 건다. 집단 함수를 쓸 수 없다.<br><b>HAVING</b>: GROUP BY로 만든 <b>그룹</b>에 조건을 건다. 집단 함수를 쓸 수 있고, HAVING에 나오는 컬럼은 GROUP BY에 있거나 집단 함수에 포함되어야 한다.`,

/* DDL 실행·채점 */
function ddlDB(setup) { const db = new SQLM.Database(); db.exec('PRAGMA foreign_keys = ON;'); if (setup) db.exec(setup); return db; }
const normDflt = v => v === null || v === undefined ? null : String(v).trim().replace(/^\((.*)\)$/, '$1').replace(/^'(.*)'$/, '$1');
function ddlShape(db) {
  const q = s => { const r = db.exec(s)[0]; return r ? r.values : []; };
  const qi = n => '"' + String(n).replace(/"/g, '""') + '"';
  return q("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").map(([n]) => {
    const info = q(`PRAGMA table_info(${qi(n)})`);
    const fks = {};
    q(`PRAGMA foreign_key_list(${qi(n)})`).forEach(([id, , table, from, to, onUpd, onDel]) => { (fks[id] ||= { cols: [], ref: table, refCols: [], onUpdate: onUpd, onDelete: onDel }); fks[id].cols.push(from); fks[id].refCols.push(to); });
    const idx = q(`PRAGMA index_list(${qi(n)})`).map(r => ({ name: r[1], origin: r[3], cols: q(`PRAGMA index_info(${qi(r[1])})`).map(x => x[2]) }));
    return { name: n, cols: info.map(r => r[1]), notnull: info.filter(r => r[3]).map(r => r[1]), dflt: Object.fromEntries(info.filter(r => r[4] !== null).map(r => [UP(r[1]), normDflt(r[4])])),
      pk: info.filter(r => r[5] > 0).sort((a, b) => a[5] - b[5]).map(r => r[1]), fks: Object.values(fks),
      uniques: idx.filter(i => i.origin === 'u').map(i => i.cols), indexes: idx.filter(i => i.origin === 'c').map(i => i.cols) };
  });
}
function ddlRunTests(db, tests) {
  return (tests || []).map(t => {
    try { let last = null; for (const st of db.iterateStatements(t.sql)) { const cols = st.getColumnNames(), rows = []; while (st.step()) rows.push(st.get()); if (cols.length) last = rows; } return { ok: true, rows: last }; }
    catch (e) { return { ok: false, err: sqlErrKo(e.message) }; }
  });
}
function gradeDDL(user, ref, uT, rT, tests) {
  const out = [], ok = m => out.push({ ok: true, m }), bad = m => out.push({ ok: false, m });
  const eqSet = (a, b) => a.length === b.length && a.every(x => b.some(y => UP(y) === UP(x)));
  const hasSet = (list, s) => list.some(x => eqSet(x, s));
  for (const r of ref) {

    const miss = r.cols.filter(c => !u.cols.some(d => UP(d) === UP(c))), extra = u.cols.filter(c => !r.cols.some(d => UP(d) === UP(c)));
    if (miss.length) bad(`${r.name}: 빠진 컬럼 ${miss.join(', ')}`);
    if (extra.length) bad(`${r.name}: 필요 없는 컬럼 ${extra.join(', ')}`);
    if (!miss.length && !extra.length) ok(`${r.name}의 컬럼 ${r.cols.length}개`);
    if (eqSet(u.pk, r.pk)) { if (r.pk.length) ok(`${r.name}의 기본 키 (${r.pk.join(', ')})`); }
    else bad(r.pk.length ? `${r.name}의 기본 키는 (${r.pk.join(', ')})여야 해요 (지금: ${u.pk.length ? '(' + u.pk.join(', ') + ')' : '없음'}).` : `${r.name}에는 기본 키가 없어야 해요 (지금: ${u.pk.join(', ')}).`);
    const nn = r.notnull.filter(c => !r.pk.some(k => UP(k) === UP(c)));
    nn.forEach(c => u.notnull.some(d => UP(d) === UP(c)) ? ok(`${r.name}.${c} NOT NULL`) : bad(`${r.name}.${c}에 NOT NULL이 없어요.`));
    u.notnull.filter(c => !r.notnull.some(d => UP(d) === UP(c)) && !r.pk.some(k => UP(k) === UP(c))).forEach(c => bad(`${r.name}.${c}에는 NOT NULL이 없어야 해요.`));
    r.uniques.forEach(s => hasSet(u.uniques, s) ? ok(`${r.name}의 UNIQUE (${s.join(', ')})`) : bad(`${r.name}: (${s.join(', ')})에 UNIQUE가 없어요.`));
    u.uniques.filter(s => !hasSet(r.uniques, s)).forEach(s => bad(`${r.name}: (${s.join(', ')})에는 UNIQUE가 없어야 해요.`));
    Object.entries(r.dflt).forEach(([c, v]) => u.dflt[c] === v ? ok(`${r.name}.${c} DEFAULT '${v}'`) : bad(`${r.name}.${c}의 기본값이 '${v}'가 아니에요 (지금: ${u.dflt[c] ?? '없음'}).`));
    Object.keys(u.dflt).filter(c => !(c in r.dflt)).forEach(c => bad(`${r.name}.${c}에는 DEFAULT가 없어야 해요.`));
    const left = [...u.fks];
    for (const f of r.fks) {

      if (i < 0) { bad(`${r.name}: 외래 키 (${f.cols.join(', ')}) → ${f.ref}(${f.refCols.join(', ')})가 없어요.`); continue; }

      if (g.onDelete !== f.onDelete) { good = false; bad(`${r.name}: 외래 키 (${f.cols.join(', ')})의 ON DELETE가 ${f.onDelete}가 아니에요 (지금: ${g.onDelete}).`); }
      if (g.onUpdate !== f.onUpdate) { good = false; bad(`${r.name}: 외래 키 (${f.cols.join(', ')})의 ON UPDATE가 ${f.onUpdate}가 아니에요 (지금: ${g.onUpdate}).`); }
      if (good) ok(`${r.name}의 외래 키 (${f.cols.join(', ')}) → ${f.ref}${f.onDelete !== 'NO ACTION' ? ' ON DELETE ' + f.onDelete : ''}${f.onUpdate !== 'NO ACTION' ? ' ON UPDATE ' + f.onUpdate : ''}`);
    }
    left.forEach(g => bad(`${r.name}에 필요 없는 외래 키 (${g.cols.join(', ')}) → ${g.ref}가 있어요.`));

function ddlSchemaHTML(shape) {
  if (!shape.length) return '<p class="kbd">테이블이 없어요.</p>';
  return `<ul class="schema ddl">${shape.map(t => {
    const fk = new Map(); t.fks.forEach(f => f.cols.forEach(c => fk.set(UP(c), f)));
    const uq = new Set(t.uniques.filter(s => s.length === 1).map(s => UP(s[0])));
    return `<li><b>${esc(t.name)}</b>(${t.cols.map(c => {
      const U = UP(c), tags = [];
      if (t.pk.some(k => UP(k) === U)) tags.push('PK');
      if (t.notnull.some(k => UP(k) === U)) tags.push('NOT NULL');
      if (uq.has(U)) tags.push('UNIQUE');
      if (U in t.dflt) tags.push(`DEFAULT '${t.dflt[U]}'`);
      const f = fk.get(U); if (f) tags.push(`FK→${f.ref}${f.onDelete !== 'NO ACTION' ? ' ON DELETE ' + f.onDelete : ''}${f.onUpdate !== 'NO ACTION' ? ' ON UPDATE ' + f.onUpdate : ''}`);
      const name = t.pk.some(k => UP(k) === U) ? `<u>${esc(c)}</u>` : esc(c);
      return tags.length ? `${name}<sup>${esc(tags.join(' · '))}</sup>` : name;
    }).join(', ')})${t.indexes.length ? ` <span class="kbd">인덱스: ${t.indexes.map(s => '(' + s.join(', ') + ')').join(' ')}</span>` : ''}</li>`;
  }).join('')}</ul>`;
}
