let S = { part: 'ra', cur: {}, res: {}, draft: {}, erd: {}, star: {} };
const PARTNAME = { ra: '관계대수', sql: 'SQL', erd: 'ERD', kc: '개념 확인' }, NEXTPART = { ra: 'sql', sql: 'erd', erd: 'kc' };
const endLabel = part => NEXTPART[part] ? `${PARTNAME[NEXTPART[part]]} 시작하기` : '처음으로';
/* 저장된 위치가 지금 문제집에 없으면(문제가 빠지거나 이름이 바뀐 경우) 그 파트의 첫 페이지로 */
const pageExists = (id, part) => !!id && (id.startsWith('c-') ? !!CONCEPTS[id.slice(2)] && stageOf[id.slice(2)].part === part : PROBS.some(x => x.id === id && x.part === part));
const goPart = part => go(pageExists(S.cur[part], part) ? S.cur[part] : seq(part)[0]);
const goEnd = part => NEXTPART[part] ? goPart(NEXTPART[part]) : go(seq(part)[0]);
try { const j = JSON.parse(localStorage.getItem(KEY) || 'null'); if (j) S = Object.assign(S, j); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const stageOf = Object.fromEntries(STAGES.map(s => [s.id, Object.assign(s, { idx: STAGES.filter(t => t.part === s.part).indexOf(s) })]));
STAGES.filter(s => s.part === 'kc').forEach(s => { s.idx += 1; });   // 개념 파트는 1장부터
PROBS.forEach(p => { p.part = stageOf[p.st].part; });
const list = part => PROBS.filter(p => p.part === part);
const numOf = p => list(p.part).indexOf(p) + 1;
/* 진행 순서: 단계마다 개념 페이지 → 그 단계 문제들 */
const seq = part => STAGES.filter(s => s.part === part).flatMap(s => [...(CONCEPTS[s.id] ? ['c-' + s.id] : []), ...PROBS.filter(p => p.st === s.id).map(p => p.id)]);
const itemName = id => id.startsWith('c-') ? `개념 · ${CONCEPTS[id.slice(2)].title}` : `문제 ${numOf(PROBS.find(p => p.id === id))}`;

function fmt(v) {
  if (v === null || v === undefined) return '<td class="null">NULL</td>';
  if (typeof v === 'number') return `<td class="n">${Number.isInteger(v) ? v : (Math.round(v * 100) / 100)}</td>`;
  return `<td>${esc(v)}</td>`;
}
function tableHTML(title, cols, rows, opt = {}) {
  const pk = new Set((opt.pk || []).map(UP));
  return `<div class="tbl"><div class="tbl-cap">${esc(title)}<span class="shape">${rows.length}행 × ${cols.length}열</span></div><div class="scroll"><table><tr>${cols.map(c => `<th${pk.has(UP(c)) ? ' class="pk"' : ''}>${esc(c)}</th>`).join('')}</tr>` +
    (rows.length ? rows.map((r, i) => `<tr${opt.mark && opt.mark.has(i) ? ' class="extra"' : opt.ok && opt.ok.has(i) ? ' class="okrow"' : ''}>${r.map(fmt).join('')}</tr>`).join('') : `<tr><td colspan="${Math.max(cols.length, 1)}" class="null">결과 없음 (0행)</td></tr>`) +
    `</table></div></div>`;
}
const baseTable = n => tableHTML(n, TABLES[n].cols, TABLES[n].rows, { pk: TABLES[n].pk });

function status(id) { return S.res[id] || ''; }
function setStatus(id, st) { if (S.res[id] === 'ok' && st !== 'ok') return; S.res[id] = st; save(); renderNav(); renderMeters(); }

/* 다시 볼 문제 체크 */
function starBtnHTML(id) {
  const on = !!S.star[id];
  return `<button type="button" class="starbtn${on ? ' on' : ''}" id="starBtn" aria-pressed="${on}" title="${on ? '체크 해제' : '나중에 다시 볼 문제로 체크'}">${on ? '★ 다시 볼 문제' : '☆ 다시 볼 문제로 체크'}</button>`;
}
function renderSheetStar(id) { const b = $('starBtn'); if (!b) return; b.outerHTML = starBtnHTML(id); $('starBtn').onclick = () => { toggleStar(id); renderSheetStar(id); }; }
function toggleStar(id) {
  if (S.star[id]) delete S.star[id]; else S.star[id] = Date.now();
  save(); renderNav(); renderMeters();
}
const STATUS_LABEL = { ok: '맞힘', bad: '다시 풀기', shown: '답 봄' };
function renderStarList() {
  const ids = PROBS.filter(p => S.star[p.id]);
  if (!ids.length) { $('starBody').innerHTML = '<p class="kbd">아직 체크한 문제가 없어요. 문제 제목 옆 <b>☆ 다시 볼 문제로 체크</b>를 누르면 여기에 모여요.</p>'; return; }
  $('starBody').innerHTML = ['ra', 'sql', 'erd', 'kc'].map(part => {
    const ps = ids.filter(p => p.part === part); if (!ps.length) return '';
    return `<h3>${PARTNAME[part]} · ${ps.length}문제</h3><ul class="starlist">${ps.map(p => {
      const st = stageOf[p.st], s0 = status(p.id);
      return `<li><button type="button" class="sl-open" data-open="${p.id}"><span class="sl-meta">${st.idx}단계 ${esc(st.name)} · 문제 ${numOf(p)}</span><b>${esc(p.title)}</b></button>${s0 ? `<span class="sl-st ${cls(s0)}">${STATUS_LABEL[s0] || ''}</span>` : ''}<button type="button" class="btn-ghost small" data-unstar="${p.id}">체크 해제</button></li>`;
    }).join('')}</ul>`;
  }).join('') + '<p class="kbd">문제를 누르면 바로 열려요. 체크는 문제 제목 옆 ★ 버튼으로도 풀 수 있어요.</p>';
}
const cls = st => !st ? '' : st === 'ok' ? 'ok' : st === 'shown' ? 'shown' : 'bad';
function renderMeters() {
  if ($('starN')) $('starN').textContent = Object.keys(S.star).length;
  for (const [part, m, b, name] of [['ra', 'mRA', 'bRA', '관계대수'], ['sql', 'mSQL', 'bSQL', 'SQL'], ['erd', 'mERD', 'bERD', 'ERD'], ['kc', 'mKC', 'bKC', '개념']]) {
    const L = list(part), ok = L.filter(p => S.res[p.id] === 'ok').length;
    $(m).textContent = `${name} ${ok} / ${L.length}`; $(b).style.width = (ok / L.length * 100) + '%';
  }
}
function renderNav() {
  const part = S.part, cur = S.cur[part];
  $('pRA').setAttribute('aria-pressed', part === 'ra'); $('pSQL').setAttribute('aria-pressed', part === 'sql'); $('pERD').setAttribute('aria-pressed', part === 'erd'); $('pKC').setAttribute('aria-pressed', part === 'kc');
  const curSt = (PROBS.find(p => p.id === cur) || {}).st;
  $('stages').innerHTML = STAGES.filter(s => s.part === part).map(s => {
    const ps = PROBS.filter(p => p.st === s.id), ok = ps.filter(p => S.res[p.id] === 'ok').length;
    const cid = 'c-' + s.id;
    const cchip = CONCEPTS[s.id] ? `<button type="button" class="chip concept ${S.res[cid] ? 'read' : ''}${cid === cur ? ' cur' : ''}" data-go="${cid}" title="개념 · ${esc(CONCEPTS[s.id].title)}">개념</button>` : '';
    return `<li class="stage${s.id === curSt ? ' here' : ''}"><div class="st-head"><span class="st-no">${String(s.idx).padStart(2, '0')}</span><span class="st-name">${esc(s.name)}</span><span class="st-count">${ps.length ? `${ok}/${ps.length}` : ''}</span></div>
      <p class="st-sub">${esc(s.sub)}</p><div class="chips">${cchip}${ps.map(p => `<button type="button" class="chip ${status(p.id)}${p.id === cur ? ' cur' : ''}${p.jb ? ' jb' : ''}${S.star[p.id] ? ' star' : ''}" data-go="${p.id}" title="${esc(p.title)}${S.star[p.id] ? ' (다시 볼 문제)' : ''}">${numOf(p)}</button>`).join('')}</div></li>`;
  }).join('');
}

/* 예제 식에 나오는 테이블을 찾아 입력 테이블로 보여 준다 */
function inputTablesHTML(e, code) {
  const extra = e.extra || {};
  const clean = code.replace(/'[^'\n]*'?/g, ' ').replace(/--.*$/gm, ' ').replace(/\bAS\s+("[^"]*"|[\w가-힣]+)/gi, ' ');
  const assigned = new Set([...clean.matchAll(/^\s*([\w가-힣]+)\s*(←|<-|:=|=(?!=))/gm)].map(m => UP(m[1])));
  const names = [];
  for (const m of clean.matchAll(/[A-Za-z_가-힣][\w가-힣]*/g)) {
    const U = UP(m[0]); if (assigned.has(U)) continue;
    const key = Object.keys(extra).find(k => UP(k) === U) || Object.keys(TABLES).find(k => UP(k) === U);
    if (key && !names.includes(key)) names.push(key);
  }
  if (!names.length) return '<p class="kbd">식에 테이블 이름이 없어요.</p>';
  return names.map(k => extra[k] ? tableHTML(k, extra[k].cols, extra[k].rows) : baseTable(k)).join('');
}

/* 개념 페이지 맨 위 연습장: 파트마다 하나, 내용은 저장된다 */
const SB_DEFAULT = { ra: `π[SNAME, AGE](σ[AGE > 20](STUDENT))`, sql: `SELECT SNAME, AGE\nFROM STUDENT\nWHERE AGE > 20;` };
function sandboxHTML(part) {
  if (part === 'kc') return '';
  const title = { ra: '관계 대수 연습장', sql: 'SQL 연습장', erd: 'ERD 연습장' }[part];
  const sub = { ra: '아무 식이나 써서 실행해 보세요. 채점은 하지 않아요.', sql: '아무 SQL이나 실행해 보세요. 실행할 때마다 데이터가 처음 상태로 돌아가요.', erd: '자유롭게 그리고 "SQL로 변환"을 눌러 보세요. 그린 내용은 저장돼요.' }[part];
  const head = `<summary><b>${title}</b><span>${sub}</span></summary>`;
  if (part === 'erd') return `<details class="sandbox" open>${head}<div id="sbErd"></div><div class="erd-out" id="erdOut"></div></details>`;
  const sb = S.sandbox || {};
  return `<details class="sandbox" open>${head}
    <div class="ex-code">${part === 'ra' ? palHTML(true) : ''}<textarea id="sbEd" class="ex-ed" spellcheck="false" autocapitalize="off" aria-label="${title}">${esc(sb[part] ?? SB_DEFAULT[part])}</textarea>
    <div class="ex-bar"><button type="button" class="btn small primary" id="sbRun">실행</button><span class="kbd">⌘/Ctrl + Enter</span><button type="button" class="btn small ghost" id="sbData">전체 데이터 보기</button>${part === 'ra' ? '<span class="kbd">s[ → σ[ · p[ → π[ · join → ⋈ · x → × · / → ÷</span>' : ''}</div></div>
    <div class="ex-step">입력 테이블</div><div class="tbl-row ex-tables" id="sbTables"></div>
    <div class="ex-step">결과</div><div id="sbOut"></div></details>`;
}
function wireSandbox(part) {
  if (part === 'kc') return;
  if (part === 'erd') {
    mountERDEditor($('sbErd'), S.erd.__sandbox, { onChange: m => { S.erd.__sandbox = m; save(); }, onConvert: m => showConvert(m) });
    return;
  }
  const ed = $('sbEd'); if (!ed) return;
  const run = () => {
    const src = ed.value, out = $('sbOut');
    $('sbTables').innerHTML = inputTablesHTML({}, src);
    const show = r => { out.innerHTML = `<div class="tbl-row">${tableHTML('결과 릴레이션', r.cols, r.rows)}</div>`; };
    const fail = err => { out.innerHTML = verdict('err', '실행 오류', `<div>${esc(err.message)}</div>`); };
    if (!src.trim()) { out.innerHTML = ''; return; }
    if (part === 'ra') { try { show(runRA(src)); } catch (err) { fail(err); } }
    else { out.innerHTML = '<p class="kbd">SQL 실행기를 준비하는 중이에요...</p>'; sqlReady.then(() => { if (!SQLM) return fail(new Error('SQL 실행기를 불러오지 못했어요. 인터넷 연결을 확인하세요.')); try { show(runSQL(src)); } catch (err) { fail(err); } }); }
  };
  if (part === 'ra') raKeys(ed); else editKeys(ed);
  ed.addEventListener('input', () => { (S.sandbox ||= {})[part] = ed.value; save(); autoGrow(ed, 40); });
  ed.addEventListener('keydown', ev => { if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') { ev.preventDefault(); run(); } });
  $('sbRun').onclick = run;
  $('sbData').onclick = () => $('openData').click();
  autoGrow(ed, 40); run();
}

/* 개념 페이지 */
function renderConcept(sid) {
  const st = stageOf[sid], c = CONCEPTS[sid], part = st.part, sq = seq(part), id = 'c-' + sid, i = sq.indexOf(id);
  const probs = PROBS.filter(p => p.st === sid);
  const prev = sq[i - 1], next = sq[i + 1];
  let body = c.body.replace(/@@(\d+)@@/g, (_, n) => {
    const e = c.ex[+n]; if (!e) return '';
    if (e.k === 'steps') return `<figure class="ex steps-ex" data-steps="${n}"><figcaption>${e.cap}</figcaption><div class="ex-step">입력 테이블</div><div class="tbl-row ex-tables">${Object.entries(e.extra).map(([k, t]) => tableHTML(k, t.cols, t.rows)).join('')}</div><div class="st-body"></div></figure>`;
    if (e.k === 'erd') return `<figure class="ex erd-ex" data-erdex="${n}"><figcaption>${e.cap}</figcaption><div class="erd-view"></div>${e.map ? '<div class="erd-map"></div>' : ''}</figure>`;
    return `<figure class="ex" data-ex="${n}"><figcaption>${e.cap}</figcaption>
      <div class="ex-step">① 입력 테이블</div><div class="tbl-row ex-tables">${inputTablesHTML(e, e.code)}</div>
      <div class="ex-step">② ${e.k === 'ra' ? '식' : 'SQL'}</div>
      <div class="ex-code">${e.k === 'ra' ? palHTML(true) : ''}<textarea class="ex-ed${e.k === 'ra' ? ' ra' : ''}" spellcheck="false" autocapitalize="off" aria-label="예제 ${+n + 1} ${e.k === 'ra' ? '관계 대수 식' : 'SQL'}">${esc(e.code)}</textarea>
      <div class="ex-bar"><button type="button" class="btn small" data-run="${n}">실행</button><button type="button" class="btn small ghost" data-reset="${n}">원래대로</button><span class="kbd">${e.k === 'ra' ? '관계 대수' : 'SQL'} · 고쳐서 실행해 보세요</span></div></div>
      <div class="ex-step">③ 결과</div><div class="ex-out" id="exo${n}"></div></figure>`;
  });
  $('sheet').innerHTML = `
    <div class="crumb"><b>${PARTNAME[part]} ${st.idx}단계 · ${esc(st.name)}</b><span>개념</span></div>
    <h2 class="c-title">${esc(c.title)}</h2>
    <p class="lead">${c.lead}</p>
    ${sandboxHTML(part)}
    <div class="concept">${body}</div>
    ${probs.length ? `<div class="go-probs"><div><b>이 단계 문제 ${probs.length}개</b><span>${probs.map(p => esc(p.title)).join(' · ')}</span></div><button type="button" class="btn primary" id="toProbs">문제 풀기 →</button></div>` : ''}
    <nav class="pager">
      <button type="button" class="btn" id="prev" ${prev ? '' : 'disabled'}>← ${prev ? esc(itemName(prev)) : '이전'}</button>
      <button type="button" class="btn" id="next">${next ? (next.startsWith('c-') ? esc(itemName(next)) : '문제 풀기') : endLabel(part)} →</button>
    </nav>`;
  const runEx = n => {
    const e = c.ex[n], fig = $('sheet').querySelector(`[data-ex="${n}"]`), src = fig.querySelector('.ex-ed').value, out = $('exo' + n);
    fig.querySelector('.ex-tables').innerHTML = inputTablesHTML(e, src);
    const show = r => { out.innerHTML = `<div class="tbl-row">${tableHTML('결과 릴레이션', r.cols, r.rows)}</div>`; };
    const fail = err => { out.innerHTML = verdict('err', '실행 오류', `<div>${esc(err.message)}</div>`); };
    if (e.k === 'ra') { try { show(runRA(src, e.extra)); } catch (err) { fail(err); } }
    else { out.innerHTML = '<p class="kbd">SQL 실행기를 준비하는 중이에요...</p>'; sqlReady.then(() => { if (!SQLM) return fail(new Error('SQL 실행기를 불러오지 못했어요. 인터넷 연결을 확인하세요.')); try { show(runSQL(src)); } catch (err) { fail(err); } }); }
  };
  $('sheet').querySelectorAll('.ex-ed').forEach(ed => {
    if (ed.classList.contains('ra')) raKeys(ed);
    autoGrow(ed, 40);
    ed.addEventListener('input', () => autoGrow(ed, 40));
    ed.addEventListener('keydown', ev => { if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') { ev.preventDefault(); runEx(+ed.closest('[data-ex]').dataset.ex); } });
  });
  $('sheet').querySelectorAll('[data-run]').forEach(b => b.onclick = () => runEx(+b.dataset.run));
  $('sheet').querySelectorAll('[data-reset]').forEach(b => b.onclick = () => { const n = +b.dataset.reset, ed = $('sheet').querySelector(`[data-ex="${n}"] .ex-ed`); ed.value = c.ex[n].code; autoGrow(ed, 40); runEx(n); });
  c.ex.forEach((_, n) => { if ($('exo' + n)) runEx(n); });
  wireSandbox(part);
  $('sheet').querySelectorAll('[data-steps]').forEach(fig => {
    const e = c.ex[+fig.dataset.steps], body = fig.querySelector('.st-body'); let i = 0;
    const draw = () => {
      const st = e.steps[i];
      const prog = st.solo ? st.code : e.steps.slice(0, i + 1).filter(x => !x.solo).map(x => x.code).join('\n');
      let tbl;
      try {
        const res = runRA(prog, e.extra); let mark = null, ok = null;
        if (st.mark) { const keys = new Set(runRA(st.mark, e.extra).rows.map(keyOf)); mark = new Set(); ok = new Set(); res.rows.forEach((row, j) => (keys.has(keyOf(row)) ? ok : mark).add(j)); }
        tbl = tableHTML(st.title, res.cols, res.rows, { mark, ok });
      } catch (err) { tbl = verdict('err', '실행 오류', `<div>${esc(err.message)}</div>`); }
      const lines = e.steps.filter(x => !x.solo).map((x, j) => `<span class="${x === st ? 'cur' : j < i ? 'done' : 'todo'}">${esc(x.code)}</span>`).join('\n');
      body.innerHTML = `<div class="st-nav" role="tablist">${e.steps.map((x, j) => `<button type="button" role="tab" aria-selected="${j === i}" data-sj="${j}" class="${j === i ? 'on' : j < i ? 'done' : ''}">${x.solo ? '확인' : j + 1}</button>`).join('')}</div>
        <div class="st-grid"><div class="st-left"><pre class="st-code">${st.solo ? `<span class="cur">${esc(st.code)}</span>` : lines}</pre><div class="st-say">${st.say}</div></div><div class="st-right tbl-row">${tbl}</div></div>
        <div class="st-btns"><button type="button" class="btn small" data-sp ${i ? '' : 'disabled'}>← 이전</button><button type="button" class="btn small primary" data-sn ${i < e.steps.length - 1 ? '' : 'disabled'}>다음 →</button></div>`;
      body.querySelectorAll('[data-sj]').forEach(b => b.onclick = () => { i = +b.dataset.sj; draw(); });
      body.querySelector('[data-sp]').onclick = () => { if (i) { i--; draw(); } };
      body.querySelector('[data-sn]').onclick = () => { if (i < e.steps.length - 1) { i++; draw(); } };
    };
    draw();
  });
  $('sheet').querySelectorAll('[data-erdex]').forEach(fig => {
    const e = c.ex[+fig.dataset.erdex], m = specToModel(e.spec);
    viewERD(fig.querySelector('.erd-view'), m);
    const mp = fig.querySelector('.erd-map');
    if (mp) { const r = mapERD(canonERD(m)); mp.innerHTML = `<div class="ex-step">사상 결과: 릴레이션 스키마</div>${schemaHTML(r.tables)}<div class="ex-step">CREATE TABLE</div><pre class="fxpre">${esc(erdSQL(r.tables))}</pre>`; }
  });
  if ($('toProbs')) $('toProbs').onclick = () => go(probs[0].id);
  $('prev').onclick = () => prev && go(prev);
  $('next').onclick = () => next ? go(next) : goEnd(part);
}

let hintN = 0;
function go(id) {
  if (id && id.startsWith('c-')) {
    const sid = id.slice(2); if (!CONCEPTS[sid]) return;
    const part = stageOf[sid].part;
    S.part = part; S.cur[part] = id; S.res[id] = 'read'; save();
    renderNav(); renderConcept(sid);
  } else {
    const p = PROBS.find(x => x.id === id); if (!p) return;
    S.part = p.part; S.cur[p.part] = id; save();
    hintN = 0; renderNav(); renderSheet(p);
  }
  window.scrollTo(0, 0);
  regrowSoon();
  if (window.innerWidth <= 880) $('aside').classList.add('closed'), $('navToggle').textContent = '단계 목록 펼치기';
}

const PAL_RA = [['σ', 'σ[]()', 2], ['π', 'π[]()', 2], ['ρ', 'ρ[]()', 2], ['γ', 'γ[; COUNT() AS CNT]()', 2], null,
  ['×', ' × '], ['⋈', ' ⋈[] ', 3], ['*', ' * '], ['⟕', ' ⟕ '], ['⟖', ' ⟖ '], ['⟗', ' ⟗ '], ['÷', ' ÷ '], null,

      const low = txt.toLowerCase(), hits = p.kw.map(g => g.some(w => low.includes(w.toLowerCase())));

      out.innerHTML = verdict(n === p.kw.length ? 'ok' : 'err', `핵심어 ${n} / ${p.kw.length}개를 썼어요.`, `<div class="kwlist">${p.kw.map((g, i) => `<span class="${hits[i] ? 'ok' : 'bad'}">${esc(g[0])}</span>`).join('')}</div><span class="note">핵심어는 참고용이에요. 아래 모범 답안과 비교해서 스스로 채점하세요.</span>`);
    } else out.innerHTML = txt ? '' : verdict('err', '답을 쓰지 않았어요.', '<span class="note">머릿속으로 답을 떠올린 뒤 모범 답안과 비교해도 돼요.</span>');
    $('answer').innerHTML = essayAnswerHTML(p); wireSelfGrade(p);
    return;
  }
  if (p.kind === 'erdfree') { showConvert(S.erd[p.id]); if (S.erd[p.id] && S.erd[p.id].nodes.length) setStatus(p.id, 'ok'); return; }
  if (p.kind === 'erd') {
    const m = S.erd[p.id];
    if (!m || !m.nodes.length) { out.innerHTML = verdict('err', '먼저 ER 다이어그램을 그려 주세요.'); return; }
    const items = gradeERD(m, specToModel(p.spec)), nbad = items.filter(i => !i.ok).length;
    out.innerHTML = (nbad ? verdict('bad', `고칠 곳이 ${nbad}개 있어요.`, '<span class="note">✗ 항목을 고친 뒤 다시 채점하세요. 엔티티·관계 이름은 문제에 나온 단어 그대로 써야 해요.</span>')
      : verdict('ok', '정답이에요. 엔티티, 애트리뷰트, 관계, 카디날리티가 모두 맞아요.')) + checklistHTML([...items.filter(i => !i.ok), ...items.filter(i => i.ok)]);
    setStatus(p.id, nbad ? 'bad' : 'ok'); if (!nbad) reveal(p, true);
    return;
  }
  if (p.kind === 'ddl') {
    const src = $('ed').value; S.draft[p.id] = src; save();
    if (!src.trim()) { out.innerHTML = verdict('err', 'DDL 문을 입력하세요.'); return; }
    out.innerHTML = verdict('err', 'SQL 실행기를 준비하는 중이에요...');
    await sqlReady;
    if (!SQLM) { out.innerHTML = verdict('err', 'SQL 실행기를 불러오지 못했어요.', '<span class="note">인터넷 연결을 확인하고 새로고침하세요.</span>'); return; }
    let dbU;
    try { dbU = ddlDB(p.setup); dbU.exec(prepSQL(src)); }
    catch (e) { if (dbU) dbU.close(); out.innerHTML = verdict('err', '실행 오류', `<div>${esc(sqlErrKo(e.message))}</div>`); setStatus(p.id, 'bad'); return; }
    const dbR = ddlDB(p.setup); dbR.exec(p.ans);
    const uS = ddlShape(dbU), rS = ddlShape(dbR), uT = ddlRunTests(dbU, p.tests), rT = ddlRunTests(dbR, p.tests);
    dbU.close(); dbR.close();
    const items = gradeDDL(uS, rS, uT, rT, p.tests), nbad = items.filter(i => !i.ok).length;
    out.innerHTML = (nbad ? verdict('bad', `고칠 곳이 ${nbad}개 있어요.`) : verdict('ok', '정답이에요. 테이블 구조와 제약조건이 모두 맞아요.'))
      + checklistHTML([...items.filter(i => !i.ok), ...items.filter(i => i.ok)]) + `<div class="ex-step" style="margin-top:12px">내가 만든 스키마</div>${ddlSchemaHTML(uS)}`;
    setStatus(p.id, nbad ? 'bad' : 'ok'); if (!nbad) reveal(p, true);
    return;
  }
  if (p.kind === 'erdsql') {
    const src = $('ed').value; S.draft[p.id] = src; save();
    if (!src.trim()) { out.innerHTML = verdict('err', 'CREATE TABLE 문을 입력하세요.'); return; }
    out.innerHTML = verdict('err', 'SQL 실행기를 준비하는 중이에요...');
    await sqlReady;
    if (!SQLM) { out.innerHTML = verdict('err', 'SQL 실행기를 불러오지 못했어요.', '<span class="note">인터넷 연결을 확인하고 새로고침하세요.</span>'); return; }
    let user;
    try { user = introspectSQL(src); } catch (e) { out.innerHTML = verdict('err', '실행 오류', `<div>${esc(e.message)}</div>`); setStatus(p.id, 'bad'); return; }
    if (!user.length) { out.innerHTML = verdict('err', '만들어진 테이블이 없어요. CREATE TABLE 문을 써 주세요.'); return; }
    const items = gradeSchema(user, mapERD(canonERD(specToModel(p.spec))).tables), nbad = items.filter(i => !i.ok).length;
    out.innerHTML = (nbad ? verdict('bad', `고칠 곳이 ${nbad}개 있어요.`) : verdict('ok', '정답이에요. 테이블, 기본 키, 외래 키가 모두 맞아요.'))
      + checklistHTML([...items.filter(i => !i.ok), ...items.filter(i => i.ok)]) + `<div class="ex-step" style="margin-top:12px">내가 만든 스키마</div>${schemaHTML(user)}`;
    setStatus(p.id, nbad ? 'bad' : 'ok'); if (!nbad) reveal(p, true);
    return;
  }
  if (p.kind === 'fill') {
    let all = true;
    p.blanks.forEach((acc, i) => {
      const el = $('b' + i), v = el.value.replace(/\s+/g, '').toUpperCase();
      const ok = acc.some(a => a.replace(/\s+/g, '').toUpperCase() === v);
      el.classList.toggle('ok', ok); el.classList.toggle('bad', !ok); if (!ok) all = false;
    });
    out.innerHTML = all ? verdict('ok', '정답이에요.') : verdict('bad', '아직 틀린 빈칸이 있어요.', '<span class="note">빨간 칸을 다시 생각해 보세요. 막히면 정답과 해설을 펼쳐 보세요.</span>');
    setStatus(p.id, all ? 'ok' : 'bad'); if (all) reveal(p, true);
    return;
  }
  if (p.kind === 'choice' || p.kind === 'multi') {
    const sel = [...document.querySelectorAll('#opts input:checked')].map(i => +i.value);
    if (!sel.length) { out.innerHTML = verdict('err', '답을 골라 주세요.'); return; }
    const want = p.kind === 'multi' ? p.ans : [p.ans];
    const ok = sel.length === want.length && sel.every(x => want.includes(x));
    p.opts.forEach((_, i) => { const l = $('opt' + i); l.classList.toggle('ok', ok && want.includes(i)); l.classList.toggle('bad', !ok && sel.includes(i) && !want.includes(i)); });
    out.innerHTML = ok ? verdict('ok', '정답이에요.') : verdict('bad', '틀렸어요.', `<span class="note">${p.kind === 'multi' ? '해당하는 것을 모두 골라야 해요. ' : ''}다시 골라 보거나 해설을 펼쳐 보세요.</span>`);
    setStatus(p.id, ok ? 'ok' : 'bad'); if (ok) reveal(p, true);
    return;
  }
  const src = $('ed').value; S.draft[p.id] = src; save();
  if (!src.trim()) { out.innerHTML = verdict('err', `${p.kind === 'ra' ? '식' : 'SQL'}을 입력하세요.`); return; }
  let user;
  try {
    if (p.kind === 'ra') user = runRA(src, p.extra);
    else {
      out.innerHTML = verdict('err', 'SQL 실행기를 준비하는 중이에요...');
      await sqlReady;
      if (!SQLM) { out.innerHTML = verdict('err', 'SQL 실행기를 불러오지 못했어요.', '<span class="note">인터넷 연결을 확인하고 새로고침하세요. 그동안은 "정답과 해설"로 답을 비교할 수 있어요.</span>'); return; }
      user = runSQL(src, p.check);
    }
  } catch (e) {
    let where = '';
    if (e.pos !== undefined && src.includes('\n')) where = ` <span class="note">(${src.slice(0, e.pos).split('\n').length}번째 줄)</span>`;
    out.innerHTML = verdict('err', '실행 오류', `<div>${esc(e.message)}${where}</div>`);
    setStatus(p.id, 'bad'); return;
  }
  const rule = ruleCheck(p, src, user);
  let exp; try { exp = await expectedOf(p); } catch (e) { out.innerHTML = verdict('err', esc(e.message)); return; }
  const c = compare(user, exp, p.ordered);
  const title = p.check ? '실행 후 확인 질의 결과' : '내 결과';
  let html;
  if (rule) html = verdict('bad', '조건을 지키지 않았어요.', `<div>${esc(rule)}</div>${c.ok ? '<span class="note">결과 자체는 정답과 같아요.</span>' : ''}`);
  else if (c.ok) html = verdict('ok', '정답이에요.', c.note ? `<span class="note">${esc(c.note)}</span>` : '');
  else html = verdict('bad', '결과가 정답과 달라요.', `<div>${esc(c.msg)}</div><span class="note">정답은 ${exp.rows.length}행 × ${exp.cols.length}열이에요.</span>`);
  out.innerHTML = html + `<div class="tbl-row">${tableHTML(title, user.cols, user.rows, { mark: c.ok ? null : c.extraIdx })}</div>`;
  const ok = c.ok && !rule;
  setStatus(p.id, ok ? 'ok' : 'bad');
  if (ok) reveal(p, true);
}
function ruleCheck(p, src, user) {
  if (p.kind === 'ra') {
    if (p.essential) { const bad = ['⋈', '*', '÷', '∩', '⟕', '⟖', '⟗', 'γ'].filter(o => user.used.has(o)); if (bad.length) return `필수 연산자(σ, π, ∪, −, ×)만 써야 해요. 지금 쓴 유도 연산자: ${bad.join(' ')}`; }
    if (p.req && !p.req.some(o => user.used.has(o))) return `이 문제는 ${p.req.join(' 또는 ')} 연산자를 써서 풀어야 해요.`;
  } else {
    const clean = src.replace(/'(?:[^']|'')*'/g, "''").replace(/--.*$/gm, '');
    for (const [re, msg] of p.need || []) if (!re.test(clean)) return msg;
    for (const [re, msg] of p.forbid || []) if (re.test(clean)) return msg;
  }
  return null;
}
async function showExpected(p) {
  let exp; try { exp = await expectedOf(p); } catch (e) { $('out').innerHTML = verdict('err', esc(e.message)); return; }
  const box = document.createElement('div'); box.className = 'tbl-row';
  box.innerHTML = tableHTML('정답 결과', exp.cols, exp.rows);
  const old = $('out').querySelector('.exp-res'); if (old) old.remove();
  box.classList.add('exp-res'); $('out').appendChild(box);
}
function reveal(p, auto) {
  if (p.kind === 'essay') { if (status(p.id) !== 'ok') setStatus(p.id, 'shown'); $('answer').innerHTML = essayAnswerHTML(p); wireSelfGrade(p); return; }
  if (!auto && status(p.id) !== 'ok') setStatus(p.id, 'shown');
  let ans = '';
  if (p.kind === 'ra' || p.kind === 'sql' || p.kind === 'ddl') ans = `<h3>모범 답안</h3><pre>${esc(p.ans)}</pre>`;
  else if (p.kind === 'erd') ans = `<h3>정답 ER 다이어그램</h3><div class="erd-view" id="ansView"></div>`;
  else if (p.kind === 'erdsql') { const r = mapERD(canonERD(specToModel(p.spec))); ans = `<h3>모범 답안</h3>${schemaHTML(r.tables)}<pre>${esc(erdSQL(r.tables))}</pre>`; }
  else if (p.kind === 'erdfree') ans = '';
  else if (p.kind === 'fill') ans = `<h3>정답</h3><pre>${p.blanks.map((a, i) => `(${i + 1}) ${a[0]}`).join('\n')}</pre>`;
  else ans = `<h3>정답</h3><pre>${(p.kind === 'multi' ? p.ans : [p.ans]).map(i => esc(p.opts[i])).join('\n')}</pre>`;
  $('answer').innerHTML = `<div class="answer">${ans}<h3>해설</h3><div class="exp">${p.exp}</div></div>`;
  if ($('ansView')) viewERD($('ansView'), specToModel(p.spec));
  if (!auto && (p.kind === 'ra' || p.kind === 'sql')) showExpected(p);
}

/* 이벤트 */
$('sheet').addEventListener('click', e => {           // 기호 버튼 → 같은 칸의 입력창에 넣기
  const b = e.target.closest('[data-ins]'); if (!b) return;
  const box = b.closest('.work, .ex-code'); insertAt(box && box.querySelector('textarea'), b.dataset.ins, +b.dataset.back);
});
$('stages').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
$('pRA').onclick = () => goPart('ra');
$('pSQL').onclick = () => goPart('sql');
$('pERD').onclick = () => goPart('erd');
$('pKC').onclick = () => goPart('kc');
$('navToggle').onclick = () => { const a = $('aside'); a.classList.toggle('closed'); $('navToggle').textContent = a.classList.contains('closed') ? '단계 목록 펼치기' : '단계 목록 접기'; };
let resetArmed = null;
$('resetAll').onclick = () => {
  const b = $('resetAll');
  if (!resetArmed) { b.textContent = '정말 지울까요? 한 번 더'; b.classList.add('warn'); resetArmed = setTimeout(() => { resetArmed = null; b.textContent = '기록 초기화'; b.classList.remove('warn'); }, 3500); return; }
  clearTimeout(resetArmed); resetArmed = null; b.textContent = '기록 초기화'; b.classList.remove('warn');
  S = { part: 'ra', cur: {}, res: {}, draft: {}, erd: {}, sandbox: {}, star: {} }; save();
  PROBS.forEach(p => { delete p._exp; });
  renderMeters(); go(seq('ra')[0]);
};
$('openData').onclick = () => {
  $('dataBody').innerHTML = GROUPS.map(([g, ns]) => `<h3>${esc(g)}</h3><div class="tbl-row">${ns.map(baseTable).join('')}</div>`).join('') + '<p class="kbd">밑줄 친 열은 기본키예요.</p>';
  $('dataDlg').showModal();
};
$('closeData').onclick = () => $('dataDlg').close();
$('openStar').onclick = () => { renderStarList(); $('starDlg').showModal(); };
$('closeStar').onclick = () => $('starDlg').close();
$('starDlg').addEventListener('click', e => {
  if (e.target === $('starDlg')) return $('starDlg').close();
  const o = e.target.closest('[data-open]'); if (o) { $('starDlg').close(); go(o.dataset.open); return; }
  const u = e.target.closest('[data-unstar]'); if (u) { toggleStar(u.dataset.unstar); renderStarList(); const cur = S.cur[S.part]; if (cur === u.dataset.unstar) renderSheetStar(cur); }
});
$('dataDlg').addEventListener('click', e => { if (e.target === $('dataDlg')) $('dataDlg').close(); });

renderMeters();
goPart(PARTNAME[S.part] ? S.part : 'ra');
